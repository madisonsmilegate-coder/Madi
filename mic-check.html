<html lang="en">

<meta charset="utf-8">

<title>Mic Check</title>
<style>

*{box-sizing:border-box}
body{

  font-family:ui-monospace,"SF Mono",Menlo,Consolas,monospace;

.wrap{max-width:760px;margin:0 auto;padding:28px 0 80px}
h1{font-size:clamp(26px,7vw,44px);margin:0;letter-spacing:-1px;line-height:1.05}

.sub{color:var(--dim);font-size:13px;margin:6px 0 24px;text-transform:uppercase;letter-spacing:2px}

.bar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:10px}
.count{color:var(--dim);font-size:12px}
.count.warn{color:var(--bad)}

.judge .who{color:var(--dim);font-size:12px;margin-bottom:10px}
.crit{font-size:14px;margin:8px 0}
.quote{border-left:2px solid var(--line);padding-left:10px;color:var(--dim);font-style:italic;margin:6px 0}

  font-size:13px;letter-spacing:.5px;margin:7px 0 9px;

.pop.huge{color:var(--accent2);font-weight:700;font-size:15px;letter-spacing:1px}

@media (prefers-reduced-motion:reduce){

/* ---------------- text analysis engine ---------------- */
const VOWELS="aeiouy";
const STOP=new Set("the a an and or but if of to in on at is are was were be been i you he she it we they my your his her its our their me him them that this so for with as not no nah yeah got get like just".split(" "));

function words(s){return (s.toLowerCase().match(/[a-z']+/g)||[]);}
function lines(s){return s.split("\n").map(l=>l.trim()).filter(Boolean);}

function syllables(w){
  w=w.toLowerCase().replace(/[^a-z]/g,"");
  if(!w) return 0;
  if(w.length<=3) return 1;
  w=w.replace(/(?:[^laeiouy]es|ed|[^laeiouy]e)$/,"").replace(/^y/,"");
  const m=w.match(/[aeiouy]{1,2}/g);
  return m?m.length:1;
}
/* Phonetics: a rhyme in battle rap is a TAIL of matching vowel sounds running
   across the last few syllables of a line, not just the final word. We reduce
   each line to its trailing vowel-sound sequence and measure how deep two
   tails agree. Depth 1 = plain rhyme. Depth 2+ = a multisyllabic. */
function norm(w){
  w=w.toLowerCase().replace(/[^a-z]/g,"");
  if(/[^aeiouy]e$/.test(w)) w=w.slice(0,-1);   // silent trailing e
  return w;
}
const VMAP=[[/^(ee|ea|ie|y)$/,"E"],[/^(oo|ou|ue|ew)$/,"U"],[/^(ai|ay|ey|a)$/,"A"],
            [/^(igh|ie|i)$/,"I"],[/^(oa|ow|o)$/,"O"],[/^(e)$/,"E"],[/^(u)$/,"U"]];
function vsound(v){
  for(const[re,c] of VMAP) if(re.test(v)) return c;
  return v[0].toUpperCase();
}
// Trailing vowel sounds of a line, last -> first. Crucially, unstressed vowels
// in English all reduce to schwa, which spelling hides: "narrative" and
// "terrible" share no vowel letters but rhyme as (schwa, schwa). We approximate
// stress as the final full syllable of the last long word, and reduce the rest.
function tailSounds(line){
  const ws=(line.toLowerCase().match(/[a-z']+/g)||[]).map(norm).filter(Boolean);
  if(!ws.length) return {v:[],c:""};
  const out=[];
  for(let wi=ws.length-1; wi>=0 && out.length<6; wi--){
    const w=ws[wi];
    const vs=w.match(/[aeiouy]+/g)||[];
    const nSyl=vs.length;
    for(let k=vs.length-1;k>=0;k--){
      const v=vs[k];
      // a monosyllable that is a content word keeps its full value;
      // in a polysyllable only the first syllable carries stress reliably
      const stressed = (nSyl===1 && !STOP.has(w)) || (nSyl>1 && k===0);
      out.push(stressed ? vsound(v) : (v.length===1 ? "@" : vsound(v)));
    }
  }
  const cm=ws[ws.length-1].match(/[^aeiouy]*$/);
  return {v:out.slice(0,6), c:(cm?cm[0]:"").slice(-2)};
}
function lineTail(line){ return tailSounds(line); }
// how many trailing syllables two line-tails share
function rhymeDepth(a,b){
  if(!a.v.length||!b.v.length) return 0;
  let d=0;
  while(d<a.v.length && d<b.v.length && a.v[d]===b.v[d]) d++;
  if(!d) return 0;
  const cMatch = a.c===b.c || a.c.endsWith(b.c) || b.c.endsWith(a.c);
  if(d===1 && !cMatch) return 0;   // one vowel + clashing consonant is not a rhyme
  return d;
}
function rhymeKey(w){
  w=norm(w); if(!w) return "";
  const m=w.match(/[aeiouy]+[^aeiouy]*$/);
  if(!m) return w.slice(-2);
  const vm=m[0].match(/^[aeiouy]+/);
  return vsound(vm[0])+m[0].replace(/^[aeiouy]+/,"").slice(0,2);
}
function rhymes(a,b){
  if(!a||!b) return false;
  const ka=rhymeKey(a),kb=rhymeKey(b);
  return !!ka&&ka===kb;
}

function analyze(text){
  const L=lines(text), W=words(text);
  const r={ lineCount:L.length, wordCount:W.length, lines:L };

  // end rhymes, measured by how deep the line tails agree
  const tails=L.map(lineTail);
  const ends=L.map(l=>{const w=words(l);return w[w.length-1]||"";});
  let endRhyme=0, multi=0, depthSum=0;
  const paired=new Array(L.length).fill(false);
  for(let i=0;i<L.length;i++){
    if(paired[i]) continue;
    for(let j=i+1;j<Math.min(L.length,i+4);j++){
      if(paired[j]) continue;
      const d=rhymeDepth(tails[i],tails[j]);
      if(d>=1){
        endRhyme++; depthSum+=d; paired[i]=paired[j]=true;
        if(d>=2) multi++;   // vowel run across 2+ syllables
        break;
      }
    }
  }
  r.endRhyme=endRhyme; r.multiRhyme=multi;
  r.avgDepth = endRhyme? depthSum/endRhyme : 0;
  r.rhymeRate = L.length>1 ? endRhyme/Math.floor(L.length/2) : 0;

  // internal rhyme: within-line word-tail repeats
  let internal=0;
  L.forEach(l=>{
    const ws=words(l).filter(w=>w.length>2);
    const seen={};
    ws.forEach(w=>{const k=rhymeKey(w); if(!k)return; seen[k]=(seen[k]||0)+1;});
    Object.values(seen).forEach(c=>{ if(c>1) internal+=c-1; });
  });
  r.internal=internal;

  // cadence: syllable counts per line, lower stddev = tighter
  const syl=L.map(l=>words(l).reduce((a,w)=>a+syllables(w),0));
  r.syl=syl;
  const avg=syl.reduce((a,b)=>a+b,0)/(syl.length||1);
  const varc=syl.reduce((a,b)=>a+(b-avg)**2,0)/(syl.length||1);
  r.avgSyl=avg; r.sylDev=Math.sqrt(varc);

  // vocabulary richness (non-stopword uniqueness)
  const content=W.filter(w=>!STOP.has(w));
  r.unique = content.length? new Set(content).size/content.length : 0;
  r.contentCount=content.length;

  // imagery / comparison devices
  r.similes=(text.match(/\b(like|as)\s+(a|an|the|my|your|some)\b/gi)||[]).length;
  r.imAWordYoureA=(text.match(/\b(i'?m|i am|you'?re|you are)\s+(a|an|the)\b/gi)||[]).length;
  // direct address = engagement
  r.youRefs=(text.match(/\byou\b|\byour\b|\byou'?re\b/gi)||[]).length;
  // wordplay markers: repeated root with different suffix
  let play=0; const roots={};
  content.forEach(w=>{ if(w.length>4){const rt=w.slice(0,4); roots[rt]=(roots[rt]||0)+1;} });
  Object.values(roots).forEach(c=>{if(c>1)play+=c-1;});
  r.wordplay=play;
  // filler / corny tells
  r.filler=(text.match(/\b(yo|uh|like|umm?|basically|really really|very very)\b/gi)||[]).length;
  // rhyming a word with itself
  let selfRhyme=0;
  for(let i=0;i<ends.length-1;i++) for(let j=i+1;j<Math.min(ends.length,i+4);j++) if(ends[i]&&ends[i]===ends[j]) selfRhyme++;
  r.selfRhyme=selfRhyme;
  // copy-paste padding: identical or near-identical repeated bars
  const norml=L.map(l=>words(l).join(" "));
  r.dupLines=norml.length-new Set(norml).size;

  r.longestLine=L.reduce((a,l)=>Math.max(a,words(l).length),0);

  // normalize raw counts to a 12-bar basis: length alone must not buy points
  const k = L.length? Math.min(1, 12/L.length) : 0;
  r.multiRhyme *= k; r.internal *= k; r.wordplay *= k;
  r.youRefs *= k; r.similes *= k; r.imAWordYoureA *= k;
  r.contentCount *= k; r.filler *= k; r.selfRhyme *= k; r.dupLines *= k;
  return r;
}

const clamp=(n,lo,hi)=>Math.max(lo,Math.min(hi,n));

function scoreRound(a){
  // Lyricism: rhyming at all is table stakes; depth, density and diction separate.
  let lyr = 1.5;
  lyr += clamp(a.rhymeRate,0,1)*1.5;
  lyr += clamp(a.multiRhyme*0.5,0,2.2);
  lyr += clamp((a.avgDepth-1)*2.2,0,2.4);
  lyr += clamp(a.internal*0.22,0,1.5);
  lyr += clamp((a.unique-0.55)*6,0,1.8);
  lyr += clamp((a.similes+a.imAWordYoureA)*0.3,0,1.2);
  lyr += clamp(a.wordplay*0.2,0,0.8);
  lyr -= clamp(a.selfRhyme*0.6,0,2);
  lyr -= clamp(a.filler*0.35,0,1.8);
  lyr -= clamp(a.dupLines*0.8,0,4);
  if(a.lineCount<4) lyr-=2.2; else if(a.lineCount<8) lyr-=0.9;

  // Flow: cadence consistency, line length sanity, rhyme landing
  let flo = 2.0;
  flo += clamp(4 - a.sylDev*0.75, 0, 3.4);          // tight = good
  flo += clamp(a.rhymeRate,0,1)*1.8;
  flo += (a.avgSyl>=7&&a.avgSyl<=17)?1.5:0.2;        // battle-length bars
  flo += clamp(a.internal*0.15,0,1.0);
  flo -= clamp(a.filler*0.3,0,1.6);
  flo -= clamp(a.dupLines*0.5,0,3);
  if(a.longestLine>22) flo-=1.0;                     // runaway bar
  if(a.lineCount<4) flo-=2.0;

  // Punchlines: aggression, direct address, setup/turn structure, imagery
  let pun = 1.8;
  pun += clamp(a.youRefs*0.42,0,2.8);
  pun += clamp((a.similes+a.imAWordYoureA)*0.62,0,2.6);
  pun += clamp(a.contentCount*0.035,0,1.6);
  pun += clamp(a.multiRhyme*0.28,0,1.0);
  pun -= clamp(a.filler*0.28,0,1.3);
  pun -= clamp(a.dupLines*0.7,0,4);
  if(a.youRefs===0) pun-=1.6;                        // never addressed opponent
  if(a.lineCount<4) pun-=2.0;

  return {
    lyricism: clamp(Math.round(lyr*10)/10,1,10),
    flow:     clamp(Math.round(flo*10)/10,1,10),
    punch:    clamp(Math.round(pun*10)/10,1,10)
  };
}

/* opponent scores: derived from their own text, nudged by difficulty */
function scoreOpponent(text,diff){
  const s=scoreRound(analyze(text));
  const bump={1:-3.4,2:-1.2,3:-1.2}[diff]||0;
  return {
    lyricism:clamp(Math.round((s.lyricism+bump)*10)/10,1,10),
    flow:clamp(Math.round((s.flow+bump*0.8)*10)/10,1,10),
    punch:clamp(Math.round((s.punch+bump*0.9)*10)/10,1,10)
  };
}

/* ---------------- judge commentary ---------------- */
function bestLine(a,text){
  const L=a.lines; if(!L.length) return "";
  let best=L[0],bs=-1;
  L.forEach(l=>{
    const w=words(l);
    const s=w.length*0.5 + (l.match(/\b(like|as)\s+(a|an|the)\b/i)?4:0) + new Set(w.map(rhymeKey)).size*0.3;
    if(s>bs){bs=s;best=l;}
  });
  return best;
}
function worstLine(a){
  const L=a.lines; if(!L.length) return "";
  let worst=L[0],ws=1e9;
  L.forEach(l=>{
    const w=words(l);
    const s=w.length + (w.filter(x=>!STOP.has(x)).length)*1.5 - (l.match(/\b(yo|uh|like)\b/i)?3:0);
    if(s<ws){ws=s;worst=l;}
  });
  return worst;
}

function purist(a,s,opName){
  const out=[];
  if(a.lineCount===0) return ["You submitted air. I judge text. There was none."];
  out.push(a.multiRhyme>=3
    ? `You stacked ${a.multiRhyme} multisyllabic landings. That is craft, not accident — I heard the scheme hold across the couplet.`
    : a.multiRhyme>0
      ? `${a.multiRhyme} multi${a.multiRhyme>1?"s":""}. A gesture toward a scheme, not a scheme. You rhymed the last syllable and called it architecture.`
      : `Not one multisyllabic rhyme. Every landing was a single beat on a single vowel. That is a nursery structure with adult vocabulary on top.`);
  out.push(a.internal>=4
    ? `Internal rhyme count sits at ${a.internal} — the bars are woven, not just capped.`
    : `Internal rhyme was nearly absent (${a.internal}). Everything waited for the end of the line. The middle of your bars is dead space.`);
  if(a.selfRhyme>0) out.push(`You rhymed a word with itself ${a.selfRhyme} time${a.selfRhyme>1?"s":""}. That is not a rhyme. That is a repeat with confidence.`);
  out.push(a.similes+a.imAWordYoureA>=3
    ? `The figurative work was present — ${a.similes+a.imAWordYoureA} constructed comparisons. Some landed; comparison is still the cheapest door into a metaphor, and you used it often.`
    : `Almost no metaphor. You told me things about ${opName}. You never made me see one.`);
  out.push(`Diction density: ${(a.unique*100).toFixed(0)}% of your content words were unrepeated. ${a.unique>0.72?"Wide vocabulary, well spent.":a.unique>0.6?"Serviceable. You leaned on a small word pool.":"Narrow. You circled the same six ideas in different clothes."}`);
  return out;
}
function crowd(a,s){
  const out=[];
  if(a.lineCount===0) return ["Dead air. The room emptied. Next."];
  out.push(a.sylDev<2.2
    ? `Cadence was locked — syllable variance of ${a.sylDev.toFixed(1)} across ${a.lineCount} bars. You could ride any beat in this room with that.`
    : a.sylDev<4
      ? `Variance of ${a.sylDev.toFixed(1)}. Mostly on time, but a few bars ran long and you had to swallow words to fit them back in.`
      : `Syllable variance of ${a.sylDev.toFixed(1)} — that is not a pocket, that is a pothole. Some bars were ${Math.min(...a.syl)} syllables, some were ${Math.max(...a.syl)}. The crowd cannot nod to that.`);
  out.push(`Average bar length: ${a.avgSyl.toFixed(1)} syllables. ${a.avgSyl<7?"Too short — you kept ending before the bar finished. Sounds nervous.":a.avgSyl>17?"Too long — you are writing paragraphs and hoping they breathe. They do not.":"Right in the battle pocket."}`);
  out.push(a.youRefs>=5
    ? `You addressed your opponent ${a.youRefs} times. The room felt attacked on your behalf. That is what this is.`
    : a.youRefs>0
      ? `Only ${a.youRefs} direct hit${a.youRefs>1?"s":""} at the man in front of you. The rest was about yourself. Nobody paid to hear your résumé.`
      : `You never once addressed him. This was a poem performed near a battle.`);
  if(a.filler>2) out.push(`I counted ${a.filler} filler syllables — "yo", "uh", "like". Every one of those is a beat you gave away for free.`);
  return out;
}
function sid(a,s,text,opName){
  const out=[];
  if(a.lineCount===0) return ["Nothing. You typed nothing and expected a verdict. Here it is: no."];
  if(a.lineCount<8) out.push(`${a.lineCount} bars. The format said eight to sixteen. You didn't lose on quality first — you lost on showing up short.`);
  const w=worstLine(a);
  if(w) out.push({q:w, t:`That right there. Read it back out loud. ${a.filler>0?"You put filler in a written line — nobody was rushing you.":"It's a line that exists because the next one needed a runway."} Cut it and the verse gets better immediately.`});
  const b=bestLine(a);
  if(b) out.push({q:b, t:`That one I'll give you. ${s.punch>6?"It had a setup and it had a turn, which is more than most people manage down here.":"It's the best thing in the verse, which tells you more about the verse than the line."}`});
  if(a.selfRhyme>0) out.push(`Rhyming a word with itself is the oldest tell in the building. I heard it ${a.selfRhyme} time${a.selfRhyme>1?"s":""} and so did everybody behind me.`);
  if(a.similes+a.imAWordYoureA===0) out.push(`Zero comparisons. No "you're a", no "like a". You had ${a.lineCount} chances to make ${opName} into an image and you described him literally every time. Literal is not a punchline.`);
  const avgS=(s.lyricism+s.flow+s.punch)/3;
  out.push(avgS>7.5?`I'm not going to pretend. That was good. I hate that it was good.`
    :avgS>5.5?`It was competent. Competent doesn't get quoted on the way out of the building.`
    :`It was survivable. Barely. You didn't embarrass yourself and that is the entire compliment.`);
  return out;
}

/* ---------------- game state ---------------- */
/* ---------------- crowd ---------------- */
const CROWD={
  huge:["OHHHHHH!!","THE ROOM IS GONE. Hats on the floor.","Somebody just fell into the wall.","AYYYY! Rewind that! REWIND THAT!","Three people are holding their heads.","The whole back row stood up.","Somebody threw a cup. Not in anger. In joy.","A man is pointing at the ceiling and screaming."],
  good:["Ohhh!","A wave of \"ohhh\" rolls through the back.","Heads nodding. That landed.","Somebody goes \"okay, okay!\"","A few people react. That one had weight.","The circle tightens up a little."],
  mild:["Scattered nods.","A couple people react.","Somebody says \"aight\" without much behind it.","Polite. The room is still waiting.","Mild murmur."],
  dead:["Silence.","Someone coughs.","Nobody moves.","A phone screen lights up in the back. Somebody's checking the time.","The host looks at his shoes.","You can hear the box fan."],
  ambient:["Somebody in the back yells \"TAKE YOUR TIME!\"","The box fan rattles.","A bottle rolls across the floor.","Somebody's filming on a cracked phone.","The circle shifts, waiting.","Someone whispers \"he cooked him last week too.\"","A guy near the stairs keeps saying \"ooh\" at nothing.","The pipes knock twice.","Somebody yells \"WE WAITING!\""],
  adlib:["*grins*","*steps closer*","*points at you*","*shakes his head, smiling*","*turns to the crowd*","*taps his temple*","*paces the circle*","*opens his arms*"]
};
const pick=a=>a[Math.floor(Math.random()*a.length)];

/* How hard a single bar hits: rhyme link to the bar before it, length, and
   whether it actually swings at somebody. Drives the live crowd. */
function lineHeat(line, prev){
  const w=words(line); if(!w.length) return 0;
  let h=0.18;
  if(prev){
    const d=rhymeDepth(lineTail(prev),lineTail(line));
    h += d>=3?0.42 : d===2?0.30 : d===1?0.15 : 0;
  }
  const syl=w.reduce((a,x)=>a+syllables(x),0);
  if(syl>=8&&syl<=18) h+=0.12;
  if(/\b(like|as)\s+(a|an|the|my|your)\b/i.test(line)) h+=0.14;
  if(/\b(you|your|you're)\b/i.test(line)) h+=0.12;
  const content=w.filter(x=>!STOP.has(x));
  h += clamp(content.length*0.016,0,0.16);
  if(/\b(yo|uh|umm?)\b/i.test(line)) h-=0.12;
  if(w.length<4) h-=0.14;
  return clamp(h,0,1);
}
function heatTier(h){ return h>0.72?"huge":h>0.52?"good":h>0.32?"mild":"dead"; }

/* ---------------- records ---------------- */
/* Career records persist per browser. Storage can throw or come back empty
   (private windows, blocked site data), so every access is guarded and the
   game runs identically without it. */
const REC_KEY="miccheck.records.v1";
const SEED=()=>({user:{w:0,l:0,d:0},ops:Object.fromEntries(OPPONENTS.map(o=>[o.name,{...o.rec}]))});
function loadRecords(){
  try{
    const raw=localStorage.getItem(REC_KEY);
    if(!raw) return SEED();
    const p=JSON.parse(raw), base=SEED();
    if(!p||typeof p!=="object") return base;
    base.user={...base.user,...(p.user||{})};
    for(const n in base.ops) if(p.ops&&p.ops[n]) base.ops[n]={...base.ops[n],...p.ops[n]};
    return base;
  }catch(e){ return SEED(); }
}
function saveRecords(r){ try{ localStorage.setItem(REC_KEY,JSON.stringify(r)); }catch(e){} }
let RECORDS=loadRecords();
const recStr=r=>`${r.w}-${r.l}${r.d?"-"+r.d:""}`;

/* ---------------- the round clock ---------------- */
/* Fliptop format: 3:00 a round. Going past it is allowed - the battle does not
   stop - but it is called as OVERTIME and the judges dock for it. */
const ROUND_LIMIT=180;      // seconds per round
const REACTION_TIME=20;     // seconds the crowd gets to react after a verse

function fmtClock(sec){
  sec=Math.max(0,Math.round(sec));
  return Math.floor(sec/60)+":"+String(sec%60).padStart(2,"0");
}
function setClock(sec,label){
  const c=document.getElementById("clock"), w=document.getElementById("clockwrap"),
        l=document.getElementById("clocklab");
  if(!c) return;
  const over=sec>ROUND_LIMIT;
  c.textContent = over ? "+"+fmtClock(sec-ROUND_LIMIT) : fmtClock(ROUND_LIMIT-sec);
  w.className="clockwrap"+(over?" over":sec>ROUND_LIMIT-30?" warn":"");
  if(l) l.textContent = over ? "OVERTIME" : (label||"ON THE CLOCK");
}
function clearClock(){
  const w=document.getElementById("clockwrap");
  if(w){ w.className="clockwrap idle";
    document.getElementById("clock").textContent="3:00";
    document.getElementById("clocklab").textContent="STANDBY"; }
}

/* A live countdown the user races. Returns a handle; elapsed is read on submit. */
function startUserClock(onOvertime){
  const t0=Date.now(); let warned=false;
  const id=setInterval(()=>{
    const el2=Math.floor((Date.now()-t0)/1000);
    setClock(el2,"YOUR TIME");
    if(el2>ROUND_LIMIT&&!warned){ warned=true; onOvertime&&onOvertime(); }
  },250);
  setClock(0,"YOUR TIME");
  return { stop(){ clearInterval(id); return Math.floor((Date.now()-t0)/1000); } };
}

/* The opponent's clock. Their verse plays in ~20s of real time, so the round
   clock is driven by how far through the verse they are rather than by the
   wall clock - that way the displayed time reads like a real 3-minute round
   and lands where the pre-rolled result says it should. */
function makeOpponentClock(goesOvertime){
  const target = goesOvertime
    ? ROUND_LIMIT + 8 + Math.floor(Math.random()*40)   // 3:08 - 3:48
    : 120 + Math.floor(Math.random()*55);              // 2:00 - 2:55
  return {
    target,
    tick(progress){ setClock(target*progress,"OPPONENT"); },
    finish(){ setClock(target,"OPPONENT"); return target; }
  };
}

/* Crowd reaction window: the room gets a fixed stretch to react, on its own
   visible countdown, before the battle moves on. */
async function crowdWindow(container,tier){
  const box=el(`<div class="react">
      <div class="mrow"><span class="tag" style="margin:0">Crowd reaction</span>
        <span class="tag react-t" style="margin:0">0:${String(REACTION_TIME).padStart(2,"0")}</span></div>
      <div class="rtrack"><div class="rfill"></div></div>
      <div class="rpops"></div>
      <div class="bar"><button class="ghost cut">CUT IT SHORT &raquo;</button></div>
    </div>`);
  container.appendChild(box);
  const tEl=box.querySelector(".react-t"), fill=box.querySelector(".rfill"),
        pops=box.querySelector(".rpops"), cut=box.querySelector(".cut");
  let done=false;
  cut.addEventListener("click",()=>{done=true;});
  box.scrollIntoView({behavior:"smooth",block:"center"});

  const t0=Date.now();
  while(!done && !state.skip){
    const el2=(Date.now()-t0)/1000, left=REACTION_TIME-el2;
    if(left<=0) break;
    tEl.textContent="0:"+String(Math.ceil(left)).padStart(2,"0");
    fill.style.width=(100-(left/REACTION_TIME)*100)+"%";
    if(Math.random()<0.055){
      const n=crowdPop(pick(CROWD[tier]),tier);
      pops.appendChild(n);
      while(pops.children.length>3) pops.firstChild.remove();
      bumpHeat(tier==="huge"?3:tier==="dead"?-3:1);
    }
    await new Promise(r=>setTimeout(r,120));
  }
  cut.remove(); tEl.textContent="TIME";
  fill.style.width="100%";
}

/* ---------------- state & pacing ---------------- */
const state={ op:null, first:null, round:0, userVerses:[], userScores:[], opScores:[],
               skip:false, heat:50, userTimes:[], opTimes:[], userOT:[], opOT:[] };
const stage=document.getElementById("stage");

function esc(s){return s.replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));}
function el(html){const d=document.createElement("div");d.innerHTML=html;return d.firstElementChild;}
function push(node){stage.appendChild(node);node.scrollIntoView({behavior:"smooth",block:"end"});return node;}
const sleep=ms=>new Promise(r=>setTimeout(r,state.skip?0:ms));

/* the heat meter reacts to every bar and decays between them */
function bumpHeat(delta){
  state.heat=clamp(state.heat+delta,0,100);
  const f=document.getElementById("heatfill"), l=document.getElementById("heatlab");
  if(f){ f.style.width=state.heat+"%";
    f.style.background = state.heat>75?"var(--accent2)" : state.heat>45?"var(--accent)" : "var(--line)"; }
  if(l) l.textContent = state.heat>85?"ROOM IS GONE" : state.heat>70?"CROWD IS LOUD"
      : state.heat>45?"ROOM IS WARM" : state.heat>25?"ROOM IS QUIET" : "CROWD IS DEAD";
}
function crowdPop(text,tier){
  const d=document.createElement("div");
  d.className="pop "+tier; d.textContent=text;
  return d;
}

/* reveal a verse one bar at a time, with the crowd reacting in between */
async function performVerse(container, text, who, clock){
  const L=lines(text);
  const body=container.querySelector(".verse");
  let prev=null, best={h:-1,line:""};
  for(let i=0;i<L.length;i++){
    const line=L[i];
    const bar=document.createElement("div");
    bar.className="bar-line"; bar.textContent=line;
    body.appendChild(bar);
    requestAnimationFrame(()=>bar.classList.add("in"));
    if(!state.skip) bar.scrollIntoView({behavior:"smooth",block:"center"});

    const h=lineHeat(line,prev);
    if(h>best.h) best={h,line};
    bumpHeat((h-0.45)*16);
    if(clock) clock.tick((i+1)/L.length);

    // pause on the bar itself, longer for longer bars
    await sleep(clamp(430+words(line).length*58,520,1700));

    // the crowd only interrupts when a bar earns it, or when it truly dies
    const tier=heatTier(h);
    const speak = tier==="huge" ? 0.95 : tier==="good" ? 0.45 : tier==="dead" ? 0.3 : 0.12;
    if(Math.random()<speak && i<L.length-1){
      body.appendChild(crowdPop(pick(CROWD[tier]),tier));
      await sleep(tier==="huge"?900:520);
    }
    // opponent ad-libs mid-verse
    if(who==="op" && Math.random()<0.13 && i<L.length-1){
      body.appendChild(crowdPop(pick(CROWD.adlib),"adlib"));
      await sleep(420);
    }
    prev=line;
  }
  return best;
}

function start(){
  stage.innerHTML="";
  state.op=Object.assign({},OPPONENTS[Math.floor(Math.random()*OPPONENTS.length)]);
  if(state.op.style==="Wildcard / Joker") state.op.diff=1+Math.floor(Math.random()*3);
  state.first=Math.random()<0.5?"opponent":"user";
  state.round=0; state.userVerses=[]; state.userScores=[]; state.opScores=[];
  state.skip=false; state.heat=50;

  push(el(`<div class="card">
    <div class="tag">The Boiler Room &middot; Sublevel 3</div>
    <div>Sweat on the pipes. One bulb swinging. Forty heads pressed shoulder to shoulder.
    The beat cuts. The host points at the circle.</div>
    <div class="hr"></div>
    <div class="tag">Tonight's opponent</div>
    <h2 style="margin:0 0 4px">${state.op.name}</h2>
    <div style="color:var(--accent)">${state.op.style}</div>
    <div class="crowd">${state.op.vibe}</div>
    <div class="rec"><span>Career record &mdash; <b>${state.op.name}</b>: <b>${recStr(RECORDS.ops[state.op.name])}</b></span>
      <span>You: <b>${recStr(RECORDS.user)}</b></span></div>
    <div class="hr"></div>
    <div class="tag">Format</div>
    <div>Three rounds. <strong>3:00 each.</strong> Past the clock is overtime &mdash; allowed, but the judges dock for it.
    The crowd gets ${REACTION_TIME} seconds to react after every verse.</div>
    <div class="hr"></div>
    <div class="tag">Coin flip</div>
    <div><strong>${state.first==="opponent"?"TAILS &mdash; "+state.op.name+" goes first.":"HEADS &mdash; you go first. No warm-up, no example. Set the tone."}</strong></div>
  </div>`));

  // persistent crowd meter
  push(el(`<div class="meter">
     <div class="clockwrap idle" id="clockwrap">
       <span class="tag" id="clocklab" style="margin:0">STANDBY</span>
       <span id="clock">3:00</span>
     </div>
     <div class="mrow"><span class="tag" style="margin:0">Crowd</span><span class="tag" id="heatlab" style="margin:0">ROOM IS WARM</span></div>
     <div class="track"><div id="heatfill" style="width:50%"></div></div>
   </div>`));
  bumpHeat(0);
  nextRound();
}

async function nextRound(){
  state.round++;
  if(state.round>3) return judge();
  state.skip=false;
  if(state.first==="opponent"){ await dropOpponent(); promptUser(); }
  else promptUser();
}

async function dropOpponent(){
  const v=state.op.verses[state.round-1];
  state.opScores.push(scoreOpponent(v,state.op.diff));
  // rolled before he opens his mouth: does he run long this round?
  const goesOT=Math.random()<state.op.otRate;
  const clock=makeOpponentClock(goesOT);

  const card=push(el(`<div class="card op">
    <div class="tag">Round ${state.round}/3 &middot; ${state.op.name} &middot; ${recStr(RECORDS.ops[state.op.name])}</div>
    <div class="verse op"></div>
    <div class="bar"><button class="ghost skip">SKIP AHEAD &raquo;</button></div>
  </div>`));
  const sk=card.querySelector(".skip");
  sk.addEventListener("click",()=>{state.skip=true;sk.remove();});
  setClock(0,"OPPONENT");
  await sleep(700);
  await performVerse(card,v,"op",clock);
  state.skip=false;              // skip covers that verse only
  if(sk.isConnected) sk.remove();

  const used=clock.finish();
  const over=used>ROUND_LIMIT;
  state.opTimes.push(used); state.opOT.push(over?used-ROUND_LIMIT:0);
  card.appendChild(el(`<div class="timing${over?" ot":""}">${over
      ? "&#9201; OVERTIME &mdash; "+fmtClock(used)+" (+"+fmtClock(used-ROUND_LIMIT)+" over). The host is waving at him. The judges noted it."
      : "&#9201; "+fmtClock(used)+" &mdash; inside the three."}</div>`));

  const s0=state.opScores[state.opScores.length-1];
  const avg=(s0.lyricism+s0.flow+s0.punch)/3;
  await crowdWindow(card, avg>7.5?"huge":avg>6?"good":avg>4.5?"mild":"dead");
  clearClock();
  await sleep(400);
}

function promptUser(){
  const box=push(el(`<div class="card you">
    <div class="tag">&#127908; Your turn &mdash; Round ${state.round}/3 &middot; YOU &middot; ${recStr(RECORDS.user)}</div>
    <div style="margin-bottom:10px">You have <strong>3:00</strong>. Write your own bars, 8&ndash;16 lines, one per line.
    Run past the clock and it is called overtime &mdash; you can keep going, but the judges dock you for it.</div>
    <textarea id="ta" placeholder="Type your verse here. One bar per line."></textarea>
    <div class="bar">
      <button id="send">SPIT IT</button>
      <span class="count" id="cnt">0 bars</span>
    </div>
  </div>`));
  const ta=box.querySelector("#ta"), cnt=box.querySelector("#cnt"), btn=box.querySelector("#send");

  const timer=startUserClock(()=>{
    box.classList.add("overtime");
    const n=el(`<div class="timing ot">&#9201; OVERTIME &mdash; you are past three minutes. Finish it.</div>`);
    box.insertBefore(n,box.querySelector(".bar"));
    bumpHeat(-8);
  });

  // the room does not sit in silence while you write
  const amb=setInterval(()=>{
    if(!box.isConnected) return clearInterval(amb);
    const n=crowdPop(pick(CROWD.ambient),"mild");
    box.insertBefore(n,box.querySelector(".bar"));
    setTimeout(()=>n.remove(),6500);
    bumpHeat(-2);
  },7000);

  const upd=()=>{
    const n=lines(ta.value).length;
    cnt.textContent=`${n} bar${n===1?"":"s"}`+(n<8?" \u2014 format says 8\u201316":n>16?" \u2014 over 16, judges will notice":" \u2713");
    cnt.className="count"+((n<8||n>16)?" warn":"");
    btn.disabled=n<1;
  };
  ta.addEventListener("input",upd); upd(); ta.focus();

  btn.addEventListener("click",async()=>{
    const text=ta.value.trim(); if(!text) return;
    clearInterval(amb);
    const used=timer.stop();
    const over=Math.max(0,used-ROUND_LIMIT);
    state.userTimes.push(used); state.userOT.push(over);
    state.userVerses.push(text);

    // Fliptop docks for running long: the penalty lands on delivery.
    const sc=scoreRound(analyze(text));
    if(over>0) sc.flow=clamp(Math.round((sc.flow-clamp(over/30*0.9,0,2.5))*10)/10,1,10);
    state.userScores.push(sc);

    state.skip=false;
    box.classList.remove("overtime");
    box.innerHTML=`<div class="tag">Round ${state.round}/3 &middot; YOU</div><div class="verse"></div>
      <div class="bar"><button class="ghost skip">SKIP AHEAD &raquo;</button></div>`;
    const sk=box.querySelector(".skip");
    sk.addEventListener("click",()=>{state.skip=true;sk.remove();});
    await sleep(500);
    const best=await performVerse(box,text,"you");
    state.skip=false;            // skip covers that verse only
    if(sk.isConnected) sk.remove();

    box.appendChild(el(`<div class="timing${over?" ot":""}">${over
      ? "&#9201; OVERTIME &mdash; "+fmtClock(used)+" (+"+fmtClock(over)+" over). Delivery docked."
      : "&#9201; "+fmtClock(used)+" &mdash; inside the three."}</div>`));
    box.appendChild(el(`<div class="crowd">${reaction(sc)}</div>`));
    if(best.line && best.h>0.6) box.appendChild(el(`<div class="crowd">Your hardest bar that round: &ldquo;${esc(best.line)}&rdquo;</div>`));

    const avg=(sc.lyricism+sc.flow+sc.punch)/3;
    await crowdWindow(box, avg>7.5?"huge":avg>6?"good":avg>4.5?"mild":"dead");
    clearClock();
    await sleep(400);
    if(state.first==="user") await dropOpponent();
    nextRound();
  });
}

function reaction(s){
  const avg=(s.lyricism+s.flow+s.punch)/3;
  if(avg>8) return "The room detonates. Somebody's hat is on the floor. Three people are holding their heads.";
  if(avg>6.5) return "Solid reaction — a wave of \"ohhh\" rolls through the back of the room.";
  if(avg>5) return "Scattered nods. A couple of people react. The rest are waiting to see round two.";
  if(avg>3.5) return "Polite. Somebody in the front says \"okay\" without much behind it.";
  return "Silence. Someone coughs. The host looks at his shoes.";
}

async function judge(){
  const sum=arr=>arr.reduce((a,s)=>({lyricism:a.lyricism+s.lyricism,flow:a.flow+s.flow,punch:a.punch+s.punch}),{lyricism:0,flow:0,punch:0});
  const U=sum(state.userScores), O=sum(state.opScores);
  const ut=U.lyricism+U.flow+U.punch, ot=O.lyricism+O.flow+O.punch;
  const allText=state.userVerses.join("\n");
  const A=analyze(allText), S={lyricism:U.lyricism/3,flow:U.flow/3,punch:U.punch/3};

  let rows="";
  for(let i=0;i<3;i++){
    const u=state.userScores[i]||{lyricism:0,flow:0,punch:0}, o=state.opScores[i]||{lyricism:0,flow:0,punch:0};
    const ut2=state.userTimes[i], ot2=state.opTimes[i];
    rows+=`<tr><td>Round ${i+1}<br><span style="color:var(--dim);font-size:11px">${ut2!=null?fmtClock(ut2):"-"}${state.userOT[i]>0?" OT":""} vs ${ot2!=null?fmtClock(ot2):"-"}${state.opOT[i]>0?" OT":""}</span></td>
      <td class="n">${u.lyricism.toFixed(1)}</td><td class="n">${u.flow.toFixed(1)}</td><td class="n">${u.punch.toFixed(1)}</td>
      <td class="n"><strong>${(u.lyricism+u.flow+u.punch).toFixed(1)}</strong></td>
      <td class="n">${o.lyricism.toFixed(1)}</td><td class="n">${o.flow.toFixed(1)}</td><td class="n">${o.punch.toFixed(1)}</td>
      <td class="n"><strong>${(o.lyricism+o.flow+o.punch).toFixed(1)}</strong></td></tr>`;
  }

  const fmt=items=>items.map(x=>typeof x==="string"
    ? `<div class="crit">${esc(x)}</div>`
    : `<div class="quote">${esc(x.q)}</div><div class="crit">${esc(x.t)}</div>`).join("");

  const opA=analyze(state.op.verses.join("\n"));
  const opBest=bestLine(opA);

  const diff=ut-ot;
  const verdict = Math.abs(diff)<0.9
    ? `<div class="win d">DRAW — ${ut.toFixed(1)} to ${ot.toFixed(1)}</div><div>Nobody hands out a belt for this. Run it back.</div>`
    : diff>0
      ? `<div class="win u">WINNER: YOU — ${ut.toFixed(1)} to ${ot.toFixed(1)}</div><div>You took ${state.op.name} in his own basement. The host is already asking who you came with.</div>`
      : `<div class="win o">WINNER: ${state.op.name} — ${ot.toFixed(1)} to ${ut.toFixed(1)}</div><div>You lost by ${Math.abs(diff).toFixed(1)} points. That's not a blowout — that's a gap you can close with a pen.</div>`;

  const card=push(el(`<div class="card">
    <div class="tag">Final Judgment</div>
    <div class="crowd">The host waves the crowd down. Three figures step out of the dark by the stairwell.</div>
    <div id="judges"></div>
    <div id="final"></div>
  </div>`));

  const panel=card.querySelector("#judges");
  const blocks=[
    `<div class="judge"><h3>THE PURIST</h3>
      <div class="who">Wordplay &middot; internal schemes &middot; metaphor complexity</div>
      ${fmt(purist(A,S,state.op.name))}
      <div class="crit" style="color:var(--dim)">On ${esc(state.op.name)}: he ran ${opA.multiRhyme.toFixed(1)} multis and ${opA.internal.toFixed(1)} internal rhymes per twelve bars. Whatever else he is, he was structurally sound.</div></div>`,
    `<div class="judge"><h3>THE CROWD CONTROLLER</h3>
      <div class="who">Cadence &middot; delivery &middot; insult effectiveness &middot; rhythm</div>
      ${fmt(crowd(A,S))}
      <div class="crit" style="color:var(--dim)">On ${esc(state.op.name)}: variance ${opA.sylDev.toFixed(1)}, and he never stopped talking directly to you. Learn that.</div></div>`,
    `<div class="judge"><h3>SAVAGE SID</h3>
      <div class="who">Harsh feedback &middot; corny bars &middot; exposed weaknesses</div>
      ${fmt(sid(A,S,allText,state.op.name))}
      <div class="quote">${esc(opBest)}</div>
      <div class="crit">That was his best bar of the night. Ask yourself honestly whether you wrote anything that beats it.</div></div>`
  ];
  for(const b of blocks){
    const n=el(b); panel.appendChild(n);
    requestAnimationFrame(()=>n.classList.add("in"));
    n.scrollIntoView({behavior:"smooth",block:"center"});
    await sleep(2200);
  }

  // the clock is part of the verdict in this format
  const uOT=state.userOT.reduce((a,b)=>a+b,0), oOT=state.opOT.reduce((a,b)=>a+b,0);
  if(uOT||oOT){
    const n=el(`<div class="judge"><h3>THE CLOCK</h3>
      <div class="who">Round length &middot; overtime penalties</div>
      <div class="crit">${uOT?`You ran over in ${state.userOT.filter(x=>x>0).length} round(s), ${fmtClock(uOT)} past the limit in total. That came straight off your delivery score — the format is three minutes and the format does not care how good the bar was.`:`You stayed inside three minutes every round. Nothing docked.`}</div>
      <div class="crit">${oOT?`${esc(state.op.name)} also ran long — ${fmtClock(oOT)} over across the match. The host waved at him and the panel saw it.`:`${esc(state.op.name)} never went over. He finished clean every round.`}</div></div>`);
    panel.appendChild(n); requestAnimationFrame(()=>n.classList.add("in"));
    n.scrollIntoView({behavior:"smooth",block:"center"});
    await sleep(2000);
  }

  // commit the result to both career records
  const res = Math.abs(diff)<0.9 ? "d" : diff>0 ? "w" : "l";
  RECORDS.user[res]++;
  const opRec=RECORDS.ops[state.op.name];
  opRec[res==="d"?"d":res==="w"?"l":"w"]++;
  saveRecords(RECORDS);

  const fin=card.querySelector("#final");
  fin.innerHTML=`<div class="hr"></div><div class="tag">Score matrix</div>
    <table>
      <tr><th></th><th>You Lyr</th><th>You Flow</th><th>You Punch</th><th>You Tot</th>
          <th>Opp Lyr</th><th>Opp Flow</th><th>Opp Punch</th><th>Opp Tot</th></tr>
      ${rows}
      <tr><th>TOTAL</th>
        <td class="n">${U.lyricism.toFixed(1)}</td><td class="n">${U.flow.toFixed(1)}</td><td class="n">${U.punch.toFixed(1)}</td>
        <td class="n"><strong>${ut.toFixed(1)}</strong></td>
        <td class="n">${O.lyricism.toFixed(1)}</td><td class="n">${O.flow.toFixed(1)}</td><td class="n">${O.punch.toFixed(1)}</td>
        <td class="n"><strong>${ot.toFixed(1)}</strong></td></tr>
    </table>`;
  fin.scrollIntoView({behavior:"smooth",block:"center"});
  await sleep(1800);
  fin.appendChild(el(`<div class="crowd">The judges lean in to each other. The room goes quiet.</div>`));
  await sleep(1600);
  bumpHeat(diff>0?40:-20);
  fin.appendChild(el(`<div>${verdict}</div>`));
  fin.appendChild(el(`<div class="hr"></div><div class="tag">Records after this battle</div>
    <div class="rec"><span>You: <b>${recStr(RECORDS.user)}</b></span>
      <span>${esc(state.op.name)}: <b>${recStr(opRec)}</b></span></div>
    <table style="margin-top:10px">
      <tr><th>Fighter</th><th>Record</th></tr>
      <tr><td><strong>YOU</strong></td><td>${recStr(RECORDS.user)}</td></tr>
      ${OPPONENTS.map(o=>`<tr><td>${esc(o.name)}</td><td>${recStr(RECORDS.ops[o.name])}</td></tr>`).join("")}
    </table>`));
  fin.appendChild(el(`<div class="bar" style="margin-top:18px"><button id="again">NEW BATTLE</button></div>`));
  fin.scrollIntoView({behavior:"smooth",block:"center"});
  document.getElementById("again").addEventListener("click",start);
}

start();
</script>
