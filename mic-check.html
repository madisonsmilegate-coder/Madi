<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mic Check</title>
<style>
:root{
  --bg:#0b0b0d; --panel:#141418; --panel2:#1c1c22; --line:#2a2a33;
  --ink:#e9e9ee; --dim:#9a9aa8; --accent:#ffb020; --accent2:#ff4d5e;
  --good:#4ade80; --bad:#f87171;
}
:root:not([data-theme="light"]) { }
@media (prefers-color-scheme: light){
  :root:not([data-theme="dark"]){
    --bg:#f4f2ee; --panel:#fffdf9; --panel2:#efece5; --line:#ddd8cd;
    --ink:#1a1a1f; --dim:#65656f; --accent:#b5730a; --accent2:#c62a3a;
  }
}
*{box-sizing:border-box}
body{
  margin:0; background:var(--bg); color:var(--ink);
  font-family:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  line-height:1.55; padding:0 16px;
}
.wrap{max-width:760px;margin:0 auto;padding:28px 0 80px}
h1{font-size:clamp(26px,7vw,44px);margin:0;letter-spacing:-1px;line-height:1.05}
h1 span{color:var(--accent)}
.sub{color:var(--dim);font-size:13px;margin:6px 0 24px;text-transform:uppercase;letter-spacing:2px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:18px;margin:14px 0}
.card.op{border-left:3px solid var(--accent2)}
.card.you{border-left:3px solid var(--accent)}
.tag{display:inline-block;font-size:11px;letter-spacing:1.5px;text-transform:uppercase;color:var(--dim);margin-bottom:10px}
.verse{white-space:pre-wrap;font-size:15px}
.verse.op{color:var(--ink)}
button{
  font-family:inherit;font-size:14px;font-weight:600;cursor:pointer;
  background:var(--accent);color:#14140c;border:0;border-radius:8px;
  padding:11px 20px;letter-spacing:.5px;
}
button:hover{filter:brightness(1.12)}
button:disabled{opacity:.4;cursor:not-allowed}
button.ghost{background:transparent;color:var(--dim);border:1px solid var(--line)}
textarea{
  width:100%;min-height:150px;background:var(--panel2);color:var(--ink);
  border:1px solid var(--line);border-radius:8px;padding:12px;
  font-family:inherit;font-size:15px;line-height:1.6;resize:vertical;
}
textarea:focus{outline:2px solid var(--accent);outline-offset:-1px}
.bar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:10px}
.count{color:var(--dim);font-size:12px}
.count.warn{color:var(--bad)}
.judge{border-top:1px solid var(--line);padding-top:14px;margin-top:14px}
.judge h3{margin:0 0 4px;font-size:16px;color:var(--accent)}
.judge .who{color:var(--dim);font-size:12px;margin-bottom:10px}
.crit{font-size:14px;margin:8px 0}
.quote{border-left:2px solid var(--line);padding-left:10px;color:var(--dim);font-style:italic;margin:6px 0}
table{width:100%;border-collapse:collapse;font-size:13px;margin:12px 0}
th,td{border:1px solid var(--line);padding:7px 9px;text-align:left}
th{background:var(--panel2);color:var(--dim);font-weight:600;text-transform:uppercase;font-size:11px;letter-spacing:1px}
td.n{text-align:right;font-variant-numeric:tabular-nums}
.win{font-size:clamp(20px,5vw,30px);font-weight:700;margin:18px 0 6px}
.win.u{color:var(--good)} .win.o{color:var(--bad)} .win.d{color:var(--accent)}
.hr{height:1px;background:var(--line);margin:26px 0}
.crowd{color:var(--dim);font-size:13px;font-style:italic;margin:10px 0}
.hidden{display:none}
.verse{white-space:normal}
.bar-line{
  opacity:0;transform:translateY(7px);
  transition:opacity .34s ease,transform .34s ease;
  margin:2px 0;white-space:pre-wrap;
}
.bar-line.in{opacity:1;transform:none}
.pop{
  font-size:13px;letter-spacing:.5px;margin:7px 0 9px;
  animation:pop .3s ease both;
}
@keyframes pop{from{opacity:0;transform:scale(.96) translateY(4px)}to{opacity:1;transform:none}}
.pop.huge{color:var(--accent2);font-weight:700;font-size:15px;letter-spacing:1px}
.pop.good{color:var(--accent);font-weight:600}
.pop.mild{color:var(--dim);font-style:italic}
.pop.dead{color:var(--dim);font-style:italic;opacity:.75}
.pop.adlib{color:var(--dim);font-style:italic;opacity:.8}
.meter{
  position:sticky;top:0;z-index:5;background:var(--bg);
  padding:10px 0 12px;margin:6px 0;
}
.meter .mrow{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
.meter .track{height:7px;background:var(--panel2);border:1px solid var(--line);border-radius:99px;overflow:hidden}
.meter .track>div{height:100%;background:var(--accent);border-radius:99px;transition:width .5s ease,background .5s ease}
/* ---- avatars & identity ---- */
.avatar{
  width:54px;height:54px;border-radius:12px;flex:0 0 auto;
  display:inline-flex;align-items:center;justify-content:center;
  font-weight:800;font-size:19px;letter-spacing:.5px;
  color:hsl(var(--h) 70% 12%);
  background:linear-gradient(140deg,hsl(var(--h) 72% 62%),hsl(var(--h) 62% 44%));
}
.avatar.sm{width:24px;height:24px;border-radius:6px;font-size:10px;margin-right:8px;vertical-align:-7px}
.phead{display:flex;gap:14px;align-items:center;margin-bottom:16px}
.prof .statgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(104px,1fr));gap:10px}
.stat{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:11px 12px}
.stat b{display:block;font-size:20px;line-height:1.2}
.stat span{font-size:10.5px;letter-spacing:1.2px;text-transform:uppercase;color:var(--dim)}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.chip{display:inline-block;font-size:10.5px;font-weight:700;letter-spacing:1px;
  padding:3px 8px;border-radius:99px;background:var(--panel2);border:1px solid var(--line)}
.chip.w{color:var(--good);border-color:color-mix(in srgb,var(--good) 45%,transparent)}
.chip.l{color:var(--bad);border-color:color-mix(in srgb,var(--bad) 45%,transparent)}
.chip.d{color:var(--dim)}
.flink{color:var(--ink);border-bottom:1px dotted var(--line);cursor:pointer}
.flink:hover{color:var(--accent);border-bottom-color:var(--accent)}
table.hist td.r{width:40px;color:var(--dim);font-variant-numeric:tabular-nums}
.rk tr[data-f]{cursor:pointer}
.rk tr[data-f]:hover td{background:var(--panel2)}

/* ---- battle tv ---- */
.thumb{position:relative;display:flex;align-items:stretch;height:118px;border-radius:10px;overflow:hidden;
  background:var(--panel2);border:1px solid var(--line)}
.thumb .tside{flex:1;display:flex;align-items:center;justify-content:center;
  background:linear-gradient(150deg,hsl(var(--h) 60% 34%),hsl(var(--h) 55% 20%))}
.thumb .tside span{font-size:30px;font-weight:800;color:#fff;opacity:.92;letter-spacing:1px}
.thumb .tvs{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);
  background:var(--bg);color:var(--ink);font-weight:800;font-size:12px;letter-spacing:1px;
  padding:5px 9px;border-radius:99px;border:1px solid var(--line)}
.thumb .tbadge{position:absolute;left:8px;top:8px;background:var(--accent);color:#14140c;
  font-size:9.5px;font-weight:800;letter-spacing:1.2px;padding:3px 7px;border-radius:4px}
.thumb .tdur{position:absolute;right:8px;bottom:8px;background:rgba(0,0,0,.78);color:#fff;
  font-size:11px;padding:2px 6px;border-radius:4px;font-variant-numeric:tabular-nums}
.vod{cursor:pointer;margin:12px 0}
.vod:hover .vtitle{color:var(--accent)}
.vod.feat .thumb{height:190px}
.vgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(228px,1fr));gap:16px}
.vgrid .thumb{height:104px}
.vmeta{padding-top:9px}
.vtitle{font-weight:700;font-size:15.5px;line-height:1.35}
.vtitle.sm{font-size:13.5px}
.vsub{color:var(--dim);font-size:12px;margin-top:3px}
.player .thumb{height:230px}
.vturn{margin:10px 0;padding:11px 13px;border-radius:8px;background:var(--panel2)}
.vturn.op{border-left:3px solid var(--accent2)}
.vturn.you{border-left:3px solid var(--accent)}
.vturn b{font-size:12px;letter-spacing:1px;color:var(--dim)}
.vturn .verse{white-space:pre-wrap;margin-top:6px;font-size:14px}
.cmt{border-top:1px solid var(--line);padding:10px 0}
.reply{margin:9px 0 0 16px;padding-left:12px;border-left:2px solid var(--line)}
.reply b{font-size:12px;color:var(--accent)}
.reply div{font-size:13.5px}
.cmt b{font-size:12.5px;color:var(--accent)}
.searchbox{width:100%;background:var(--panel2);color:var(--ink);border:1px solid var(--line);
  border-radius:8px;padding:10px 12px;font-family:inherit;font-size:14px;margin-bottom:10px}
.tabs{display:flex;gap:6px;margin:0 0 16px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.tab{background:none;color:var(--dim);border:0;border-bottom:2px solid transparent;border-radius:0;
  padding:9px 13px;font-size:12px;letter-spacing:1.5px;font-weight:700}
.tab:hover{color:var(--ink);filter:none}
.tab.on{color:var(--accent);border-bottom-color:var(--accent)}
.dot{display:none;width:7px;height:7px;border-radius:99px;background:var(--accent2);vertical-align:2px;margin-left:4px}
.dot.show{display:inline-block}
.panel{display:none}
.panel.on{display:block}
.post{border:1px solid var(--line);border-radius:10px;padding:13px 15px;margin:10px 0;background:var(--panel)}
.post .ph{display:flex;gap:8px;align-items:baseline;font-size:12px;color:var(--dim);margin-bottom:7px;flex-wrap:wrap}
.post .ph b{color:var(--ink);font-size:13px}
.post .body{font-size:14.5px}
.post.clip{border-left:3px solid var(--accent)}
.post.beef{border-left:3px solid var(--accent2)}
.post.result{border-left:3px solid var(--line)}
.post .q{font-size:16px;line-height:1.5;border-left:2px solid var(--accent);padding-left:12px;margin:8px 0;font-style:italic}
.views{font-size:12px;color:var(--dim);margin-top:8px;letter-spacing:.5px}
.trend{display:inline-block;font-size:10px;letter-spacing:1.5px;font-weight:700;color:#14140c;
  background:var(--accent);padding:2px 7px;border-radius:99px;margin-left:6px}
.rk td.r{width:44px;color:var(--dim);font-variant-numeric:tabular-nums}
.rk tr.me td{background:var(--panel2);color:var(--accent);font-weight:700}
.rk tr.faceable td:nth-child(2){color:var(--accent2)}
.empty{color:var(--dim);font-style:italic;padding:20px 0}
.clockwrap{display:flex;align-items:center;gap:10px;justify-content:space-between;
  border:1px solid var(--line);border-radius:8px;padding:7px 12px;background:var(--panel);margin-bottom:8px}
.clockwrap #clock{font-size:24px;font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:1px}
.clockwrap.warn{border-color:var(--accent)} .clockwrap.warn #clock{color:var(--accent)}
.clockwrap.over{border-color:var(--accent2);animation:pulse 1s ease-in-out infinite}
.clockwrap.over #clock,.clockwrap.over #clocklab{color:var(--accent2)}
.clockwrap.idle{opacity:.5}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.62}}
.timing{font-size:13px;color:var(--dim);margin:10px 0;letter-spacing:.5px}
.timing.ot{color:var(--accent2);font-weight:600}
.card.overtime{border-left-color:var(--accent2)}
.react{border:1px dashed var(--line);border-radius:8px;padding:10px 12px;margin:12px 0;background:var(--panel2)}
.react .mrow{display:flex;justify-content:space-between;align-items:center}
.rtrack{height:4px;background:var(--line);border-radius:99px;overflow:hidden;margin:7px 0}
.rfill{height:100%;width:0;background:var(--accent);border-radius:99px}
.rpops{min-height:22px}
.rec{display:flex;gap:14px;flex-wrap:wrap;font-size:13px;color:var(--dim);margin-top:8px}
.rec b{color:var(--ink)}
.judge{opacity:0;transform:translateY(8px);transition:opacity .45s ease,transform .45s ease}
.judge.in{opacity:1;transform:none}
@media (prefers-reduced-motion:reduce){
  .bar-line,.judge{transition:none}
  .pop{animation:none}
}
</style>
</head>
<body>
<div class="wrap">
  <h1>MIC <span>CHECK</span></h1>
  <div class="sub">Underground Rap Battles &middot; 3 Rounds</div>
  <nav class="tabs" role="tablist">
    <button class="tab on" data-p="stage">BATTLE</button>
    <button class="tab" data-p="feed">BARZ <span class="dot" id="feeddot"></span></button>
    <button class="tab" data-p="tv">TV <span class="dot" id="tvdot"></span></button>
    <button class="tab" data-p="ranks">RANKINGS</button>
  </nav>
  <div id="stage" class="panel on"></div>
  <div id="feed" class="panel"></div>
  <div id="tv" class="panel"></div>
  <div id="ranks" class="panel"></div>
</div>

<script>
"use strict";

/* ---------------- opponents ---------------- */
const OPPONENTS = [
  {
    name:"SYLLABLE SAINT", style:"Elite Lyrical", diff:3, rec:{w:14,l:2,d:1}, otRate:0.12,
    vibe:"Speaks barely above a whisper, stacks four rhymes inside one breath. Never raises his voice because he has never had to.",
    verses:[
`Understand the anatomy: I'm mapping out your catalog,
Tragically you're rapping like a fragment of an analog
Signal in a satellite that's lagging out of orbit —
I'm a scalpel, you're a scab, I'm the album, you're the bootleg.
Every syllable I slide is like a chisel on a monument,
You recycle the familiar and you call the residue accomplishment.
I don't punch down, I don't have to, gravity's already on it,
You a rough draft of a rapper with a margin full of comments.
They said study me — you studied and you still ain't understood it,
'Cause the pattern ain't the point, it's the pressure underneath it.
I could spell out how I beat you but I'd rather let you read it
In the faces of the people who came out here to see it.`,
`Precision is the religion, I've been fasting on the vowel,
Every consonant a covenant, I sharpen 'em and file
'Em into something surgical — you scribble, then you smile
Like the effort is the outcome. Brother, effort ain't a style.
You been chasing the aesthetic of a man who found a method,
I don't borrow from the greats, I just remember what they left us.
Your bars is a suggestion, mine arrive as a directive,
You a question in a room where every answer is corrective.
And I'm patient — I don't rush it, watch the tempo do the damage,
I'll dismantle you in whispers and I'll never break the cadence.
So the crowd think I went easy? Nah, they witnessed a dissection,
The autopsy is finished. Here's your body. Here's the lesson.`,
`Final movement, no crescendo, I don't need it, I'm the metronome,
You a rapper renting relevance, I'm a landlord, this my metro zone.
Every line you wrote tonight I heard the skeleton of it before,
Recycled desperation with a better metaphor.
I gave you three whole rounds to find a weapon in your arsenal,
You came back with adjectives and volume — that's not marvelous.
I'm the reason people study what a syllable can carry,
You the reason people leave before the second act of every
Battle that you enter. Nah, don't take that as an insult,
Take it as a syllabus. The final grade is simple:
You showed up. That's the compliment. That's all of it. That's it.
Now hand the microphone back to the man who earned the grip.`]
  },
  {
    name:"PASTOR VENOM", style:"Aggressive Battle Rapper", diff:2, rec:{w:21,l:6,d:2}, otRate:0.45,
    vibe:"Preaches like a pulpit prophet, punches like a debt collector. Every bar is a sermon and every sermon ends with your obituary.",
    verses:[
`Congregation gather 'round, I'm 'bout to preach a eulogy,
This man walked in my house of pain expecting hospitality —
Nah. I bury amateurs, it's basement-level burial,
You brought a notebook full of nothing, that's a spiritual emergency.
Look at him rehearsing in his head, I see the lips move,
That's a prayer, not a punchline, and I'm here to disprove
That God saves everybody, 'cause tonight He took a day off,
Left you standing in my crosshairs while the whole room laughed you off.
I don't need a stage name, my government's a warning label,
You need a ghostwriter, a hype man, and a folding table
To hold up all the confidence you borrowed at the door —
When I'm done you gon' be crawling out the way you came: the floor.`,
`You survived round one the way a cough survives a winter —
Barely, loudly, and nobody was impressed, including the beginner
Standing next to you who came here just to watch somebody lose.
Congratulations, you the reason that he paid for his own booze.
I been doing this since basements had no heat and no permission,
You been doing this since somebody told you that you had a vision.
Visions don't win battles. Volume don't win battles.
Come in here with feelings, leave here with a rattle
In your chest 'cause I ain't finished, I'm just pacing out the damage,
I could end it in a bar but then the crowd don't get their average.
So I'll stretch it, let 'em savor it, let everybody see —
That ain't sweat up on your forehead, homie. That's the ceiling leaking.`,
`Third round, and you still here? That's endurance, I'll admit it,
But endurance ain't a talent, it's a symptom of committed
Bad decisions, and you made 'em all in public, on a Friday,
In a basement, in a city that will never learn your byline.
I don't hate you — hate takes energy, and energy costs money,
I just do this 'cause somebody's gotta tell you that it's funny
When you rhyme "again" with "again" and act like that's a scheme,
When you pause for a reaction and the room don't make a sound.
Go home. Not defeated — go home educated, humbled,
Tell 'em Pastor Venom preached and every pew in here was rumbled.
And the next time that you step up in a circle like tonight,
Bring a verse. Not a hope. Not a vibe. A verse. Goodnight.`]
  },
  {
    name:"LIL BRACKET", style:"Ambitious Amateur", diff:1, rec:{w:2,l:9,d:0}, otRate:0.6,
    vibe:"Seventeen, hoodie up, hands shaking, absolutely fearless. Wrote his bars in the notes app on the bus over. You kind of want him to win.",
    verses:[
`Yo, my name is Lil Bracket and I'm here to win,
I been practicing my flow since I don't know when.
You look kinda scared and I can see the fear,
That's why I got the crowd and you just got a beer.
I'm nice with the pen, yeah I'm nice with the pad,
You the worst that I seen and that's really really bad.
I got bars for days and I got bars for nights,
Step up to Lil Bracket, man, you gon' lose this fight.
Boom. That's a punchline. Did you hear that one?
I'ma do another one before this round is done:
You a clown, you a joke, you a bozo, you a fool —
Hold on, let me check my phone. Okay. That's cool.`,
`Round two, here we go, I got more in the tank,
All my homies in the back, yeah, they know what I'm bank-
ing on, that's a multi, I been learning about those,
My cousin said to use 'em so I put 'em in my flows.
You been talking real tough but I'm not even mad,
You remind me of my uncle and my uncle's kinda sad.
I got hunger, I got heart, I got nothing else to lose,
You got shoes that cost more than my whole entire shoes.
Wait — that came out weird. Okay, forget that line,
The next one's gonna hit though, just give it some time:
You're old and I'm young and that's just how it goes,
That's my verse. I'm done. That's it. Yo, respect though.`,
`Last round, and honestly I'm hyped that I was here,
I been watching this circle since my brother brought me near.
But I still gotta beat you 'cause that's how this thing work,
So I'ma say some mean stuff even though it kinda hurt.
Your haircut is bad. Your jacket is worse.
You probably got a job that you hate and you rehearse
Your excuses in the mirror every morning 'fore you leave —
Okay that one was real, I didn't mean to get deep.
Anyway, I'm Lil Bracket and I came, and I said it,
And whatever happens next, man, you gotta give me credit.
I'm sixteen with a dream and a notes app full of pain,
And I'm doing this again next week. And next week. Same.`]
  },
  {
    name:"THE OMELETTE", style:"Wildcard / Joker", diff:2, rec:{w:8,l:8,d:1}, otRate:0.5,
    vibe:"Wears a bathrobe. Claims to be a licensed notary. Every metaphor arrives from a direction geometry does not recognize.",
    verses:[
`I emerged from a vending machine in a Denny's parking lot
To inform you, personally, that your aura smells like parking lots.
I am the Omelette. I contain multitudes and also cheese.
I have never lost a battle, I have only lost my keys.
You rhyme like a printer that's been asked to print a feeling,
I rhyme like a raccoon that achieved a business degree and
Immediately used it to acquire your childhood home —
I'm evicting you emotionally. Please collect your garden gnome.
They tested me for talent and the doctor said "unclear,"
Then he wept, then he clapped, then he whispered "get him outta here."
I don't know what I'm doing. That's the horror. That's the threat.
A man who has no plan cannot be countered. Place your bets.`,
`Round two: I have consumed a document and now I am the law.
I notarized your verse. It was invalid. I saw flaws.
Specifically the part where you existed. Struck it down.
You may appeal in seven years, in writing, to a cloud.
I fight like a ceiling fan that learned about revenge,
I move in one direction but I do it without end.
Your punchlines got the energy of unbuttered toast,
I'm the guy your therapist describes but never quite to most
People, 'cause they wouldn't get it, 'cause I don't get it either,
I've been running on adrenaline and one enormous liter
Of a beverage that was banned in several agreeable nations.
You are losing to a bathrobe. Sit with that. No explanations.`,
`FINAL ROUND. I have ascended. I am now a filing cabinet.
Every drawer contains a version of you and I'm abandoning
All of them at once — that's called a mass emotional eviction,
It's a service that I offer and it comes with no restrictions.
You came here with a strategy. I came here with a moth.
The moth has been advising me. The moth says you are lost.
I've been wrong about a lot of things: my taxes, and my father,
But I've never been wrong twice about a man who wouldn't bother
Writing something weird enough to make a stranger feel afraid.
Normal is a coffin, friend. I dug it. You got laid
In it gently, with your average little adequate approach.
The Omelette has spoken. Someone please retrieve my coat.`]
  }
];

/* ---------------- text analysis engine ---------------- */
const VOWELS="aeiouy";
const STOP=new Set("the a an and or but if of to in on at is are was were be been i you he she it we they my your his her its our their me him them that this so for with as not no nah yeah got get like just".split(" "));

function words(s){return (s.toLowerCase().match(/[a-z']+/g)||[]);}
function lines(s){return s.split("\n").map(l=>l.trim()).filter(Boolean);}

function syllables(w){
  w=w.toLowerCase().replace(/[^a-z]/g,"");
  if(!w) return 0;
  if(w.length<=3) return 1;
  w=w.replace(/(?:[^laeiouy]es|ed|[^laeiouy]e)$/,"").replace(/^y/,"");
  const m=w.match(/[aeiouy]{1,2}/g);
  return m?m.length:1;
}
/* Phonetics: a rhyme in battle rap is a TAIL of matching vowel sounds running
   across the last few syllables of a line, not just the final word. We reduce
   each line to its trailing vowel-sound sequence and measure how deep two
   tails agree. Depth 1 = plain rhyme. Depth 2+ = a multisyllabic. */
function norm(w){
  w=w.toLowerCase().replace(/[^a-z]/g,"");
  if(/[^aeiouy]e$/.test(w)) w=w.slice(0,-1);   // silent trailing e
  return w;
}
const VMAP=[[/^(ee|ea|ie|y)$/,"E"],[/^(oo|ou|ue|ew)$/,"U"],[/^(ai|ay|ey|a)$/,"A"],
            [/^(igh|ie|i)$/,"I"],[/^(oa|ow|o)$/,"O"],[/^(e)$/,"E"],[/^(u)$/,"U"]];
function vsound(v){
  for(const[re,c] of VMAP) if(re.test(v)) return c;
  return v[0].toUpperCase();
}
// Trailing vowel sounds of a line, last -> first. Crucially, unstressed vowels
// in English all reduce to schwa, which spelling hides: "narrative" and
// "terrible" share no vowel letters but rhyme as (schwa, schwa). We approximate
// stress as the final full syllable of the last long word, and reduce the rest.
function tailSounds(line){
  const ws=(line.toLowerCase().match(/[a-z']+/g)||[]).map(norm).filter(Boolean);
  if(!ws.length) return {v:[],c:""};
  const out=[];
  for(let wi=ws.length-1; wi>=0 && out.length<6; wi--){
    const w=ws[wi];
    const vs=w.match(/[aeiouy]+/g)||[];
    const nSyl=vs.length;
    for(let k=vs.length-1;k>=0;k--){
      const v=vs[k];
      // a monosyllable that is a content word keeps its full value;
      // in a polysyllable only the first syllable carries stress reliably
      const stressed = (nSyl===1 && !STOP.has(w)) || (nSyl>1 && k===0);
      out.push(stressed ? vsound(v) : (v.length===1 ? "@" : vsound(v)));
    }
  }
  const cm=ws[ws.length-1].match(/[^aeiouy]*$/);
  return {v:out.slice(0,6), c:(cm?cm[0]:"").slice(-2)};
}
function lineTail(line){ return tailSounds(line); }
// how many trailing syllables two line-tails share
function rhymeDepth(a,b){
  if(!a.v.length||!b.v.length) return 0;
  let d=0;
  while(d<a.v.length && d<b.v.length && a.v[d]===b.v[d]) d++;
  if(!d) return 0;
  const cMatch = a.c===b.c || a.c.endsWith(b.c) || b.c.endsWith(a.c);
  if(d===1 && !cMatch) return 0;   // one vowel + clashing consonant is not a rhyme
  return d;
}
function rhymeKey(w){
  w=norm(w); if(!w) return "";
  const m=w.match(/[aeiouy]+[^aeiouy]*$/);
  if(!m) return w.slice(-2);
  const vm=m[0].match(/^[aeiouy]+/);
  return vsound(vm[0])+m[0].replace(/^[aeiouy]+/,"").slice(0,2);
}
function rhymes(a,b){
  if(!a||!b) return false;
  const ka=rhymeKey(a),kb=rhymeKey(b);
  return !!ka&&ka===kb;
}

function analyze(text){
  const L=lines(text), W=words(text);
  const r={ lineCount:L.length, wordCount:W.length, lines:L };

  // end rhymes, measured by how deep the line tails agree
  const tails=L.map(lineTail);
  const ends=L.map(l=>{const w=words(l);return w[w.length-1]||"";});
  let endRhyme=0, multi=0, depthSum=0;
  const paired=new Array(L.length).fill(false);
  for(let i=0;i<L.length;i++){
    if(paired[i]) continue;
    for(let j=i+1;j<Math.min(L.length,i+4);j++){
      if(paired[j]) continue;
      const d=rhymeDepth(tails[i],tails[j]);
      if(d>=1){
        endRhyme++; depthSum+=d; paired[i]=paired[j]=true;
        if(d>=2) multi++;   // vowel run across 2+ syllables
        break;
      }
    }
  }
  r.endRhyme=endRhyme; r.multiRhyme=multi;
  r.avgDepth = endRhyme? depthSum/endRhyme : 0;
  r.rhymeRate = L.length>1 ? endRhyme/Math.floor(L.length/2) : 0;

  // internal rhyme: within-line word-tail repeats
  let internal=0;
  L.forEach(l=>{
    const ws=words(l).filter(w=>w.length>2);
    const seen={};
    ws.forEach(w=>{const k=rhymeKey(w); if(!k)return; seen[k]=(seen[k]||0)+1;});
    Object.values(seen).forEach(c=>{ if(c>1) internal+=c-1; });
  });
  r.internal=internal;

  // cadence: syllable counts per line, lower stddev = tighter
  const syl=L.map(l=>words(l).reduce((a,w)=>a+syllables(w),0));
  r.syl=syl;
  const avg=syl.reduce((a,b)=>a+b,0)/(syl.length||1);
  const varc=syl.reduce((a,b)=>a+(b-avg)**2,0)/(syl.length||1);
  r.avgSyl=avg; r.sylDev=Math.sqrt(varc);

  // vocabulary richness (non-stopword uniqueness)
  const content=W.filter(w=>!STOP.has(w));
  r.unique = content.length? new Set(content).size/content.length : 0;
  r.contentCount=content.length;

  // imagery / comparison devices
  r.similes=(text.match(/\b(like|as)\s+(a|an|the|my|your|some)\b/gi)||[]).length;
  r.imAWordYoureA=(text.match(/\b(i'?m|i am|you'?re|you are)\s+(a|an|the)\b/gi)||[]).length;
  // direct address = engagement
  r.youRefs=(text.match(/\byou\b|\byour\b|\byou'?re\b/gi)||[]).length;
  // wordplay markers: repeated root with different suffix
  let play=0; const roots={};
  content.forEach(w=>{ if(w.length>4){const rt=w.slice(0,4); roots[rt]=(roots[rt]||0)+1;} });
  Object.values(roots).forEach(c=>{if(c>1)play+=c-1;});
  r.wordplay=play;
  // filler / corny tells
  r.filler=(text.match(/\b(yo|uh|like|umm?|basically|really really|very very)\b/gi)||[]).length;
  // rhyming a word with itself
  let selfRhyme=0;
  for(let i=0;i<ends.length-1;i++) for(let j=i+1;j<Math.min(ends.length,i+4);j++) if(ends[i]&&ends[i]===ends[j]) selfRhyme++;
  r.selfRhyme=selfRhyme;
  // copy-paste padding: identical or near-identical repeated bars
  const norml=L.map(l=>words(l).join(" "));
  r.dupLines=norml.length-new Set(norml).size;

  r.longestLine=L.reduce((a,l)=>Math.max(a,words(l).length),0);

  // normalize raw counts to a 12-bar basis: length alone must not buy points
  const k = L.length? Math.min(1, 12/L.length) : 0;
  r.multiRhyme *= k; r.internal *= k; r.wordplay *= k;
  r.youRefs *= k; r.similes *= k; r.imAWordYoureA *= k;
  r.contentCount *= k; r.filler *= k; r.selfRhyme *= k; r.dupLines *= k;
  return r;
}

const clamp=(n,lo,hi)=>Math.max(lo,Math.min(hi,n));

function scoreRound(a){
  // Lyricism: rhyming at all is table stakes; depth, density and diction separate.
  let lyr = 1.5;
  lyr += clamp(a.rhymeRate,0,1)*1.5;
  lyr += clamp(a.multiRhyme*0.5,0,2.2);
  lyr += clamp((a.avgDepth-1)*2.2,0,2.4);
  lyr += clamp(a.internal*0.22,0,1.5);
  lyr += clamp((a.unique-0.55)*6,0,1.8);
  lyr += clamp((a.similes+a.imAWordYoureA)*0.3,0,1.2);
  lyr += clamp(a.wordplay*0.2,0,0.8);
  lyr -= clamp(a.selfRhyme*0.6,0,2);
  lyr -= clamp(a.filler*0.35,0,1.8);
  lyr -= clamp(a.dupLines*0.8,0,4);
  if(a.lineCount<4) lyr-=2.2; else if(a.lineCount<8) lyr-=0.9;

  // Flow: cadence consistency, line length sanity, rhyme landing
  let flo = 2.0;
  flo += clamp(4 - a.sylDev*0.75, 0, 3.4);          // tight = good
  flo += clamp(a.rhymeRate,0,1)*1.8;
  flo += (a.avgSyl>=7&&a.avgSyl<=17)?1.5:0.2;        // battle-length bars
  flo += clamp(a.internal*0.15,0,1.0);
  flo -= clamp(a.filler*0.3,0,1.6);
  flo -= clamp(a.dupLines*0.5,0,3);
  if(a.longestLine>22) flo-=1.0;                     // runaway bar
  if(a.lineCount<4) flo-=2.0;

  // Punchlines: aggression, direct address, setup/turn structure, imagery
  let pun = 1.8;
  pun += clamp(a.youRefs*0.42,0,2.8);
  pun += clamp((a.similes+a.imAWordYoureA)*0.62,0,2.6);
  pun += clamp(a.contentCount*0.035,0,1.6);
  pun += clamp(a.multiRhyme*0.28,0,1.0);
  pun -= clamp(a.filler*0.28,0,1.3);
  pun -= clamp(a.dupLines*0.7,0,4);
  if(a.youRefs===0) pun-=1.6;                        // never addressed opponent
  if(a.lineCount<4) pun-=2.0;

  return {
    lyricism: clamp(Math.round(lyr*10)/10,1,10),
    flow:     clamp(Math.round(flo*10)/10,1,10),
    punch:    clamp(Math.round(pun*10)/10,1,10)
  };
}

/* opponent scores: derived from their own text, nudged by difficulty */
function scoreOpponent(text,diff){
  const s=scoreRound(analyze(text));
  const bump={1:-3.4,2:-1.2,3:-1.2}[diff]||0;
  return {
    lyricism:clamp(Math.round((s.lyricism+bump)*10)/10,1,10),
    flow:clamp(Math.round((s.flow+bump*0.8)*10)/10,1,10),
    punch:clamp(Math.round((s.punch+bump*0.9)*10)/10,1,10)
  };
}

/* ---------------- judge commentary ---------------- */
function bestLine(a,text){
  const L=a.lines; if(!L.length) return "";
  let best=L[0],bs=-1;
  L.forEach(l=>{
    const w=words(l);
    const s=w.length*0.5 + (l.match(/\b(like|as)\s+(a|an|the)\b/i)?4:0) + new Set(w.map(rhymeKey)).size*0.3;
    if(s>bs){bs=s;best=l;}
  });
  return best;
}
function worstLine(a){
  const L=a.lines; if(!L.length) return "";
  let worst=L[0],ws=1e9;
  L.forEach(l=>{
    const w=words(l);
    const s=w.length + (w.filter(x=>!STOP.has(x)).length)*1.5 - (l.match(/\b(yo|uh|like)\b/i)?3:0);
    if(s<ws){ws=s;worst=l;}
  });
  return worst;
}

function purist(a,s,opName){
  const out=[];
  if(a.lineCount===0) return ["You submitted air. I judge text. There was none."];
  out.push(a.multiRhyme>=3
    ? `You stacked ${a.multiRhyme} multisyllabic landings. That is craft, not accident — I heard the scheme hold across the couplet.`
    : a.multiRhyme>0
      ? `${a.multiRhyme} multi${a.multiRhyme>1?"s":""}. A gesture toward a scheme, not a scheme. You rhymed the last syllable and called it architecture.`
      : `Not one multisyllabic rhyme. Every landing was a single beat on a single vowel. That is a nursery structure with adult vocabulary on top.`);
  out.push(a.internal>=4
    ? `Internal rhyme count sits at ${a.internal} — the bars are woven, not just capped.`
    : `Internal rhyme was nearly absent (${a.internal}). Everything waited for the end of the line. The middle of your bars is dead space.`);
  if(a.selfRhyme>0) out.push(`You rhymed a word with itself ${a.selfRhyme} time${a.selfRhyme>1?"s":""}. That is not a rhyme. That is a repeat with confidence.`);
  out.push(a.similes+a.imAWordYoureA>=3
    ? `The figurative work was present — ${a.similes+a.imAWordYoureA} constructed comparisons. Some landed; comparison is still the cheapest door into a metaphor, and you used it often.`
    : `Almost no metaphor. You told me things about ${opName}. You never made me see one.`);
  out.push(`Diction density: ${(a.unique*100).toFixed(0)}% of your content words were unrepeated. ${a.unique>0.72?"Wide vocabulary, well spent.":a.unique>0.6?"Serviceable. You leaned on a small word pool.":"Narrow. You circled the same six ideas in different clothes."}`);
  return out;
}
function crowd(a,s){
  const out=[];
  if(a.lineCount===0) return ["Dead air. The room emptied. Next."];
  out.push(a.sylDev<2.2
    ? `Cadence was locked — syllable variance of ${a.sylDev.toFixed(1)} across ${a.lineCount} bars. You could ride any beat in this room with that.`
    : a.sylDev<4
      ? `Variance of ${a.sylDev.toFixed(1)}. Mostly on time, but a few bars ran long and you had to swallow words to fit them back in.`
      : `Syllable variance of ${a.sylDev.toFixed(1)} — that is not a pocket, that is a pothole. Some bars were ${Math.min(...a.syl)} syllables, some were ${Math.max(...a.syl)}. The crowd cannot nod to that.`);
  out.push(`Average bar length: ${a.avgSyl.toFixed(1)} syllables. ${a.avgSyl<7?"Too short — you kept ending before the bar finished. Sounds nervous.":a.avgSyl>17?"Too long — you are writing paragraphs and hoping they breathe. They do not.":"Right in the battle pocket."}`);
  out.push(a.youRefs>=5
    ? `You addressed your opponent ${a.youRefs} times. The room felt attacked on your behalf. That is what this is.`
    : a.youRefs>0
      ? `Only ${a.youRefs} direct hit${a.youRefs>1?"s":""} at the man in front of you. The rest was about yourself. Nobody paid to hear your résumé.`
      : `You never once addressed him. This was a poem performed near a battle.`);
  if(a.filler>2) out.push(`I counted ${a.filler} filler syllables — "yo", "uh", "like". Every one of those is a beat you gave away for free.`);
  return out;
}
function sid(a,s,text,opName){
  const out=[];
  if(a.lineCount===0) return ["Nothing. You typed nothing and expected a verdict. Here it is: no."];
  if(a.lineCount<8) out.push(`${a.lineCount} bars. The format said eight to sixteen. You didn't lose on quality first — you lost on showing up short.`);
  const w=worstLine(a);
  if(w) out.push({q:w, t:`That right there. Read it back out loud. ${a.filler>0?"You put filler in a written line — nobody was rushing you.":"It's a line that exists because the next one needed a runway."} Cut it and the verse gets better immediately.`});
  const b=bestLine(a);
  if(b) out.push({q:b, t:`That one I'll give you. ${s.punch>6?"It had a setup and it had a turn, which is more than most people manage down here.":"It's the best thing in the verse, which tells you more about the verse than the line."}`});
  if(a.selfRhyme>0) out.push(`Rhyming a word with itself is the oldest tell in the building. I heard it ${a.selfRhyme} time${a.selfRhyme>1?"s":""} and so did everybody behind me.`);
  if(a.similes+a.imAWordYoureA===0) out.push(`Zero comparisons. No "you're a", no "like a". You had ${a.lineCount} chances to make ${opName} into an image and you described him literally every time. Literal is not a punchline.`);
  const avgS=(s.lyricism+s.flow+s.punch)/3;
  out.push(avgS>7.5?`I'm not going to pretend. That was good. I hate that it was good.`
    :avgS>5.5?`It was competent. Competent doesn't get quoted on the way out of the building.`
    :`It was survivable. Barely. You didn't embarrass yourself and that is the entire compliment.`);
  return out;
}

/* ---------------- crowd ---------------- */
const CROWD={
  huge:["OHHHHHH!!","THE ROOM IS GONE. Hats on the floor.","Somebody just fell into the wall.","AYYYY! Rewind that! REWIND THAT!","Three people are holding their heads.","The whole back row stood up.","Somebody threw a cup. Not in anger. In joy.","A man is pointing at the ceiling and screaming."],
  good:["Ohhh!","A wave of \"ohhh\" rolls through the back.","Heads nodding. That landed.","Somebody goes \"okay, okay!\"","A few people react. That one had weight.","The circle tightens up a little."],
  mild:["Scattered nods.","A couple people react.","Somebody says \"aight\" without much behind it.","Polite. The room is still waiting.","Mild murmur."],
  dead:["Silence.","Someone coughs.","Nobody moves.","A phone screen lights up in the back. Somebody's checking the time.","The host looks at his shoes.","You can hear the box fan."],
  ambient:["Somebody in the back yells \"TAKE YOUR TIME!\"","The box fan rattles.","A bottle rolls across the floor.","Somebody's filming on a cracked phone.","The circle shifts, waiting.","Someone whispers \"he cooked him last week too.\"","A guy near the stairs keeps saying \"ooh\" at nothing.","The pipes knock twice.","Somebody yells \"WE WAITING!\""],
  adlib:["*grins*","*steps closer*","*points at you*","*shakes his head, smiling*","*turns to the crowd*","*taps his temple*","*paces the circle*","*opens his arms*"]
};
const pick=a=>a[Math.floor(Math.random()*a.length)];

/* How hard a single bar hits: rhyme link to the bar before it, length, and
   whether it actually swings at somebody. Drives the live crowd. */
function lineHeat(line, prev){
  const w=words(line); if(!w.length) return 0;
  let h=0.18;
  if(prev){
    const d=rhymeDepth(lineTail(prev),lineTail(line));
    h += d>=3?0.42 : d===2?0.30 : d===1?0.15 : 0;
  }
  const syl=w.reduce((a,x)=>a+syllables(x),0);
  if(syl>=8&&syl<=18) h+=0.12;
  if(/\b(like|as)\s+(a|an|the|my|your)\b/i.test(line)) h+=0.14;
  if(/\b(you|your|you're)\b/i.test(line)) h+=0.12;
  const content=w.filter(x=>!STOP.has(x));
  h += clamp(content.length*0.016,0,0.16);
  if(/\b(yo|uh|umm?)\b/i.test(line)) h-=0.12;
  if(w.length<4) h-=0.14;
  return clamp(h,0,1);
}
function heatTier(h){ return h>0.72?"huge":h>0.52?"good":h>0.32?"mild":"dead"; }

/* ---------------- records ---------------- */
/* Career records persist per browser. Storage can throw or come back empty
   (private windows, blocked site data), so every access is guarded and the
   game runs identically without it. */
const REC_KEY="miccheck.save.v2";
const HIST_CAP=40;          // bouts kept per fighter (declared before buildLeague runs)

/* Every bout is scored by a panel of five. How lopsided the card reads
   follows how dominant the win actually was, so a blowout comes back 5-0 and
   a battle decided by a hair comes back 3-2. */
function decisionFor(dominance,rnd2){
  const r=(rnd2||Math.random)();
  const d=clamp(dominance,0,1);
  const pUnan=0.10+d*0.62, pMaj=pUnan+0.25+d*0.12;
  if(r<pUnan)  return {tally:"5-0", label:"Unanimous Decision"};
  if(r<pMaj)   return {tally:"4-1", label:"Majority Decision"};
  return {tally:"3-2", label:"Split Decision"};
}
const DRAW_DEC={tally:"3-3", label:"Draw"};
// "MADI vs LIL BRACKET | 3-2 Split Decision MADI"
function decLine(a,b,dec,winner){
  return `${a} vs ${b} | ${dec.tally} ${dec.label}${winner?" "+winner:""}`;
}

/* ---------------- the league ---------------- */
/* A ladder of exactly 65: you, the four you can face, and 60 who battle each
   other in the background so the rankings and the feed keep moving. */
const FN1=["YOUNG","BIG","LIL","MAD","KING","DJ","MC","SIR","OG","DOC","SAINT","BARON","THE","PROF","EL","CAPTAIN"];
const FN2=["VERSE","MALICE","CIPHER","GRAVEL","SERMON","STATIC","MARROW","THESAURUS","TREMOR","GOSPEL","VENDETTA",
           "LEXICON","OBITUARY","CADENCE","SYNTAX","HOLLOW","QUARRY","PARABLE","MONSOON","FRACTURE","VANDAL",
           "TERMITE","ARSON","PENDULUM","GRAMMAR","SCRIPTURE","BASEMENT","LANTERN","VULTURE","ASPHALT","TITHE"];
const SOLO=["PAPERCUT","DEADWEIGHT","NO COMMENT","HANDWRITING","CHALK OUTLINE","BUS FARE","LOOSE TOOTH",
            "WET CEMENT","SECOND OPINION","THE LANDLORD","COLD PIZZA","STAIRWELL","JURY DUTY","MOTH BALL",
            "LOW BATTERY","THE DENTIST","FIRE EXIT","SPARE KEY","TAX SEASON","QUIET STORM","BROKEN ESCALATOR"];

/* Back-fill a career for any fighter carrying a record but no bout log, so a
   profile opened on day one is not blank - and so saves made before histories
   existed get one too. The generated bouts add up to exactly the record the
   fighter already holds, against real names from the same league, each with
   its own decision, dated backwards in time. */
function backfillHistories(list,rnd){
  rnd=rnd||Math.random;
  const roster=list.map(f=>f.name);
  list.forEach(f=>{
    const total=(f.w||0)+(f.l||0)+(f.d||0);
    if(Array.isArray(f.hist) && f.hist.length>=Math.min(total,HIST_CAP)) return;   // already has one
    const seq=[...Array(f.w||0).fill("w"),...Array(f.l||0).fill("l"),...Array(f.d||0).fill("d")];
    for(let i=seq.length-1;i>0;i--){ const j=Math.floor(rnd()*(i+1)); [seq[i],seq[j]]=[seq[j],seq[i]]; }
    let t=Date.now();
    f.hist=seq.slice(0,HIST_CAP).map(res=>{
      t-=(1+Math.floor(rnd()*6))*86400000;
      let vs=roster[Math.floor(rnd()*roster.length)];
      if(vs===f.name) vs=roster[(roster.indexOf(vs)+1)%roster.length];
      const dec = res==="d" ? DRAW_DEC : decisionFor(rnd()*0.9,rnd);
      return {res, vs, ts:t, ev:"card", dec:dec.tally, lab:dec.label};
    });
  });
}

// small deterministic RNG so a league generated once looks intentional
function mulberry(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);
  t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}

function buildLeague(){
  const rnd=mulberry(20260919);
  const names=new Set(SOLO);
  while(names.size<60){
    const n=FN1[Math.floor(rnd()*FN1.length)]+" "+FN2[Math.floor(rnd()*FN2.length)];
    names.add(n);
  }
  const list=[...names].slice(0,60).map(n=>{
    const pow=2+rnd()*7.5;                       // hidden strength, drives sim results
    const bouts=8+Math.floor(rnd()*26);
    const wr=clamp(0.18+(pow/10)*0.62+(rnd()-0.5)*0.14,0.08,0.93);
    const w=Math.round(bouts*wr), d=rnd()<0.25?1:0;
    return {name:n,w,l:Math.max(0,bouts-w-d),d,pow:Math.round(pow*10)/10,npc:true,hist:[]};
  });
  // the four you can actually face join the same ladder
  OPPONENTS.forEach(o=>list.push({name:o.name,...o.rec,pow:[0,4.5,7,8.8][o.diff]||6,npc:false,hist:[]}));

  /* Back-fill a career so a profile opened on day one is not blank. The
     generated bouts add up to exactly the record the fighter already carries,
     against real names from this same league, dated backwards in time. */
  backfillHistories(list,rnd);
  return list;
}

const SEED=()=>({
  user:{name:"YOU",w:0,l:0,d:0,streak:0,best:0,form:[],hist:[]},
  ops:Object.fromEntries(OPPONENTS.map(o=>[o.name,{...o.rec}])),
  league:buildLeague(), feed:[], vods:[], clips:0, named:false
});
function loadRecords(){
  try{
    const raw=localStorage.getItem(REC_KEY);
    if(!raw) return SEED();
    const p=JSON.parse(raw), base=SEED();
    if(!p||typeof p!=="object") return base;
    base.user={...base.user,...(p.user||{})};
    if(!Array.isArray(base.user.form)) base.user.form=[];
    if(!Array.isArray(base.user.hist)) base.user.hist=[];
    for(const n in base.ops) if(p.ops&&p.ops[n]) base.ops[n]={...base.ops[n],...p.ops[n]};
    // a save from an earlier league size is rebuilt, keeping the records it held
    if(Array.isArray(p.league)&&p.league.length===base.league.length) base.league=p.league;
    else if(Array.isArray(p.league)){
      const old=Object.fromEntries(p.league.map(f=>[f.name,f]));
      base.league.forEach(f=>{ const o=old[f.name]; if(o){f.w=o.w;f.l=o.l;f.d=o.d;f.hist=o.hist;} });
    }
    // saves written before bout logs existed carry records with no history
    backfillHistories(base.league);
    const played=(base.user.w||0)+(base.user.l||0)+(base.user.d||0);   // inline: bouts() is declared later
    if(played>base.user.hist.length) backfillHistories([base.user]);
    if(Array.isArray(p.feed)) base.feed=p.feed.slice(0,150);
    if(Array.isArray(p.vods)) base.vods=p.vods.slice(0,60);
    base.clips=p.clips||0; base.named=!!p.named;
    return base;
  }catch(e){ return SEED(); }
}
function saveRecords(r){ try{ localStorage.setItem(REC_KEY,JSON.stringify(r)); }catch(e){} }
let RECORDS=loadRecords();

/* the ladder: the user is ranked among all 65 */
function ladder(){
  const rows=RECORDS.league.map(f=>({...f}));
  rows.push({name:RECORDS.user.name,w:RECORDS.user.w,l:RECORDS.user.l,d:RECORDS.user.d,you:true});
  rows.forEach(f=>{
    const g=f.w+f.l+f.d;
    f.pts=f.w*3+f.d;
    f.pct=g?f.w/g:0;
  });
  rows.sort((a,b)=> b.pts-a.pts || b.pct-a.pct || a.l-b.l || a.name.localeCompare(b.name));
  rows.forEach((f,i)=>f.rank=i+1);
  return rows;
}
function myRank(){ const r=ladder().find(f=>f.you); return r?r.rank:ladder().length; }

/* a post plus a small argument underneath it */
function chatter(ctx,n){
  const types=["analyst","purist","hype","stan","hater","casual"];
  for(let i=0;i<(n||3);i++){
    const t=pick(types), who=pickVoice(t);

function nowStamp(){ return Date.now(); }
function ago(ts){
  const m=Math.floor((Date.now()-ts)/60000);
  if(m<1) return "now"; if(m<60) return m+"m";
  const h=Math.floor(m/60); if(h<24) return h+"h";
  return Math.floor(h/24)+"d";
}
function post(o){
  RECORDS.feed.unshift({id:Math.random().toString(36).slice(2),ts:nowStamp(),
                        likes:Math.floor(Math.random()*40),...o});
  RECORDS.feed=RECORDS.feed.slice(0,150);
}
const fmtViews=n=> n>=1e6?(n/1e6).toFixed(1)+"M" : n>=1e3?(n/1e3).toFixed(1)+"K" : String(n);

/* THE CLIP SYSTEM — the hook of the whole social layer.
   Your hardest bar each round gets clipped. Views scale off how hard it hit
   and how loud the room was, so writing a real bar is what makes you famous. */
function clipBar(line,heat,roundNo,opName){
  if(!line) return null;
  const base=400+Math.pow(heat,2.3)*46000;
  const roomBonus=1+(state.heat/100)*1.4;
  const views=Math.round(base*roomBonus*(0.75+Math.random()*0.6));
  const trending=views>28000;
  RECORDS.clips++;
  post({kind:"clip",who:"@"+handle(RECORDS.user.name),quote:line,views,trending,
        text:`Round ${roundNo} vs ${opName}.`});
  if(trending){
    post({kind:"fan",who:pick(FANS),
      text:pick([`"${line}" I'm not okay. I'm not okay.`,
                 `run that back. "${line}" RUN IT BACK.`,
                 `whoever clipped "${line}" deserves a raise`,
                 `"${line}" is going in my notes app permanently`,
                 `nah "${line}" ended that man's whole career arc`])});
    post({kind:"fan",who:pick(FANS),text:pick([
      `the room GONE after that one. gone.`,
      `i rewound this 11 times. eleven.`,
      `this is the clip of the night and it ain't close`])});
  }
  return {views,trending};
}
const handle=n=>String(n).toLowerCase().replace(/[^a-z0-9]+/g,"")||"you";

/* ---------------- the rest of the card ---------------- */
/* You are not the only battle in the building. Every time you finish a match
   the rest of the ladder fights too: everyone is eligible (including the four
   you can face), fighters are paired without repeats so nobody battles twice
   in one night, and every bout ends in a win and a loss - or, rarely, a draw
   on both records. */
function fighterRow(name){ return RECORDS.league.find(f=>f.name===name); }

/* the four faceable opponents keep a second copy of their record for the
   battle screens, so any change has to land on both */
function logBout(holder,res,vs,ev,dec){
  if(!Array.isArray(holder.hist)) holder.hist=[];
  holder.hist.unshift({res,vs,ts:nowStamp(),ev:ev||"card",
                       dec:(dec||DRAW_DEC).tally, lab:(dec||DRAW_DEC).label});
  holder.hist=holder.hist.slice(0,HIST_CAP);
}
function creditResult(f,key,vs,ev,dec){
  f[key]++;
  if(!f.npc && RECORDS.ops[f.name]) RECORDS.ops[f.name][key]++;
  if(vs) logBout(f,key,vs,ev,dec);
}
function creditUser(res,vs,ev,dec){
  RECORDS.user[res]++;
  RECORDS.user.streak = res==="w" ? (RECORDS.user.streak||0)+1 : 0;
  logBout(RECORDS.user,res,vs,ev,dec);
}

function simLeagueNight(){
  const pool=RECORDS.league.slice();           // everyone, faceable four included
  for(let i=pool.length-1;i>0;i--){            // shuffle, then pair off
    const j=Math.floor(Math.random()*(i+1));
    [pool[i],pool[j]]=[pool[j],pool[i]];
  }
  const bouts=9+Math.floor(Math.random()*4);   // 9-12 battles on the undercard
  const results=[];
  for(let i=0;i<bouts*2 && i+1<pool.length;i+=2){
    const a=pool[i], b=pool[i+1];
    const pa=a.pow/(a.pow+b.pow);
    const r=Math.random();
    if(r<0.06){
      creditResult(a,"d",b.name,"card",DRAW_DEC); creditResult(b,"d",a.name,"card",DRAW_DEC);
      results.push({draw:true,a,b,dec:DRAW_DEC});
    } else {
      const aWins = r < 0.06+0.94*pa;
      const win=aWins?a:b, lose=aWins?b:a;
      const dec=decisionFor(Math.abs(skillOf(win)-skillOf(lose))*2.4);
      creditResult(win,"w",lose.name,"card",dec); creditResult(lose,"l",win.name,"card",dec);
      // an upset is the weaker fighter taking it
      results.push({draw:false,win,lose,dec,upset:win.pow < lose.pow-1.6});
    }
  }

  // report the card: a couple of write-ups, then the full results roundup
  const feature=results.filter(r=>!r.draw);
  const upsets=feature.filter(r=>r.upset);
  upsets.slice(0,2).forEach(r=>post({kind:"result",who:pick(PRESS),
    text:`UPSET — ${decLine(r.win.name,r.lose.name,r.dec,r.win.name)}. ${pick(["Nobody saw it coming.","The ladder moves tonight.","Crowd stormed the circle.","He was not supposed to be here."])}`}));
  feature.filter(r=>!r.upset).slice(0,2).forEach(r=>post({kind:"result",who:pick(PRESS),
    text:`${decLine(r.win.name,r.lose.name,r.dec,r.win.name)}. ${pick(["Judges took four minutes.","Never in doubt.","The room agreed.","Panel barely argued."])}`}));
  results.filter(r=>r.draw).slice(0,1).forEach(r=>post({kind:"result",who:pick(PRESS),
    text:`DRAW — ${r.a.name} vs ${r.b.name} | 3-3, nobody moves. Crowd not happy.`}));

  feature.slice(0,3).forEach(r=>uploadVOD({a:r.win.name,b:r.lose.name,win:r.win.name,
    main:false, close:r.upset, note:r.upset?"Upset on the undercard.":""}));
  if(feature.length) chatter({win:feature[0].win.name, lose:feature[0].lose.name,
    dec:feature[0].dec.tally+" "+feature[0].dec.label}, 1+Math.floor(Math.random()*2));
  post({kind:"press",who:"@SublevelStats",
    text:`TONIGHT'S CARD (${results.length} battles) — `+results.map(r=>r.draw
      ? `${r.a.name} drew ${r.b.name} (3-3)`
      : `${r.win.name} def. ${r.lose.name} (${r.dec.tally})`).join(" · ")});
  return results;
}

function vodTitle(a,b,main){

function uploadVOD(o){
  const heat=o.main?1:0.22;
  const views=Math.round((800+Math.random()*9000)*heat*(1+(o.close?1.6:0)) + Math.random()*1500);
  const v={
    id:Math.random().toString(36).slice(2,9),
    a:o.a, b:o.b, win:o.win, main:!!o.main, ts:nowStamp(),
    views:Math.max(120,views), likes:Math.round(views*(0.04+Math.random()*0.09)),
    dur:`${8+Math.floor(Math.random()*7)}:${String(Math.floor(Math.random()*60)).padStart(2,"0")}`,
    note:o.note||"", scoreLine:o.scoreLine||"",

    rounds:o.rounds||null

  RECORDS.vods=RECORDS.vods.slice(0,VOD_CAP);
  return v;
}

     :`<div class="card"><div class="crowd">No footage kept for this one &mdash; the channel only stores full verses for your most recent battles.</div></div>`}

    </div>`;
  document.getElementById("vback").addEventListener("click",renderTV);

function recOf(name){
  if(name===RECORDS.user.name) return RECORDS.user;
  return fighterRow(name)||{w:0,l:0,d:0};
}

/* ---------------- the simulator ---------------- */
/* Simulated battles are decided by how well you have actually been writing.
   Your rating is the rolling average of your real per-round scores, so the
   only way to sim better results is to go and write better verses. Until you
   have played a real match the rating is provisional and says so. */
const PROVISIONAL=17.5;

function userRating(){
  const f=RECORDS.user.form||[];
  if(!f.length) return {rating:PROVISIONAL, provisional:true, n:0};
  const r=f.reduce((a,b)=>a+b,0)/f.length;
  return {rating:Math.round(r*10)/10, provisional:f.length<2, n:f.length};
}
// an NPC's writing strength on the same per-round scale the judges use
// mapped onto the band real verses actually score in: a weak fighter is
// beatable but not free, the very top needs a genuinely strong pen
const powToScore=pow=>15.2+(clamp(pow,1,10)/10)*8.6;
function fighterScore(f){
  if(!f.npc){
    const o=OPPONENTS.find(x=>x.name===f.name);
    if(o){ const v=o.verses.map(t=>scoreOpponent(t,o.diff));
      return v.reduce((a,x)=>a+x.lyricism+x.flow+x.punch,0)/v.length; }
  }
  return powToScore(f.pow);
}
// normal-ish noise: nobody writes the same every night
const jitter=sd=>((Math.random()+Math.random()+Math.random()-1.5)/1.5)*sd;

/* Simulated odds are a straight coin flip, with one adjustment: a fighter
   with a high win count is harder, and takes 10 percentage points off you.
   "High win count" is the league's top quartile, recomputed each time so it
   keeps meaning something as records grow through the background card. */
/* ---------------- skill ---------------- */
/* A record is evidence of skill, not skill itself, and how much evidence it
   carries depends on how many battles produced it. So each record is shrunk
   toward even by a fixed number of phantom bouts before it is compared:
   a 10-2 run is excellent but thin, a 24-9 run is slightly worse per battle
   and far better established, and the two come out level - which is why a
   matchup like that is a genuine coin flip rather than an upset when the
   veteran takes it. Without this a 3-0 fighter would read as unbeatable. */
const PRIOR_BOUTS=12;          // phantom bouts, at even odds
const SKILL_SPREAD=3.6;        // how sharply a skill gap turns into odds
const FLOOR=0.15, CEILING=0.85; // nobody is ever a lock, in either direction

const bouts=r=>(r.w||0)+(r.l||0)+(r.d||0);
const winPct=r=>bouts(r)?r.w/bouts(r):0;

function skillOf(r){
  const w=r.w||0, l=r.l||0, d=r.d||0;
  return (w + d*0.5 + PRIOR_BOUTS*0.5) / (w+l+d+PRIOR_BOUTS);
}

/* Odds come from the skill gap on a logistic curve, so a small edge is a
   small edge and a large one still leaves room for an upset. */
function oddsFor(opp){
  const mine=skillOf(RECORDS.user), theirs=skillOf(opp);
  const raw=1/(1+Math.exp(-SKILL_SPREAD*(mine-theirs)));
  return {
    p:clamp(raw,FLOOR,CEILING),
    mine, theirs,
    favoured: mine>theirs,
    gap: mine-theirs
  };
}
const winChance=opp=>oddsFor(opp).p;

/* kept for the ladder display: who the league considers a heavy hitter */
function highWinMark(){
  const wins=RECORDS.league.map(f=>f.w).sort((a,b)=>a-b);
  if(!wins.length) return 12;
  return Math.max(10, wins[Math.floor(wins.length*0.75)]);
}
const isHighWin=(f,mark)=>f.w>=(mark!==undefined?mark:highWinMark());

function simOneMatch(opp){
  // evaluated per battle, because both records move during a run
  const o=oddsFor(opp);
  const res=Math.random()<o.p ? "w" : "l";
  const dec=decisionFor(Math.abs(o.p-0.5)*2);
  creditUser(res,opp.name,"sim",dec);
  creditResult(opp, res==="w"?"l":"w", RECORDS.user.name, "sim", dec);
  return {opp:opp.name, res, chance:o.p, oppRec:recStr(opp), dec,
          mySkill:o.mine, theirSkill:o.theirs, favoured:o.favoured};
}

/* who you face: fighters around your own rank, so simming is a real climb */
function nextChallengers(n){
  const rows=ladder(), me=rows.findIndex(f=>f.you);
  const near=rows.filter((f,i)=>!f.you && Math.abs(i-me)<=9);
  const pool=near.length?near:rows.filter(f=>!f.you);
  const out=[];
  for(let i=0;i<n;i++){
    const pickRow=pool[Math.floor(Math.random()*pool.length)];
    const f=fighterRow(pickRow.name);
    if(f) out.push(f);
  }
  return out;
}

function runSim(n){
  const startRank=myRank(), log=[];
  for(let i=0;i<n;i++){
    const opp=nextChallengers(1)[0];
    if(!opp) break;
    log.push(simOneMatch(opp));
    if(i%3===2) simLeagueNight();          // the rest of the card runs too
  }
  const w=log.filter(r=>r.res==="w").length,
        l=log.filter(r=>r.res==="l").length,
        d=log.filter(r=>r.res==="d").length;
  const endRank=myRank(), move=startRank-endRank;
  post({kind:"press",who:"@SublevelStats",
    text:`${RECORDS.user.name} ran a ${n}-battle stretch: ${w}-${l}${d?"-"+d:""}. ${
      move>0?`Up ${move} to #${endRank}.`:move<0?`Down ${-move} to #${endRank}.`:`Still #${endRank}.`}`});
  if(log.length) chatter({win:w>=l?RECORDS.user.name:log[log.length-1].opp,
    lose:w>=l?log[log.length-1].opp:RECORDS.user.name,
    dec:`${w}-${l} over the stretch`}, 2);
  const bigW=log.filter(r=>r.res==="w");
  if(bigW.length) post({kind:"fan",who:pick(FANS),
    text:pick([`${RECORDS.user.name} been taking everybody. ${bigW[0].opp} was on that list.`,
               `whole run and ${RECORDS.user.name} still standing. respect.`,
               `${RECORDS.user.name} vs ${bigW[bigW.length-1].opp} was not close btw`])});
  if(l>w) post({kind:"fan",who:pick(FANS),
    text:`${RECORDS.user.name} took some losses on that run. the pen needs work, not the schedule.`});
  markFeed(2); saveRecords(RECORDS);
  return {log,w,l,d,startRank,endRank,move};
}

/* ---------------- the round clock ---------------- */
/* Fliptop format: 3:00 a round. Going past it is allowed - the battle does not
   stop - but it is called as OVERTIME and the judges dock for it. */
const ROUND_LIMIT=180;      // seconds per round
const REACTION_TIME=20;     // seconds the crowd gets to react after a verse

function fmtClock(sec){
  sec=Math.max(0,Math.round(sec));
  return Math.floor(sec/60)+":"+String(sec%60).padStart(2,"0");
}
function setClock(sec,label){
  const c=document.getElementById("clock"), w=document.getElementById("clockwrap"),
        l=document.getElementById("clocklab");
  if(!c) return;
  const over=sec>ROUND_LIMIT;
  c.textContent = over ? "+"+fmtClock(sec-ROUND_LIMIT) : fmtClock(ROUND_LIMIT-sec);
  w.className="clockwrap"+(over?" over":sec>ROUND_LIMIT-30?" warn":"");
  if(l) l.textContent = over ? "OVERTIME" : (label||"ON THE CLOCK");
}
function clearClock(){
  const w=document.getElementById("clockwrap");
  if(w){ w.className="clockwrap idle";
    document.getElementById("clock").textContent="3:00";
    document.getElementById("clocklab").textContent="STANDBY"; }
}

/* A live countdown the user races. Returns a handle; elapsed is read on submit. */
function startUserClock(onOvertime){
  const t0=Date.now(); let warned=false;
  const id=setInterval(()=>{
    const el2=Math.floor((Date.now()-t0)/1000);
    setClock(el2,"YOUR TIME");
    if(el2>ROUND_LIMIT&&!warned){ warned=true; onOvertime&&onOvertime(); }
  },250);
  setClock(0,"YOUR TIME");
  return { stop(){ clearInterval(id); return Math.floor((Date.now()-t0)/1000); } };
}

/* The opponent's clock. Their verse plays in ~20s of real time, so the round
   clock is driven by how far through the verse they are rather than by the
   wall clock - that way the displayed time reads like a real 3-minute round
   and lands where the pre-rolled result says it should. */
function makeOpponentClock(goesOvertime){
  const target = goesOvertime
    ? ROUND_LIMIT + 8 + Math.floor(Math.random()*40)   // 3:08 - 3:48
    : 120 + Math.floor(Math.random()*55);              // 2:00 - 2:55
  return {
    target,
    tick(progress){ setClock(target*progress,"OPPONENT"); },
    finish(){ setClock(target,"OPPONENT"); return target; }
  };
}

/* Crowd reaction window: the room gets a fixed stretch to react, on its own
   visible countdown, before the battle moves on. */
async function crowdWindow(container,tier){
  const box=el(`<div class="react">
      <div class="mrow"><span class="tag" style="margin:0">Crowd reaction</span>
        <span class="tag react-t" style="margin:0">0:${String(REACTION_TIME).padStart(2,"0")}</span></div>
      <div class="rtrack"><div class="rfill"></div></div>
      <div class="rpops"></div>
      <div class="bar"><button class="ghost cut">CUT IT SHORT &raquo;</button></div>
    </div>`);
  container.appendChild(box);
  const tEl=box.querySelector(".react-t"), fill=box.querySelector(".rfill"),
        pops=box.querySelector(".rpops"), cut=box.querySelector(".cut");
  let done=false;
  cut.addEventListener("click",()=>{done=true;});
  box.scrollIntoView({behavior:"smooth",block:"center"});

  const t0=Date.now();
  while(!done && !state.skip){
    const el2=(Date.now()-t0)/1000, left=REACTION_TIME-el2;
    if(left<=0) break;
    tEl.textContent="0:"+String(Math.ceil(left)).padStart(2,"0");
    fill.style.width=(100-(left/REACTION_TIME)*100)+"%";
    if(Math.random()<0.055){
      const n=crowdPop(pick(CROWD[tier]),tier);
      pops.appendChild(n);
      while(pops.children.length>3) pops.firstChild.remove();
      bumpHeat(tier==="huge"?3:tier==="dead"?-3:1);
    }
    await new Promise(r=>setTimeout(r,120));
  }
  cut.remove(); tEl.textContent="TIME";
  fill.style.width="100%";
}

/* ---------------- state & pacing ---------------- */
const state={ op:null, first:null, round:0, userVerses:[], userScores:[], opScores:[],
               skip:false, heat:50, userTimes:[], opTimes:[], userOT:[], opOT:[], tape:[] };
const stage=document.getElementById("stage");

function esc(s){return s.replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));}
function el(html){const d=document.createElement("div");d.innerHTML=html;return d.firstElementChild;}
function push(node){stage.appendChild(node);node.scrollIntoView({behavior:"smooth",block:"end"});return node;}
const sleep=ms=>new Promise(r=>setTimeout(r,state.skip?0:ms));

/* the heat meter reacts to every bar and decays between them */
function bumpHeat(delta){
  state.heat=clamp(state.heat+delta,0,100);
  const f=document.getElementById("heatfill"), l=document.getElementById("heatlab");
  if(f){ f.style.width=state.heat+"%";
    f.style.background = state.heat>75?"var(--accent2)" : state.heat>45?"var(--accent)" : "var(--line)"; }
  if(l) l.textContent = state.heat>85?"ROOM IS GONE" : state.heat>70?"CROWD IS LOUD"
      : state.heat>45?"ROOM IS WARM" : state.heat>25?"ROOM IS QUIET" : "CROWD IS DEAD";
}
function crowdPop(text,tier){
  const d=document.createElement("div");
  d.className="pop "+tier; d.textContent=text;
  return d;
}

/* reveal a verse one bar at a time, with the crowd reacting in between */
async function performVerse(container, text, who, clock){
  const L=lines(text);
  const body=container.querySelector(".verse");
  let prev=null, best={h:-1,line:""};
  for(let i=0;i<L.length;i++){
    const line=L[i];
    const bar=document.createElement("div");
    bar.className="bar-line"; bar.textContent=line;
    body.appendChild(bar);
    requestAnimationFrame(()=>bar.classList.add("in"));
    if(!state.skip) bar.scrollIntoView({behavior:"smooth",block:"center"});

    const h=lineHeat(line,prev);
    if(h>best.h) best={h,line};
    bumpHeat((h-0.45)*16);
    if(clock) clock.tick((i+1)/L.length);

    // pause on the bar itself, longer for longer bars
    await sleep(clamp(430+words(line).length*58,520,1700));

    // the crowd only interrupts when a bar earns it, or when it truly dies
    const tier=heatTier(h);
    const speak = tier==="huge" ? 0.95 : tier==="good" ? 0.45 : tier==="dead" ? 0.3 : 0.12;
    if(Math.random()<speak && i<L.length-1){
      body.appendChild(crowdPop(pick(CROWD[tier]),tier));
      await sleep(tier==="huge"?900:520);
    }
    // opponent ad-libs mid-verse
    if(who==="op" && Math.random()<0.13 && i<L.length-1){
      body.appendChild(crowdPop(pick(CROWD.adlib),"adlib"));
      await sleep(420);
    }
    prev=line;
  }
  return best;
}

    renderRanks();                                  // board moved, redraw it
    const o=document.getElementById("simout");
    o.innerHTML=`<div class="hr"></div>
      <div class="tag">Run complete &mdash; ${out.w}-${out.l}${out.d?"-"+out.d:""}</div>
      <div class="rec"><span>Rank: <b>#${out.startRank} &rarr; #${out.endRank}</b></span>
        <span>${out.move>0?`<b style="color:var(--good)">Up ${out.move}</b>`:out.move<0?`<b style="color:var(--bad)">Down ${-out.move}</b>`:"No movement"}</span></div>
      <table style="margin-top:10px">
        <tr><th>Opponent</th><th>Their record</th><th>Skill</th><th>Your odds</th><th>Card</th><th>Result</th></tr>
        ${out.log.map(r=>`<tr><td>${esc(r.opp)}</td>
          <td class="n">${r.oppRec}</td>
          <td class="n">${(r.mySkill*100).toFixed(0)} v ${(r.theirSkill*100).toFixed(0)}</td>
          <td class="n" style="color:${r.favoured?"var(--good)":"var(--dim)"}">${Math.round(r.chance*100)}%</td>
          <td class="n vsub">${r.dec?r.dec.tally:"&mdash;"}</td>
          <td style="color:${r.res==="w"?"var(--good)":"var(--bad)"}">${r.res==="w"?"WIN":"LOSS"}</td></tr>`).join("")}
      </table>
      <div class="crowd">Simulated battles produce no clips &mdash; only verses you actually write get clipped.</div>`;
    o.scrollIntoView({behavior:"smooth",block:"nearest"});
  }));
}
let unseen=0;

function markTV(){ const d=document.getElementById("tvdot"); if(d) d.classList.add("show"); }
function showPanel(id){
  document.querySelectorAll(".panel").forEach(p=>p.classList.toggle("on",p.id===id));
  document.querySelectorAll(".tab").forEach(t=>t.classList.toggle("on",t.dataset.p===id));

}
