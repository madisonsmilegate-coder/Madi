<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Aether Roll</title>
<style>
:root{--bg:#06060b;--panel:#0e0e18;--line:#22223a;--ink:#e8e8f4;--dim:#8a8aa6;
 --gold:#ffc857;--acc:#8b6cff}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);overflow:hidden;
 font-family:ui-monospace,"SF Mono",Menlo,Consolas,monospace;-webkit-font-smoothing:antialiased}
#bg{position:fixed;inset:0;z-index:0}
#app{position:fixed;inset:0;z-index:1;display:flex;flex-direction:column;padding:12px;gap:10px}
.top{display:flex;gap:8px;align-items:stretch;flex-wrap:wrap}
.chip{background:rgba(14,14,24,.85);border:1px solid var(--line);border-radius:10px;
 padding:7px 11px;display:flex;flex-direction:column;gap:1px;min-width:88px}
.chip b{font-size:14px} .chip span{color:var(--dim);font-size:9.5px;letter-spacing:1.3px;
 text-transform:uppercase}
.grow{flex:1}
#biomeName{color:var(--gold);font-size:14px}
.btn{font:inherit;font-size:11.5px;letter-spacing:1px;cursor:pointer;border-radius:10px;
 border:1px solid var(--line);background:rgba(20,20,34,.9);color:var(--ink);padding:8px 13px;
 transition:border-color .15s,transform .08s}
.btn:hover{border-color:#4a4a6e} .btn:active{transform:translateY(1px)}
.btn.on{border-color:var(--acc);color:#cbb8ff;box-shadow:0 0 14px rgba(139,108,255,.3)}

/* ---------- main split ---------- */
.main{flex:1;display:flex;gap:10px;min-height:0}
.left{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;
 gap:6px;min-width:0;min-height:0;overflow:hidden;position:relative}
#show{border-radius:18px;border:1px solid var(--line);background:#04040a;
 max-width:100%;max-height:100%;box-shadow:0 24px 70px rgba(0,0,0,.6)}
#showName{font-size:clamp(18px,2.4vw,28px);font-weight:800;letter-spacing:1px;text-align:center}
#showMeta{font-size:11px;color:var(--dim);letter-spacing:1.6px;text-align:center}
#showFx{font-size:10px;color:var(--acc);letter-spacing:2px;text-transform:uppercase}
.right{width:236px;display:flex;flex-direction:column;gap:6px;overflow:hidden}
.fi{background:rgba(10,10,18,.85);border:1px solid var(--line);border-left-width:3px;
 border-radius:8px;padding:5px 9px;animation:sl .3s ease both}
.fi b{display:block;font-size:11.5px} .fi span{color:var(--dim);font-size:9px;letter-spacing:1px}
@keyframes sl{from{opacity:0;transform:translateX(16px)}}

/* ---------- reel ---------- */
#reelWrap{position:relative;width:100%;height:84px;overflow:hidden;border:1px solid var(--line);
 border-radius:13px;background:rgba(8,8,14,.74);
 -webkit-mask-image:linear-gradient(90deg,transparent,#000 8%,#000 92%,transparent);
 mask-image:linear-gradient(90deg,transparent,#000 8%,#000 92%,transparent)}
#reel{position:absolute;top:0;left:0;height:100%;display:flex;align-items:center;gap:9px;
 will-change:transform}
.tile{width:104px;height:64px;flex:0 0 104px;border-radius:10px;display:flex;flex-direction:column;
 align-items:center;justify-content:center;gap:3px;border:1px solid rgba(255,255,255,.1);
 overflow:hidden;position:relative}
.tile .nm{font-size:10.5px;font-weight:700;text-align:center;padding:0 5px;line-height:1.15;
 text-shadow:0 1px 4px rgba(0,0,0,.95);z-index:1}
.tile .od{font-size:8.5px;color:rgba(255,255,255,.85);z-index:1;text-shadow:0 1px 4px #000}
#needle{position:absolute;left:50%;top:0;bottom:0;width:2px;margin-left:-1px;z-index:3;
 background:linear-gradient(180deg,transparent,var(--gold) 14%,var(--gold) 86%,transparent);
 box-shadow:0 0 16px var(--gold);pointer-events:none}
.bottom{display:flex;flex-direction:column;gap:8px;align-items:center}
#cdBar{width:100%;height:3px;background:rgba(255,255,255,.08);border-radius:99px;overflow:hidden}
#cdBar i{display:block;height:100%;width:0;background:var(--acc)}
.rollRow{display:flex;gap:10px;align-items:center;flex-wrap:wrap;justify-content:center}
#rollBtn{font:inherit;font-size:14px;font-weight:800;letter-spacing:3px;padding:10px 36px;
 border-radius:12px;background:linear-gradient(180deg,#8b6cff,#5a3fd6);border:0;color:#fff;
 cursor:pointer;box-shadow:0 6px 24px rgba(139,108,255,.36)}
#rollBtn:disabled{filter:grayscale(.8) brightness(.6);cursor:default;box-shadow:none}
#fx{display:flex;gap:6px;flex-wrap:wrap;justify-content:center}
.fxp{border:1px solid var(--line);border-radius:99px;padding:2px 10px;font-size:10px;
 letter-spacing:1.1px;color:var(--gold);background:rgba(255,200,87,.08)}

/* ---------- reveal ---------- */
#cut{position:fixed;inset:0;width:100%;height:100%;z-index:34;display:none;
  pointer-events:none}
#cut.show{display:block}
#reveal{position:fixed;inset:0;z-index:30;display:none;align-items:center;justify-content:center;
 flex-direction:column;gap:8px;pointer-events:none}
#reveal.show{display:flex}
#revBack{position:absolute;inset:0;background:radial-gradient(ellipse at 50% 50%,
 rgba(4,4,9,.9),rgba(0,0,0,.99))}
.bar{position:absolute;left:0;right:0;height:0;background:#000;transition:height .45s ease}
.bar.t{top:0}.bar.b{bottom:0}
#reveal.cine .bar{height:12vh}
#revCv{position:relative;border-radius:50%}
#revName{position:relative;font-size:clamp(26px,7vw,66px);font-weight:900;letter-spacing:3px;
 text-align:center;padding:0 14px;line-height:1.05}
#revOdds{position:relative;font-size:clamp(11px,2.2vw,17px);letter-spacing:5px;color:#cfcfe6}
#revTag{position:relative;font-size:10px;letter-spacing:5px;color:var(--gold);text-transform:uppercase}

/* ---------- modal ---------- */
.modal{position:fixed;inset:0;z-index:40;background:rgba(3,3,7,.92);display:none;
 align-items:center;justify-content:center;padding:16px}
.modal.show{display:flex}
.sheet{background:var(--panel);border:1px solid var(--line);border-radius:16px;
 width:min(1080px,100%);max-height:90vh;display:flex;flex-direction:column;overflow:hidden}
.sheetTop{display:flex;align-items:center;gap:10px;padding:13px 18px;border-bottom:1px solid var(--line);
 flex-wrap:wrap}
.sheetTop h2{margin:0;font-size:15px;letter-spacing:2px}
.sheetBody{overflow:auto;padding:14px 18px}
input,select{font:inherit;font-size:12px;background:#14141f;border:1px solid var(--line);
 color:var(--ink);border-radius:8px;padding:7px 10px;outline:none}
input:focus,select:focus{border-color:var(--acc)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(132px,1fr));gap:7px}
.card{border:1px solid var(--line);border-radius:10px;padding:8px;position:relative;overflow:hidden;
 cursor:pointer;min-height:70px;display:flex;flex-direction:column;justify-content:flex-end;gap:2px}
.card.locked{opacity:.26;cursor:default}
.card .cn{font-size:11px;font-weight:700;z-index:1;text-shadow:0 1px 4px #000;line-height:1.15}
.card .co{font-size:8.5px;color:rgba(255,255,255,.8);z-index:1}
.card .cc{position:absolute;top:5px;right:7px;font-size:9px;z-index:1;background:rgba(0,0,0,.5);
 border-radius:99px;padding:0 6px}
.card.eq{outline:2px solid var(--gold);outline-offset:-2px}
.shopRow{display:flex;align-items:center;gap:10px;padding:11px;border:1px solid var(--line);
 border-radius:10px;margin-bottom:8px}
.shopRow .si{flex:1}.shopRow .si b{display:block;font-size:12.5px}
.shopRow .si span{font-size:10px;color:var(--dim)}
/* loadout */
#loadout{display:flex;gap:6px;justify-content:center;flex-wrap:wrap}
.slot{width:46px;height:46px;border-radius:11px;border:1px solid var(--line);
 background:#101019;cursor:pointer;position:relative;display:flex;align-items:center;
 justify-content:center;transition:border-color .15s,transform .08s}
.slot:hover{border-color:#4a4a6e}.slot:active{transform:translateY(1px)}
.slot.p0{border-color:var(--gold)}
.slot .so{width:28px;height:28px;border-radius:50%}
.slot .sl{position:absolute;bottom:-1px;right:2px;font-size:8px;color:var(--dim)}
.slot.locked{opacity:.3;cursor:not-allowed}
#stats{display:flex;gap:9px;flex-wrap:wrap;justify-content:center;font-size:10.5px}
#stats div{border:1px solid var(--line);border-radius:99px;padding:2px 10px;letter-spacing:1px}
#stats b{color:var(--gold)}
#catBan{font-size:10.5px;letter-spacing:1.5px;color:#7cf5c4;min-height:14px}
/* alpha panel */
#alpha{position:fixed;right:12px;top:58px;z-index:45;width:290px;background:#0b0b14;
 border:1px solid #3a2a5e;border-radius:14px;padding:12px;display:none;
 box-shadow:0 18px 50px rgba(0,0,0,.7);max-height:84vh;overflow:auto}
#alpha.show{display:block}
#alpha h3{margin:0 0 8px;font-size:12px;letter-spacing:3px;color:#c9a6ff}
#alpha .ar{display:flex;gap:6px;margin-bottom:6px}
#alpha .btn{flex:1;font-size:10.5px;padding:7px 8px}
#alpha .note{font-size:9.5px;color:var(--dim);line-height:1.5;margin-top:8px}
.btnA{border-color:#5a3fa0;color:#d7c2ff}
@media (max-width:860px){.right{display:none}#show{max-height:34vh}}
</style>
</head>
<body>
<canvas id="bg"></canvas>
<div id="app">
  <div class="top">
    <div class="chip"><span>Rolls</span><b id="sRolls">0</b></div>
    <div class="chip"><span>Luck</span><b id="sLuck">1x</b></div>
    <div class="chip"><span>Shards</span><b id="sShards">0</b></div>
    <div class="chip"><span>Essence</span><b id="sEss">0</b></div>
    <div class="chip"><span>Index</span><b id="sIndex">0/700</b></div>
    <div class="chip grow"><span>Biome &middot; <i id="biomeT">2:00</i></span><b id="biomeName">SERENE</b></div>
    <button class="btn" id="btnIndex">INDEX</button>
    <button class="btn" id="btnShop">POTIONS</button>
    <button class="btn" id="btnAuto">AUTO</button>
    <button class="btn" id="btnFast">FAST</button>
    <button class="btn" id="btnAltar">ALTAR</button>
    <button class="btn" id="btnMute">SOUND</button>
    <button class="btn btnA" id="btnAlpha">ALPHA</button>
  </div>

  <div class="main">
    <div class="left">
      <canvas id="show" width="520" height="340"></canvas>
      <div id="showName">Nothing equipped</div>
      <div id="showMeta">roll to begin</div>
      <div id="showFx"></div>
      <div id="loadout"></div>
      <div id="stats"></div>
      <div id="catBan"></div>
      <div id="fx"></div>
    </div>
    <div class="right" id="feed"></div>
  </div>

  <div class="bottom">
    <div id="reelWrap"><div id="reel"></div><div id="needle"></div></div>
    <div id="cdBar"><i></i></div>
    <div class="rollRow">
      <button id="rollBtn">ROLL</button>
      <div style="font-size:10.5px;color:var(--dim);letter-spacing:1.3px">SPACE ROLL &middot; I INDEX</div>
    </div>
  </div>
</div>

<canvas id="cut"></canvas>
<div id="reveal">
  <div id="revBack"></div><div class="bar t"></div><div class="bar b"></div>
  <div id="revTag"></div><canvas id="revCv" width="260" height="260"></canvas>
  <div id="revName"></div><div id="revOdds"></div>
</div>

<div class="modal" id="mIndex"><div class="sheet">
  <div class="sheetTop"><h2>INDEX</h2>
    <input id="idxQ" placeholder="search name..." style="width:170px">
    <select id="idxF">
      <option value="all">all</option><option value="owned">owned</option>
      <option value="missing">missing</option><option value="biome">biome-locked</option>
    </select>
    <div style="font-size:10.5px;color:var(--dim)" id="idxPct"></div>
    <div class="grow"></div>
    <button class="btn" data-close>CLOSE</button></div>
  <div class="sheetBody"><div class="grid" id="idxGrid"></div>
    <div id="idxMore" style="text-align:center;padding:14px"></div></div>
</div></div>

<div id="alpha">
  <h3>ALPHA TOOLS</h3>
  <div class="ar"><button class="btn btnA" data-a="shards">+10M SHARDS</button>
    <button class="btn btnA" data-a="essence">+1M ESSENCE</button></div>
  <div class="ar"><button class="btn btnA" data-a="luck">LUCK x1,000,000 &middot; 5m</button></div>
  <div class="ar"><button class="btn btnA" data-a="slots">MAX LOADOUT SLOTS</button></div>
  <div class="ar"><button class="btn btnA" data-a="instant">INSTANT ROLLS</button>
    <button class="btn btnA" data-a="unlockall">UNLOCK ALL</button></div>
  <div class="ar"><select id="aBiome" style="flex:1"></select>
    <button class="btn btnA" data-a="biome">SET</button></div>
  <div class="ar"><input id="aGrant" placeholder="grant aura by name" style="flex:1">
    <button class="btn btnA" data-a="grant">GIVE</button></div>
  <div class="ar"><button class="btn btnA" data-a="grantrarest">GRANT ORIGIN (1 in 12.5B)</button></div>
  <div class="ar"><input id="aLuck" placeholder="set luck multiplier" style="flex:1">
    <button class="btn btnA" data-a="setluck">SET</button></div>
  <div class="ar"><input id="aNext" placeholder="force next roll by name" style="flex:1">
    <button class="btn btnA" data-a="forcenext">ARM</button></div>
  <div class="ar"><select id="aCut" style="flex:1"></select>
    <button class="btn btnA" data-a="playcut">PLAY CUTSCENE</button></div>
  <div class="ar"><button class="btn btnA" data-a="allshiny">ALL RADIANT</button>
    <button class="btn btnA" data-a="allpotions">ALL POTIONS</button></div>
  <div class="ar"><button class="btn btnA" data-a="skipcut">TOGGLE CUTSCENES</button>
    <button class="btn btnA" data-a="freeze">FREEZE BIOME</button></div>
  <div class="ar"><button class="btn btnA" data-a="rolls">+10,000 ROLLS</button>
    <button class="btn btnA" data-a="clearlo">CLEAR LOADOUT</button></div>
  <div class="ar"><button class="btn btnA" data-a="wipe">WIPE SAVE</button></div>
  <div class="note">Alpha build. These are debug levers, not progression - they
    bypass the table entirely. PLAY CUTSCENE replays any tier without rolling
    for it.</div>
</div>

<div class="modal" id="mAltar"><div class="sheet">
  <div class="sheetTop"><h2>ALTAR</h2>
    <div style="font-size:12px;color:#7cf5c4" id="altEss"></div>
    <div class="grow"></div><button class="btn" data-close>CLOSE</button></div>
  <div class="sheetBody" id="altarBody"></div>
</div></div>

<div class="modal" id="mShop"><div class="sheet">
  <div class="sheetTop"><h2>POTIONS</h2>
    <div style="font-size:12px;color:var(--gold)" id="shopShards"></div>
    <div class="grow"></div><button class="btn" data-close>CLOSE</button></div>
  <div class="sheetBody" id="shopBody"></div>
</div></div>

<script>
"use strict";
/* ==========================================================================
   AETHER ROLL - 700 auras, rarest 1 in 12,500,000,000.
   The table is generated, not typed: a fixed-seed PRNG builds every name,
   palette, effect and biome lock, so the index is identical on every machine
   and across every reload while still being far larger than anything
   hand-written would be.
   ========================================================================== */
const $=id=>document.getElementById(id);
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const fmt=n=>Math.round(n).toLocaleString("en-US");
const TAU=Math.PI*2;

/* fixed-seed PRNG - the whole catalogue hangs off this */
function mulberry(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);
 t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}

const N_AURAS=700, MAX_ODDS=12.5e9;

const PRE=("Ashen Astral Umbral Lunar Solar Gilded Hollow Verdant Crimson Azure Obsidian Prismatic "+
"Spectral Ancient Frozen Molten Twilight Dawnlit Duskborn Stormbound Searing Silent Shattered "+
"Radiant Withered Eternal Fleeting Abyssal Celestial Ferrous Velvet Opaline Cindered Glacial "+
"Tempest Starlit Voidtouched Emberlit Mirrored Fractured Woven Drowned Blooming Rusted Gleaming "+
"Murmuring Hallowed Profane Weeping Laughing Sleeping Waking Burning Falling Rising Turning "+
"Singing Howling Whispering Breathing Bleeding Dreaming Forgotten Remembered Nameless Endless "+
"Boundless Restless Sunless Moonless Starless Hungering").split(" ");
const CORE=("Ember Tide Gale Quartz Shard Veil Bloom Pulse Mire Halo Thorn Frost Spark Dune Fang "+
"Wisp Rift Coil Prism Drift Crest Vault Husk Loom Brand Gleam Murk Flare Shroud Cascade Echo "+
"Lantern Mantle Omen Relic Sigil Tether Vigil Current Fathom Garnet Ivory Keystone Lattice "+
"Monolith Nimbus Oath Pyre Quill Ripple Spire Tempo Umbra Vector Warden Zenith Cradle Dirge "+
"Effigy Feather Glyph Ingot Juniper Kiln Lumen Marrow Nectar Orbit Plume Quarry Reverie Solstice "+
"Talon Undertow Vesper Wake Zephyr Aegis Bastion Chasm").split(" ");
/* the last 24 are named rather than generated - the endgame should not read
   like the other 676 */
const APEX=["Chronos Unbound","Requiem","Cataclysm","Revelation","Ascension","Transcendence",
 "Oblivion","Paradox","Axiom","Terminus","Genesis","Entropy","Event Horizon","Omega Point",
 "Singularity","Apotheosis","Eschaton","Null Theorem","First Cause","Heat Death","The Last Light",
 "Primordial","Aleph","ORIGIN"];

const FX=["motes","orbit","rain","flame","spark","shard","ring","vortex","beam","glitch","nova",
 "petal","storm","halo","voidfx","bubble","lattice","comet"];
const FX_RARE=["nova","glitch","beam","vortex","lattice","comet","voidfx","storm"];

const BIOME_IDS=["GALE","RIME","STARFALL","HOLLOW","NULL","FRACTURE"];

/* round to 3 significant figures so the ladder reads as deliberate numbers
   rather than 1 in 4,817,223 */
function sig(v){
  if(v<10) return Math.max(2,Math.round(v));
  const m=Math.pow(10,Math.floor(Math.log10(v))-2);
  return Math.round(v/m)*m;
}
/* Palette entries are hex, not hsl(), because several call sites append a
   two-digit alpha to them (gradients, glows, the tile pulse). Appending to
   an hsl() string yields an unparseable colour and throws inside the render
   loop, which takes the whole showcase down with it. */
function hsl(h,s,l){
  h=((h%360)+360)%360; s/=100; l/=100;
  const k=n=>(n+h/30)%12, a=s*Math.min(l,1-l);
  const f=n=>l-a*Math.max(-1,Math.min(k(n)-3,Math.min(9-k(n),1)));
  const hx=v=>Math.round(v*255).toString(16).padStart(2,"0");
  return "#"+hx(f(0))+hx(f(8))+hx(f(4));
}

const AURAS=(()=>{
  const R=mulberry(20261002), out=[], used=new Set();
  let prev=1;
  for(let i=0;i<N_AURAS;i++){
    const t=i/(N_AURAS-1);
    let o=sig(2*Math.pow(MAX_ODDS/2,t));
    if(o<=prev) o=prev+1;                       // keep the ladder strictly rising
    prev=o;
    if(i===N_AURAS-1) o=MAX_ODDS;

    let name;
    if(i>=N_AURAS-APEX.length) name=APEX[i-(N_AURAS-APEX.length)];
    else{
      let guard=0;
      do{ name=PRE[(R()*PRE.length)|0]+" "+CORE[(R()*CORE.length)|0]; guard++; }
      while(used.has(name)&&guard<200);
    }
    used.add(name);

    const h=R()*360, h2=h+(R()*120-60)+(R()<0.3?180:0);
    const lift=Math.min(0.42,t*0.55);            // rarer auras run brighter
    const c=[hsl(h,62+lift*38,54+lift*26), hsl(h2,58+lift*34,22+lift*30)];
    const rb=t>0.78&&R()<0.45;
    const fx=(t>0.6&&R()<0.72)
      ? FX_RARE[(R()*FX_RARE.length)|0]
      : FX[(R()*FX.length)|0];
    const b=(R()<0.14)?BIOME_IDS[(R()*BIOME_IDS.length)|0]:null;
    out.push({id:"a"+i,n:name,o,c,fx,rb,b,i});
  }
  return out;
})();
const BY_ID=Object.fromEntries(AURAS.map(a=>[a.id,a]));
const MAXI=AURAS.length-1;


/* ==========================================================================
   ENTITIES
   An aura is not a colour with particles on it. It is a thing that shows up
   behind you: a ghost that fills the frame, a clock tearing itself apart, a
   serpent coiling through the scene. Each painter draws into a box centred
   on the figure, takes the aura's two colours, and animates off a single
   clock, so any entity can be drawn at any size in the showcase, the index
   or the middle of a cutscene.
   ========================================================================== */
function gear(x,cx,cy,r,teeth,rot,fill,stroke){
  x.save(); x.translate(cx,cy); x.rotate(rot);
  x.beginPath();
  for(let i=0;i<teeth;i++){
    const a0=i/teeth*TAU, a1=(i+0.26)/teeth*TAU, a2=(i+0.5)/teeth*TAU, a3=(i+0.76)/teeth*TAU;
    const ro=r*1.17;
    x.lineTo(Math.cos(a0)*r,Math.sin(a0)*r);
    x.lineTo(Math.cos(a1)*ro,Math.sin(a1)*ro);
    x.lineTo(Math.cos(a2)*ro,Math.sin(a2)*ro);
    x.lineTo(Math.cos(a3)*r,Math.sin(a3)*r);
  }
  x.closePath(); x.fillStyle=fill; x.fill();
  x.strokeStyle=stroke; x.lineWidth=r*0.07; x.stroke();
  x.beginPath(); x.arc(0,0,r*0.34,0,TAU); x.strokeStyle=stroke; x.lineWidth=r*0.1; x.stroke();
  for(let i=0;i<5;i++){                                   // spokes
    const a=i/5*TAU;
    x.beginPath(); x.moveTo(Math.cos(a)*r*0.34,Math.sin(a)*r*0.34);
    x.lineTo(Math.cos(a)*r*0.86,Math.sin(a)*r*0.86); x.lineWidth=r*0.08; x.stroke();
  }
  x.restore();
}
function feather(x,len,wid,col){
  x.beginPath(); x.moveTo(0,0);
  x.quadraticCurveTo(len*0.45,-wid, len,-wid*0.18);
  x.quadraticCurveTo(len*0.45, wid*0.42, 0,0);

}

const ENTITIES={
/* ---- a giant hooded spectre, far taller than you, body fraying to nothing ---- */
ghost(x,W,H,a,t,A){
  const cx=W/2, cy=H*0.46, S=Math.min(W,H)/300, sway=Math.sin(t*0.0009)*10*S;
  x.save(); x.globalAlpha=A*0.9; x.translate(cx+sway,cy);

  x.fillStyle=g;

  x.quadraticCurveTo(-104*S,40*S,-60*S,-60*S); x.closePath(); x.fill();

  x.globalAlpha=A*0.55;

    x.quadraticCurveTo(sgn*108*S,30*S, sgn*44*S,0); x.closePath(); x.fill();
  }
  // hollow eyes
  x.globalAlpha=A*(0.75+Math.sin(t*0.003)*0.25);
  x.fillStyle="#ffffff"; x.shadowColor=a.c[0]; x.shadowBlur=26*S;
  x.beginPath(); x.ellipse(-20*S,-104*S,8*S,13*S,0.2,0,TAU); x.fill();
  x.beginPath(); x.ellipse( 20*S,-104*S,8*S,13*S,-0.2,0,TAU); x.fill();
  x.restore();
},

/* ---- an escapement coming apart: meshed gears and a face with no time left ---- */
clockwork(x,W,H,a,t,A){
  const cx=W/2, cy=H/2, S=Math.min(W,H)/300;
  x.save(); x.globalAlpha=A*0.95; x.translate(cx,cy);

  gear(x,-18*S, 78*S,28*S, 9, t*0.0013, a.c[1], a.c[0]);
  gear(x, 46*S, 92*S,20*S, 8,-t*0.0018, a.c[1], a.c[0]);
  // the dial
  x.globalAlpha=A;
  x.beginPath(); x.arc(0,-6*S,62*S,0,TAU);
  x.fillStyle="rgba(0,0,0,.55)"; x.fill();
  x.strokeStyle=a.c[0]; x.lineWidth=3*S; x.stroke();

    const an=i/12*TAU, r0=i%3?54*S:46*S;

    x.lineTo(Math.cos(an)*60*S,-6*S+Math.sin(an)*60*S);

  x.beginPath(); x.moveTo(0,-6*S); x.lineTo(Math.cos(hr)*30*S,-6*S+Math.sin(hr)*30*S);
  x.lineWidth=5*S; x.stroke();
  x.beginPath(); x.moveTo(0,-6*S); x.lineTo(Math.cos(mn)*48*S,-6*S+Math.sin(mn)*48*S);
  x.lineWidth=3*S; x.stroke();
  x.restore();
},

/* ---- a serpent threading through the frame, scales catching the light ---- */
serpent(x,W,H,a,t,A){
  const S=Math.min(W,H)/300;
  x.save(); x.globalAlpha=A;
  const pts=[];
  for(let i=0;i<=44;i++){
    const u=i/44;
    pts.push([W*0.08+u*W*0.84,
              H/2+Math.sin(u*8.2-t*0.0022)*H*0.26*Math.sin(u*Math.PI)]);
  }
  for(let i=0;i<pts.length-1;i++){
    const u=i/pts.length, w=(3+Math.sin(u*Math.PI)*17)*S;
    x.strokeStyle=i%2?a.c[0]:a.c[1]; x.lineWidth=w; x.lineCap="round";
    x.beginPath(); x.moveTo(pts[i][0],pts[i][1]); x.lineTo(pts[i+1][0],pts[i+1][1]); x.stroke();
  }
  const [hx,hy]=pts[pts.length-1], [px,py]=pts[pts.length-3];
  const an=Math.atan2(hy-py,hx-px);
  x.translate(hx,hy); x.rotate(an);
  x.fillStyle=a.c[0];
  x.beginPath(); x.ellipse(6*S,0,22*S,12*S,0,0,TAU); x.fill();

  x.beginPath(); x.ellipse(10*S,-4*S,3.4*S,2.4*S,0,0,TAU); x.fill();

  x.stroke();

},

/* ---- an eye the size of the sky, which blinks ---- */
eye(x,W,H,a,t,A){
  const cx=W/2, cy=H*0.44, S=Math.min(W,H)/300;
  const blink=Math.max(0,Math.sin(t*0.0007)*14-13);       // mostly open

  x.quadraticCurveTo(0,98*S*open,-140*S,0); x.closePath();

  g.addColorStop(0,"#000"); g.addColorStop(.2,a.c[1]);
  g.addColorStop(.72,a.c[0]); g.addColorStop(1,"#0a0a12");
  x.fillStyle=g; x.fillRect(-150*S,-110*S,300*S,220*S);

    x.beginPath(); x.moveTo(Math.cos(an)*26*S,Math.sin(an)*26*S);

  x.beginPath(); x.ellipse(0,0,24*S+Math.sin(t*0.0016)*5*S,30*S,0,0,TAU); x.fill();

},

/* ---- a world-tree, drawn by recursion ---- */
tree(x,W,H,a,t,A){
  const S=Math.min(W,H)/300;
  x.save(); x.globalAlpha=A; x.translate(W/2,H*0.92);
  const grow=(len,wid,ang,d)=>{
    if(d>6||len<4*S) return;
    const sw=Math.sin(t*0.0008+d*1.3)*0.06;
    x.save(); x.rotate(ang+sw);
    const g=x.createLinearGradient(0,0,0,-len);
    g.addColorStop(0,a.c[1]); g.addColorStop(1,a.c[0]);
    x.strokeStyle=g; x.lineWidth=wid; x.lineCap="round";
    x.beginPath(); x.moveTo(0,0); x.lineTo(0,-len); x.stroke();
    x.translate(0,-len);
    if(d>=4){
      x.globalAlpha=A*0.85; x.fillStyle=a.c[0];
      x.beginPath(); x.arc(0,0,2.6*S+Math.sin(t*0.003+d)*1.1*S,0,TAU); x.fill();
      x.globalAlpha=A;
    }
    grow(len*0.72,wid*0.66,-0.42,d+1);
    grow(len*0.72,wid*0.66, 0.42,d+1);
    if(d<3) grow(len*0.56,wid*0.5,0,d+1);
    x.restore();
  };
  grow(72*S,13*S,0,0);
  x.restore();
},

/* ---- wings, feather by feather ---- */
wings(x,W,H,a,t,A){
  const cx=W/2, cy=H*0.48, S=Math.min(W,H)/300;
  const spread=0.72+Math.sin(t*0.0012)*0.12;
  x.save(); x.globalAlpha=A; x.translate(cx,cy);
  for(const sgn of [-1,1]){
    x.save(); x.scale(sgn,1);
    for(let row=0;row<3;row++){
      const n=8-row, len=(150-row*34)*S, base=-40*S+row*26*S;
      for(let i=0;i<n;i++){
        const f=i/(n-1||1);
        x.save(); x.translate(18*S,base);
        x.rotate(-spread*1.15+f*spread*1.6+Math.sin(t*0.0014+i)*0.03);
        feather(x,len*(0.74+f*0.34),(16-row*3)*S, row?a.c[1]:a.c[0]);
        x.restore();
      }
    }
    x.restore();
  }
  x.restore();
},

/* ---- a crown, hanging unworn ---- */
crown(x,W,H,a,t,A){
  const cx=W/2, cy=H*0.26+Math.sin(t*0.0011)*6, S=Math.min(W,H)/300;
  x.save(); x.globalAlpha=A; x.translate(cx,cy);
  const g=x.createLinearGradient(0,-60*S,0,36*S);
  g.addColorStop(0,a.c[0]); g.addColorStop(1,a.c[1]);
  x.fillStyle=g; x.beginPath();

  x.fillStyle="rgba(0,0,0,.3)"; x.fillRect(-72*S,16*S,144*S,8*S);
  for(const [px,py] of pts.filter((_,i)=>i%2===0)){
    x.globalAlpha=A*(0.7+Math.sin(t*0.004+px)*0.3);

    x.beginPath(); x.arc(px*S,py*S,5*S,0,TAU); x.fill();

},

/* ---- hands coming in from both sides ---- */
hands(x,W,H,a,t,A){
  const S=Math.min(W,H)/300, reach=Math.sin(t*0.001)*14*S;
  x.save(); x.globalAlpha=A;
  for(const sgn of [-1,1]){
    x.save(); x.translate(W/2+sgn*(W*0.42-reach),H*0.52); x.scale(sgn,1);
    const g=x.createLinearGradient(20*S,0,-96*S,0);
    g.addColorStop(0,a.c[0]); g.addColorStop(.55,a.c[1]); g.addColorStop(1,"transparent");
    x.fillStyle=g;
    x.beginPath(); x.ellipse(-22*S,0,44*S,34*S,0,0,TAU); x.fill();   // palm
    x.strokeStyle=a.c[0]; x.lineCap="round";
    // four fingers, each drawn in two tapering joints so they read as fingers
    for(let i=0;i<4;i++){
      const spread=(-0.52+i*0.35)*0.8, L1=(44-Math.abs(i-1.4)*7)*S, L2=L1*0.72;
      const curl=Math.sin(t*0.0013+i*0.6)*0.1;

      x.beginPath(); x.moveTo(14*S,0); x.lineTo(14*S+L1,0); x.stroke();
      x.translate(14*S+L1,0); x.rotate(0.46+curl);
      x.lineWidth=(10.5-i*1)*S;
      x.beginPath(); x.moveTo(0,0); x.lineTo(L2,0); x.stroke();
      x.fillStyle="#fff"; x.globalAlpha=A*0.5;
      x.beginPath(); x.arc(L2,0,(4-i*0.4)*S,0,TAU); x.fill();        // nail glint
      x.globalAlpha=A;

    x.lineWidth=14*S; x.beginPath(); x.moveTo(-14*S,20*S);
    x.quadraticCurveTo(20*S,44*S,48*S,30*S); x.stroke();             // thumb
    x.restore();

},

/* ---- a jellyfish, drifting ---- */
jelly(x,W,H,a,t,A){
  const cx=W/2, cy=H*0.34+Math.sin(t*0.0011)*12, S=Math.min(W,H)/300;
  x.save(); x.globalAlpha=A*0.85; x.translate(cx,cy);

},

/* ---- a phoenix, all wing and tail ---- */
phoenix(x,W,H,a,t,A){
  const cx=W/2, cy=H*0.46, S=Math.min(W,H)/300;
  const flap=Math.sin(t*0.0026);
  x.save(); x.globalAlpha=A; x.translate(cx,cy);
  for(const sgn of [-1,1]){
    x.save(); x.scale(sgn,1); x.rotate(flap*0.2);
    for(let i=0;i<9;i++){
      const f=i/8;
      x.save(); x.translate(10*S,-10*S);
      x.rotate(-1.15+f*1.5+flap*0.12);

      x.restore();
    }
    x.restore();
  }

  x.beginPath(); x.ellipse(0,-34*S,12*S,12*S,0,0,TAU); x.fill();      // head

/* ---- a whale, passing through ---- */
whale(x,W,H,a,t,A){

  g.addColorStop(0,a.c[0]); g.addColorStop(1,a.c[1]);

  x.quadraticCurveTo(120*S,-6*S,118*S,14*S);
  x.quadraticCurveTo(60*S,54*S,-160*S,10*S); x.closePath(); x.fill();

},

/* ---- chains, hanging and swinging ---- */
chains(x,W,H,a,t,A){

  x.save(); x.globalAlpha=A;

    const bx=W*(0.12+c*0.152), sw=Math.sin(t*0.0013+c)*0.12;
    for(let i=0;i<11;i++){
      const y=i*30*S, off=Math.sin(sw)*y*0.42;

      x.beginPath(); x.ellipse(0,0,10*S,17*S,0,0,TAU); x.stroke();
      x.restore();
    }

  x.restore();
},

/* ---- a throne, empty ---- */
throne(x,W,H,a,t,A){

  x.save(); x.globalAlpha=A*0.9; x.translate(cx,H*0.62);
  const g=x.createLinearGradient(0,-210*S,0,70*S);

  x.fillRect(-96*S,-26*S,30*S,86*S); x.fillRect(66*S,-26*S,30*S,86*S);   // arms
  x.fillRect(-96*S,52*S,192*S,20*S);                                      // base

  x.shadowColor=a.c[0]; x.shadowBlur=22*S;
  x.beginPath(); x.arc(0,-188*S,8*S,0,TAU); x.fill();
  x.restore();
},

/* ---- a constellation that draws itself ---- */
constellation(x,W,H,a,t,A){
  const S=Math.min(W,H)/300, cx=W/2, cy=H/2;
  const nodes=[[0,-110],[-34,-62],[34,-62],[-58,0],[58,0],[-30,52],[30,52],
               [0,-16],[-86,-30],[86,-30],[0,112]];
  const links=[[0,1],[0,2],[1,3],[2,4],[1,7],[2,7],[7,5],[7,6],[5,10],[6,10],[3,8],[4,9]];
  const prog=(Math.sin(t*0.0004)*0.5+0.5)*1.25;
  x.save(); x.globalAlpha=A; x.translate(cx,cy);
  x.strokeStyle=a.c[1]; x.lineWidth=1.6*S;
  links.forEach(([i,j],k)=>{
    if(k/links.length>prog) return;
    x.globalAlpha=A*0.6;
    x.beginPath(); x.moveTo(nodes[i][0]*S,nodes[i][1]*S);
    x.lineTo(nodes[j][0]*S,nodes[j][1]*S); x.stroke();
  });
  nodes.forEach(([px,py],i)=>{
    const tw=0.55+Math.abs(Math.sin(t*0.0027+i))*0.45;
    x.globalAlpha=A*tw; x.fillStyle="#fff";
    x.shadowColor=a.c[0]; x.shadowBlur=16*S;
    x.beginPath(); x.arc(px*S,py*S,(i%3?2.6:4.4)*S*tw,0,TAU); x.fill();
  });
  x.restore();
},

/* ---- a cracked mask ---- */
mask(x,W,H,a,t,A){

  x.save(); x.globalAlpha=A; x.translate(cx,cy); x.rotate(Math.sin(t*0.0008)*0.06);

  x.beginPath(); x.moveTo(0,-104*S);
  x.quadraticCurveTo(76*S,-86*S,70*S,10*S);
  x.quadraticCurveTo(62*S,96*S,0,112*S);
  x.quadraticCurveTo(-62*S,96*S,-70*S,10*S);
  x.quadraticCurveTo(-76*S,-86*S,0,-104*S); x.closePath(); x.fill();
  x.fillStyle="#05050a";
  x.beginPath(); x.ellipse(-28*S,-16*S,17*S,11*S,-0.2,0,TAU); x.fill();
  x.beginPath(); x.ellipse( 28*S,-16*S,17*S,11*S, 0.2,0,TAU); x.fill();
  x.beginPath(); x.moveTo(-20*S,56*S); x.quadraticCurveTo(0,70*S,20*S,56*S);
  x.quadraticCurveTo(0,62*S,-20*S,56*S); x.fill();
  x.strokeStyle="#05050a"; x.lineWidth=2.6*S;                       // cracks
  x.beginPath(); x.moveTo(14*S,-100*S); x.lineTo(26*S,-50*S); x.lineTo(10*S,-26*S);
  x.lineTo(30*S,22*S); x.lineTo(16*S,78*S); x.stroke();

orrery(x,W,H,a,t,A){

  x.beginPath(); x.arc(0,0,15*S,0,TAU); x.fill(); x.shadowBlur=0;
  for(let i=0;i<5;i++){
    const rr=(44+i*32)*S, tilt=0.28+i*0.1, sp=t*0.0012/(i*0.55+1);
    x.strokeStyle=i%2?a.c[0]:a.c[1]; x.globalAlpha=A*0.42; x.lineWidth=1.6*S;
    x.beginPath(); x.ellipse(0,0,rr,rr*tilt,i*0.4,0,TAU); x.stroke();
    const an=sp+i*2.1;
    const px=Math.cos(an)*rr, py=Math.sin(an)*rr*tilt;
    const rot=i*0.4;
    const fx2=px*Math.cos(rot)-py*Math.sin(rot), fy=px*Math.sin(rot)+py*Math.cos(rot);
    x.globalAlpha=A; x.fillStyle=i%2?a.c[0]:a.c[1];
    x.beginPath(); x.arc(fx2,fy,(5+i*1.6)*S,0,TAU); x.fill();

/* ---- a tear in the world ---- */
rift(x,W,H,a,t,A){
  const cx=W/2, S=Math.min(W,H)/300;
  x.save(); x.globalAlpha=A; 
  const pts=[];
  for(let i=0;i<=16;i++){
    const u=i/16;
    pts.push([cx+Math.sin(u*9+t*0.0012)*26*S*Math.sin(u*Math.PI),
              H*0.06+u*H*0.88]);
  }
  const wide=(k)=>Math.sin(k*Math.PI)*58*S;
  x.beginPath(); x.moveTo(pts[0][0],pts[0][1]);
  for(let i=1;i<pts.length;i++) x.lineTo(pts[i][0]+wide(i/16),pts[i][1]);
  for(let i=pts.length-1;i>=0;i--) x.lineTo(pts[i][0]-wide(i/16),pts[i][1]);
  x.closePath();
  const g=x.createLinearGradient(cx-60*S,0,cx+60*S,0);
  g.addColorStop(0,"transparent"); g.addColorStop(.4,a.c[0]);
  g.addColorStop(.5,"#ffffff"); g.addColorStop(.6,a.c[0]); g.addColorStop(1,"transparent");
  x.fillStyle=g; x.fill();
  x.strokeStyle=a.c[1]; x.lineWidth=3*S; x.globalAlpha=A*0.8; x.stroke();
  for(let i=0;i<26;i++){                                   // shards falling out
    const u=((t*0.0004+i/26)%1);
    const yy=H*0.06+u*H*0.88, xx=cx+Math.sin(u*9+t*0.0012)*26*S+ (((i*53)%100)/50-1)*80*S;
    x.globalAlpha=A*(1-u)*0.8; x.fillStyle=i%2?a.c[0]:"#fff";

},

spider(x,W,H,a,t,A){

},

/* ---- monoliths, turning slowly ---- */
monolith(x,W,H,a,t,A){

seraph(x,W,H,a,t,A){

        x.restore();

      x.restore();

  for(let i=0;i<4;i++){                                    // halo rings

    x.globalAlpha=A*0.85; x.strokeStyle=i%2?a.c[0]:"#fff"; x.lineWidth=3*S;
    x.beginPath(); x.ellipse(0,-76*S,(52-i*7)*S,(18-i*3)*S,an,0,TAU); x.stroke();

  x.globalAlpha=A; x.fillStyle="#fff"; x.shadowColor=a.c[0]; x.shadowBlur=34*S;
  x.beginPath(); x.arc(0,-76*S,15*S,0,TAU); x.fill();
  x.restore();
}

/* ==========================================================================
   WHAT AN AURA IS FOR
   An aura is not just a collectible: equipped into a loadout slot it pays a
   passive, and the size of that passive is a function of how rare it was.
   The effect decides which stat it favours, so two auras of the same rarity
   still pull in different directions and a loadout is a real choice.
   ========================================================================== */
const TRAIT={nova:"luck",beam:"luck",halo:"luck",ring:"luck",
             lattice:"shard",shard:"shard",bubble:"shard",petal:"shard",
             comet:"speed",vortex:"speed",spark:"speed",orbit:"speed",
             voidfx:"biome",glitch:"biome",storm:"biome",motes:"biome",
             flame:"luck",rain:"shard"};
const TRAITCOL={luck:"#ffc857",shard:"#7cf5c4",speed:"#8fd3ff",biome:"#c9a6ff"};
function statsOf(a,shiny){
  const mul=(shiny===undefined?isShiny(a.id):shiny)?2.5:1;
  const p=Math.log10(a.o)*Math.sqrt(mul);                 // 0.30 at 1 in 2, 10.1 at 1 in 12.5B
  const base=p*p*0.9;                      // quadratic: rarity should matter a lot
  const k=TRAIT[a.fx]||"luck";
  return {
    luck : k==="luck" ? base*2.6 : base*0.55,
    shard: k==="shard"? base*3.4 : base*0.8,
    speed: Math.min(70, k==="speed"? base*1.5 : base*0.3),
    biome: k==="biome"? base*1.8 : 0,
    kind : k
  };
}
function loadoutStats(){
  const t={luck:0,shard:0,speed:0,biome:0};
  for(const id of (S.loadout||[])){
    if(!id||!BY_ID[id]) continue;
    const st=statsOf(BY_ID[id],isShiny(id));
    t.luck+=st.luck; t.shard+=st.shard; t.speed+=st.speed; t.biome+=st.biome;
  }
  t.speed=Math.min(80,t.speed);
  return t;
}

/* Luck compounds: potions multiply, and every 500 rolls adds a permanent
   half-multiplier so a long session is never pure stasis. */
function luck(){
  let L=(1+Math.floor(S.rolls/500)*0.5)*(1+Math.min(4,(S.pity||0)/400));
  L*=1+loadoutStats().luck/100;                 // equipped auras pay into luck
  for(const e of S.effects) if(e.luck&&e.until>Date.now()) L*=e.luck;
  return L;
}
const hasted=()=>S.effects.some(e=>e.haste&&e.until>Date.now());
const cooldown=()=>S.instant?0:
  (S.fast?240:BASE_CD)*(hasted()?0.5:1)*(1-loadoutStats().speed/100);
const fmtLuck=L=>L>=1e6?(L/1e6).toFixed(1)+"M":L>=1000?(L/1000).toFixed(1)+"k":L.toFixed(2);

/* ---------------- audio ---------------- */
let AC=null; const ac=()=>AC||(AC=new (window.AudioContext||window.webkitAudioContext)());
function tone(f,dur,type,vol){
  if(S.muted) return;
  try{const a=ac(),t=a.currentTime,o=a.createOscillator(),g=a.createGain();
    o.type=type||"sine";o.frequency.setValueAtTime(f,t);
    g.gain.setValueAtTime(vol||0.05,t);g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
    o.connect(g);g.connect(a.destination);o.start(t);o.stop(t+dur+0.02)}catch(e){}
}
const tick=()=>tone(1150+Math.random()*320,0.025,"square",0.014);
function fanfare(t){
  if(S.muted) return;
  [[523,0],[659,80],[784,160],[1047,250],[1319,350],[1568,460]].slice(0,2+t)
    .forEach(([f,d])=>setTimeout(()=>tone(f,0.5,"triangle",0.07),d));
  if(t>=3) tone(120,1.6,"sawtooth",0.07);
}

/* ======================================================================
   THE AURA RENDERER
   One function draws any aura, so the same code paints the showcase, the
   reveal and the index preview. Particles are stateless where they can be:
   position is a function of time and index, which means an effect can be
   drawn at any size without carrying a simulation around with it.
   ====================================================================== */
function drawAura(ctx,W,H,a,t,scale){
  const cx=W/2, cy=H/2, R=Math.min(W,H)*0.5*(scale||1);
  const hue=t*0.00006;
  const col=k=>{
    if(!a.rb) return a.c[k];
    const base=k?200:40;
    return hsl((hue*360+base)%360,85,k?42:66);
  };
  const c0=col(0), c1=col(1);
  ctx.save();
  switch(a.fx){
    case "motes": for(let i=0;i<46;i++){
        const p=(t*0.00022+i/46)%1, x=cx+Math.sin(i*2.3+t*0.0006)*R*0.62, y=cy+R-p*R*2;
        ctx.globalAlpha=(1-p)*0.85; ctx.fillStyle=i%2?c0:c1;
        ctx.beginPath(); ctx.arc(x,y,2+(i%3),0,TAU); ctx.fill(); } break;
    case "orbit": for(let i=0;i<22;i++){
        const an=t*0.0011+i/22*TAU, rr=R*(0.42+0.3*Math.sin(i+t*0.0007));
        ctx.globalAlpha=.9; ctx.fillStyle=i%2?c0:c1;
        ctx.beginPath(); ctx.arc(cx+Math.cos(an)*rr,cy+Math.sin(an)*rr*0.52,3.2,0,TAU); ctx.fill(); } break;
    case "rain": for(let i=0;i<60;i++){
        const p=(t*0.0009+i*0.137)%1, x=cx+((i*83)%200-100)/100*R, y=cy-R+p*R*2;
        ctx.globalAlpha=.75; ctx.strokeStyle=i%3?c0:c1; ctx.lineWidth=1.6;
        ctx.beginPath(); ctx.moveTo(x,y); ctx.lineTo(x,y+10); ctx.stroke(); } break;
    case "flame": for(let i=0;i<40;i++){
        const p=(t*0.0013+i/40)%1, w=(1-p)*R*0.4;
        const x=cx+Math.sin(i*4+t*0.004)*w*0.6, y=cy+R*0.75-p*R*1.5;
        ctx.globalAlpha=(1-p)*0.8; ctx.fillStyle=p<0.4?c0:c1;
        ctx.beginPath(); ctx.arc(x,y,(1-p)*9+2,0,TAU); ctx.fill(); } break;
    case "spark": ctx.lineWidth=1.8;
      for(let i=0;i<9;i++){ const an=i/9*TAU+t*0.0004;
        ctx.globalAlpha=.3+Math.abs(Math.sin(t*0.006+i))*0.7; ctx.strokeStyle=i%2?c0:c1;
        ctx.beginPath(); ctx.moveTo(cx,cy);
        let x=cx,y=cy; for(let k=0;k<5;k++){ const r2=R*(k+1)/5;
          x=cx+Math.cos(an+Math.sin(k+t*0.002)*0.4)*r2;
          y=cy+Math.sin(an+Math.sin(k+t*0.002)*0.4)*r2; ctx.lineTo(x,y);} ctx.stroke(); } break;
    case "shard": for(let i=0;i<16;i++){
        const an=t*0.0006+i/16*TAU, rr=R*0.6;
        const x=cx+Math.cos(an)*rr, y=cy+Math.sin(an)*rr*0.6;
        ctx.save(); ctx.translate(x,y); ctx.rotate(an*2);
        ctx.globalAlpha=.9; ctx.fillStyle=i%2?c0:c1;
        ctx.beginPath(); ctx.moveTo(0,-11); ctx.lineTo(5,0); ctx.lineTo(0,11); ctx.lineTo(-5,0);
        ctx.closePath(); ctx.fill(); ctx.restore(); } break;
    case "ring": for(let i=0;i<5;i++){
        const p=((t*0.0007+i/5)%1);
        ctx.globalAlpha=(1-p)*0.75; ctx.strokeStyle=i%2?c0:c1; ctx.lineWidth=3-(p*2.4);
        ctx.beginPath(); ctx.ellipse(cx,cy,p*R*1.1,p*R*0.55,0,0,TAU); ctx.stroke(); } break;
    case "vortex": for(let i=0;i<80;i++){
        const p=((t*0.0008+i/80)%1), an=p*TAU*3+i, rr=(1-p)*R;
        ctx.globalAlpha=p*0.8; ctx.fillStyle=i%2?c0:c1;
        ctx.beginPath(); ctx.arc(cx+Math.cos(an)*rr,cy+Math.sin(an)*rr*0.6,2.2,0,TAU); ctx.fill(); } break;
    case "beam": for(let i=0;i<12;i++){
        const an=i/12*TAU+t*0.0003, len=R*(0.7+0.3*Math.sin(t*0.002+i));
        const g=ctx.createLinearGradient(cx,cy,cx+Math.cos(an)*len,cy+Math.sin(an)*len);
        g.addColorStop(0,c0); g.addColorStop(1,"transparent");
        ctx.globalAlpha=.6; ctx.strokeStyle=g; ctx.lineWidth=4;
        ctx.beginPath(); ctx.moveTo(cx,cy); ctx.lineTo(cx+Math.cos(an)*len,cy+Math.sin(an)*len);
        ctx.stroke(); } break;
    case "glitch": for(let i=0;i<34;i++){
        const y=cy-R+((i*37+((t*0.05)|0))%(R*2));
        const w=10+((i*53)%90), x=cx-w/2+Math.sin(i+t*0.01)*R*0.5;
        ctx.globalAlpha=.55; ctx.fillStyle=i%3===0?c0:(i%3===1?c1:"#fff");
        ctx.fillRect(x,y,w,3+(i%4)); } break;
    case "nova": { const p=(t*0.0006)%1;
        const g=ctx.createRadialGradient(cx,cy,0,cx,cy,R*(0.3+p));
        g.addColorStop(0,c0); g.addColorStop(0.5,c1); g.addColorStop(1,"transparent");
        ctx.globalAlpha=1-p*0.85; ctx.fillStyle=g;
        ctx.beginPath(); ctx.arc(cx,cy,R*(0.3+p),0,TAU); ctx.fill();
        for(let i=0;i<26;i++){ const an=i/26*TAU;
          ctx.globalAlpha=(1-p)*0.9; ctx.fillStyle=c0;
          ctx.beginPath(); ctx.arc(cx+Math.cos(an)*R*p*1.2,cy+Math.sin(an)*R*p*1.2,3,0,TAU);
          ctx.fill(); } } break;
    case "petal": for(let i=0;i<34;i++){
        const p=(t*0.00018+i/34)%1, x=cx+Math.sin(i*3+t*0.0009)*R*0.7, y=cy-R+p*R*2;
        ctx.save(); ctx.translate(x,y); ctx.rotate(t*0.001+i);
        ctx.globalAlpha=.8; ctx.fillStyle=i%2?c0:c1;
        ctx.beginPath(); ctx.ellipse(0,0,6,3,0,0,TAU); ctx.fill(); ctx.restore(); } break;
    case "storm": { ctx.globalAlpha=.3; ctx.fillStyle=c1;
        for(let i=0;i<5;i++){ ctx.beginPath();
          ctx.ellipse(cx+Math.sin(i+t*0.0004)*R*0.5,cy-R*0.55,R*0.42,R*0.13,0,0,TAU); ctx.fill(); }
        if(Math.sin(t*0.004)>0.93){ ctx.globalAlpha=.95; ctx.strokeStyle=c0; ctx.lineWidth=2.4;
          ctx.beginPath(); let x=cx+Math.sin(t)*R*0.4,y=cy-R*0.4; ctx.moveTo(x,y);
          for(let k=0;k<5;k++){ x+=Math.sin(k*9+t)*16; y+=R*0.2; ctx.lineTo(x,y);} ctx.stroke(); }
        for(let i=0;i<30;i++){ const p=(t*0.0012+i*0.21)%1;
          ctx.globalAlpha=.5; ctx.strokeStyle=c1; ctx.lineWidth=1.3; ctx.beginPath();
          const x2=cx+((i*61)%180-90)/90*R, y2=cy-R*0.3+p*R*1.5;
          ctx.moveTo(x2,y2); ctx.lineTo(x2-3,y2+9); ctx.stroke(); } } break;
    case "halo": for(let i=0;i<3;i++){
        const an=t*0.0009*(i%2?1:-1)+i;
        ctx.globalAlpha=.8; ctx.strokeStyle=i%2?c0:c1; ctx.lineWidth=3;
        ctx.beginPath(); ctx.ellipse(cx,cy,R*(0.55+i*0.14),R*0.2,an,0,TAU); ctx.stroke(); } break;
    case "voidfx": { const g=ctx.createRadialGradient(cx,cy,R*0.1,cx,cy,R*0.9);
        g.addColorStop(0,"#000"); g.addColorStop(0.65,c1); g.addColorStop(1,"transparent");
        ctx.globalAlpha=.95; ctx.fillStyle=g;
        ctx.beginPath(); ctx.arc(cx,cy,R*0.9,0,TAU); ctx.fill();
        for(let i=0;i<40;i++){ const p=1-((t*0.0009+i/40)%1), an=i/40*TAU+t*0.0009;
          ctx.globalAlpha=(1-p)*0.9; ctx.fillStyle=c0;
          ctx.beginPath(); ctx.arc(cx+Math.cos(an)*R*p,cy+Math.sin(an)*R*p,2.4,0,TAU); ctx.fill(); } } break;
    case "bubble": for(let i=0;i<30;i++){
        const p=(t*0.0004+i/30)%1, x=cx+Math.sin(i*5+t*0.0008)*R*0.6, y=cy+R-p*R*2;
        ctx.globalAlpha=(1-p)*0.7; ctx.strokeStyle=i%2?c0:c1; ctx.lineWidth=1.6;
        ctx.beginPath(); ctx.arc(x,y,4+(i%5)*2.5,0,TAU); ctx.stroke(); } break;
    case "lattice": { ctx.globalAlpha=.55; ctx.lineWidth=1.4;
        for(let i=0;i<14;i++){ const an=i/14*TAU+t*0.0004;
          ctx.strokeStyle=i%2?c0:c1; ctx.beginPath();
          for(let k=0;k<=14;k++){ const a2=k/14*TAU;
            const rr=R*(0.55+0.18*Math.sin(a2*3+t*0.0015+i));
            const x=cx+Math.cos(a2)*rr*Math.cos(an), y=cy+Math.sin(a2)*rr*0.75;
            k?ctx.lineTo(x,y):ctx.moveTo(x,y); } ctx.closePath(); ctx.stroke(); } } break;
    case "comet": for(let i=0;i<16;i++){
        const p=(t*0.0011+i/16)%1, an=i*2.1;
        const x=cx+Math.cos(an)*R*(1-p)*1.2, y=cy+Math.sin(an)*R*(1-p)*0.8;
        const g=ctx.createLinearGradient(x,y,cx,cy);
        g.addColorStop(0,c0); g.addColorStop(1,"transparent");
        ctx.globalAlpha=.85; ctx.strokeStyle=g; ctx.lineWidth=3;
        ctx.beginPath(); ctx.moveTo(x,y); ctx.lineTo(cx+(x-cx)*0.55,cy+(y-cy)*0.55); ctx.stroke();
        ctx.fillStyle=c0; ctx.beginPath(); ctx.arc(x,y,2.6,0,TAU); ctx.fill(); } break;
  }
  ctx.restore();
}
/* The figure the aura plays around. It is lit by the aura rather than drawn
   flat, so the colour reads as something being worn instead of a sprite with
   particles pasted over it. */
function drawFigure(ctx,W,H,a,t){
  const cx=W/2, s=Math.min(W,H)/340;
  const float=Math.sin(t*0.0012)*4;
  ctx.save(); ctx.translate(cx,H/2+H*0.10+float); ctx.scale(s,s);

  // contact shadow, so the figure sits on something
  ctx.globalAlpha=.5; ctx.fillStyle="#000";
  ctx.beginPath(); ctx.ellipse(0,110,46,9,0,0,TAU); ctx.fill(); ctx.globalAlpha=1;

  const body=ctx.createLinearGradient(0,-120,0,112);
  body.addColorStop(0,"#34344a"); body.addColorStop(.55,"#1c1c28"); body.addColorStop(1,"#0c0c12");
  ctx.fillStyle=body;
  ctx.beginPath();
  ctx.moveTo(-20,-66); ctx.quadraticCurveTo(-54,-4,-45,106);
  ctx.quadraticCurveTo(-22,113,0,112); ctx.quadraticCurveTo(22,113,45,106);
  ctx.quadraticCurveTo(54,-4,20,-66); ctx.closePath(); ctx.fill();
  ctx.beginPath(); ctx.ellipse(0,-92,25,28,0,0,TAU); ctx.fill();          // hood
  // hood opening
  ctx.fillStyle="#07070c";
  ctx.beginPath(); ctx.ellipse(0,-88,16,19,0,0,TAU); ctx.fill();

  if(a){
    const c0=a.c[0];
    // rim light down the left edge, keyed to the aura
    ctx.save(); ctx.globalCompositeOperation="lighter";
    const rim=ctx.createLinearGradient(-54,0,-16,0);
    rim.addColorStop(0,c0+"00"); rim.addColorStop(1,c0+"90");
    ctx.fillStyle=rim;
    ctx.beginPath();
    ctx.moveTo(-20,-66); ctx.quadraticCurveTo(-54,-4,-45,106);
    ctx.lineTo(-30,106); ctx.quadraticCurveTo(-38,-4,-12,-66); ctx.closePath(); ctx.fill();
    ctx.globalAlpha=.55;
    ctx.beginPath(); ctx.ellipse(-9,-94,20,24,0,0,TAU); ctx.fill();
    ctx.restore();
    // eyes
    ctx.globalAlpha=.75+Math.sin(t*0.004)*0.22; ctx.fillStyle=c0;
    ctx.shadowColor=c0; ctx.shadowBlur=14;
    ctx.beginPath(); ctx.ellipse(-7,-90,3.6,5,0,0,TAU); ctx.fill();
    ctx.beginPath(); ctx.ellipse(7,-90,3.6,5,0,0,TAU); ctx.fill();
    ctx.shadowBlur=0; ctx.globalAlpha=1;
  }
  ctx.restore();
}

/* Extras that only the deep end of the table gets, so a 1 in 10,000,000,000
   is visibly a different class of thing and not just a different hue. */
function rarityExtras(ctx,W,H,a,t,tier){
  const cx=W/2, cy=H/2, R=Math.min(W,H)*0.5, c0=a.c[0], c1=a.c[1];
  ctx.save(); ctx.globalCompositeOperation="lighter";
  if(tier>=3){                                   // slow rune ring on the ground
    ctx.globalAlpha=.5; ctx.strokeStyle=c0; ctx.lineWidth=1.4;
    for(let k=0;k<2;k++){
      const rr=R*(0.74+k*0.1), an=t*0.0004*(k?-1:1);
      ctx.beginPath(); ctx.ellipse(cx,cy+H*0.26,rr,rr*0.19,0,0,TAU); ctx.stroke();
      for(let i=0;i<12;i++){
        const p=an+i/12*TAU;
        const x=cx+Math.cos(p)*rr, y=cy+H*0.26+Math.sin(p)*rr*0.19;
        ctx.fillStyle=i%2?c0:c1;
        ctx.fillRect(x-1.6,y-1.6,3.2,3.2);
      }
    }
  }
  if(tier>=4){                                   // anamorphic flare
    ctx.globalAlpha=.35+Math.sin(t*0.002)*0.12;
    const g=ctx.createLinearGradient(cx-R,cy,cx+R,cy);
    g.addColorStop(0,"transparent"); g.addColorStop(.5,c0); g.addColorStop(1,"transparent");
    ctx.fillStyle=g; ctx.fillRect(cx-R,cy-2.2,R*2,4.4);
  }
  if(tier>=5){                                   // god rays for the top of the table
    ctx.globalAlpha=.16;
    for(let i=0;i<14;i++){
      const an=t*0.0002+i/14*TAU;
      const g=ctx.createLinearGradient(cx,cy,cx+Math.cos(an)*R*2,cy+Math.sin(an)*R*2);
      g.addColorStop(0,c0); g.addColorStop(1,"transparent");
      ctx.strokeStyle=g; ctx.lineWidth=18;
      ctx.beginPath(); ctx.moveTo(cx,cy);
      ctx.lineTo(cx+Math.cos(an)*R*2,cy+Math.sin(an)*R*2); ctx.stroke();
    }
  }
  ctx.restore();
}

/* Particles are drawn onto a persistent buffer that fades rather than clears,
   which is what gives every effect motion trails instead of a stroboscope of
   disconnected dots. The buffer is per-canvas so the showcase, the reveal and
   any preview each keep their own. */
const TRAILS=new WeakMap();
function trailFor(ctx,W,H){
  let r=TRAILS.get(ctx);
  if(!r||r.c.width!==W||r.c.height!==H){
    const c=document.createElement("canvas"); c.width=W; c.height=H;
    r={c,x:c.getContext("2d")}; TRAILS.set(ctx,r);
  }
  return r;
}
function paintShowcase(ctx,W,H,a,t){
  ctx.globalCompositeOperation="source-over"; ctx.globalAlpha=1;
  ctx.clearRect(0,0,W,H);
  if(!a){ drawFigure(ctx,W,H,null,t); return; }
  const tier=tierOf(a.o), R=Math.min(W,H);
  // how much atmosphere the pull has earned
  const heavy=tier>=3, mid=tier>=2;

  /* ---- 1. deep field ---- */
  const FR=frames(ctx,W,H,a);
  ctx.drawImage(FR.bg,0,0);

  /* ---- 2. haze, behind everything ---- */
  smoke(ctx,W,H,a,t,0.9, heavy?"spiral":"drift", heavy?12:mid?9:6);

  /* ---- 3. the floor, generic wash plus this aura's own ---- */
  groundPlane(ctx,W,H,a,t,mid?0.8:0.55);
  if(GROUND[a.gnd]) try{ GROUND[a.gnd](ctx,W,H,a,t,mid?0.95:0.6); }catch(e){}

  /* ---- 4. shafts of light ---- */
  if(mid) pillars(ctx,W,H,a,t,heavy?0.6:0.42, heavy?4:3);

  /* ---- 5. the subject ----
     A named apex aura draws its own scene; the rest stage the shared entity
     at their own scale, lift and spin so no two read alike. */
  if(a.sig&&SIGN[a.sig]){
    ctx.save(); ctx.globalCompositeOperation="lighter";
    inFigure(ctx,W,H,g=>{ try{ SIGN[a.sig](g,a,t*a.spin,0.95); }catch(e){} });
    ctx.restore();
  } else {
    const ent=ENTITIES[a.ent];
    if(ent){ ctx.save(); ctx.globalCompositeOperation="lighter";
      const z=a.escale;
      ctx.translate(W/2,H*(0.5+a.elift)); ctx.scale(z,z); ctx.translate(-W/2,-H*0.5);
      try{ ent(ctx,W,H,a,t*a.spin,0.82); }catch(e){} ctx.restore(); }
  }
  /* ---- 5b. what orbits it ---- */
  if(SATS[a.sat]){ ctx.save(); ctx.translate(W/2,H/2);
    ctx.scale(a.satR,a.satR); ctx.translate(-W/2,-H/2);
    try{ SATS[a.sat](ctx,W,H,a,t*a.spin,1); }catch(e){} ctx.restore(); }
  if(a.sat2&&SATS[a.sat2]){ ctx.save(); ctx.translate(W/2,H/2);
    ctx.scale(a.satR*1.42,a.satR*1.42); ctx.translate(-W/2,-H/2);
    try{ SATS[a.sat2](ctx,W,H,a,-t*a.spin*0.7,0.75); }catch(e){} ctx.restore(); }

  /* ---- 6. particle effect, on its fading trail layer ---- */
  const tr=trailFor(ctx,W,H);
  tr.x.globalCompositeOperation="destination-out";
  tr.x.globalAlpha=1; tr.x.fillStyle="rgba(0,0,0,"+(heavy?0.10:0.16)+")";
  tr.x.fillRect(0,0,W,H);
  tr.x.globalCompositeOperation="lighter";
  tr.x.globalAlpha=.62; drawAura(tr.x,W,H,a,t,0.95); tr.x.globalAlpha=1;

  /* bloom: the trail resampled small and drawn back large, offset slightly on
     each pass so the edges fringe the way a real lens fringes */
  const bw=Math.max(8,W>>2), bh=Math.max(8,H>>2);
  if(!paintShowcase.b||paintShowcase.b.width!==bw||paintShowcase.b.height!==bh){
    paintShowcase.b=document.createElement("canvas");
    paintShowcase.b.width=bw; paintShowcase.b.height=bh;
    paintShowcase.bx=paintShowcase.b.getContext("2d");
  }
  paintShowcase.bx.clearRect(0,0,bw,bh);
  paintShowcase.bx.drawImage(tr.c,0,0,bw,bh);
  ctx.globalCompositeOperation="lighter";
  const ca=heavy?2.4:1.4;
  ctx.globalAlpha=.26; ctx.drawImage(paintShowcase.b,-ca,0,W,H);
  ctx.globalAlpha=.30; ctx.drawImage(paintShowcase.b, ca,0,W,H);
  ctx.globalAlpha=.52; ctx.drawImage(tr.c,0,0);
  ctx.globalAlpha=1;
  ctx.globalCompositeOperation="source-over";

  /* ---- 7. the figure, what it holds, what hangs over it ---- */
  drawFigure(ctx,W,H,a,t);
  if(a.wld&&WIELD[a.wld]){ ctx.save();
    try{ WIELD[a.wld](ctx,W,H,a,t,0.95); }catch(e){} ctx.restore(); }
  if(a.ovr&&OVER[a.ovr]){ ctx.save();
    try{ OVER[a.ovr](ctx,W,H,a,t,0.95); }catch(e){} ctx.restore(); }

  /* ---- 8. what is in front: debris, a pass of the effect, the lens ---- */
  ctx.globalCompositeOperation="lighter";
  ctx.globalAlpha=.24; ctx.drawImage(tr.c,0,0); ctx.globalAlpha=1;
  ctx.globalCompositeOperation="source-over";
  shards(ctx,W,H,a,t,mid?0.9:0.55, heavy?18:mid?12:8);
  if(heavy) anamorphic(ctx,W,H,a,t,0.8);

  if(isShiny(a.id)){                                   // Radiant: gold dust
    ctx.globalCompositeOperation="lighter";
    for(let i=0;i<40;i++){
      const an=i*2.399+t*0.0006, rr=R*0.5*(0.22+((i*53)%100)/100*0.86);
      const tw=Math.abs(Math.sin(t*0.005+i*1.3));
      ctx.globalAlpha=tw*0.9; ctx.fillStyle=i%2?"#ffe9a8":"#fff6d8";
      const sx=W/2+Math.cos(an)*rr, sy=H/2+Math.sin(an)*rr*0.8, sz=1+tw*3.4;
      ctx.fillRect(sx-sz/2,sy-0.5,sz,1); ctx.fillRect(sx-0.5,sy-sz/2,1,sz);
    }
    ctx.globalAlpha=1; ctx.globalCompositeOperation="source-over";
  }

  /* ---- 9. the lens is not clean ---- */
  ctx.drawImage(FR.vig,0,0);
}
/* Static per aura and per size, so they are rendered once and blitted. */
const FRAMES={key:null,bg:null,vig:null};
function frames(ctx,W,H,a){
  const key=a.id+"|"+W+"x"+H;
  if(FRAMES.key===key) return FRAMES;
  const R=Math.min(W,H);
  const mk=paint=>{ const c=document.createElement("canvas");
    c.width=W; c.height=H; paint(c.getContext("2d")); return c; };
  FRAMES.bg=mk(g=>{
    const r=g.createRadialGradient(W/2,H*0.44,0,W/2,H*0.44,R*0.82);
    r.addColorStop(0,a.c[1]+"3a"); r.addColorStop(0.5,a.c[1]+"14");
    r.addColorStop(1,"transparent");
    g.fillStyle=r; g.fillRect(0,0,W,H);
  });
  FRAMES.vig=mk(g=>{
    const r=g.createRadialGradient(W/2,H/2,R*0.26,W/2,H/2,R*0.76);
    r.addColorStop(0,"transparent"); r.addColorStop(1,"rgba(2,2,6,.86)");
    g.fillStyle=r; g.fillRect(0,0,W,H);
  });
  FRAMES.key=key; return FRAMES;
}



/* ==========================================================================
   SIGNATURES
   The 24 auras at the top of the table are named rather than generated, and
   a name like "Heat Death" or "Paradox" deserves a scene built for it rather
   than a dice roll over the same component library. Each of these replaces
   the subject and satellite slots entirely with a composition about what the
   name means. Drawn in the figure's local space like everything else.
   ========================================================================== */
const SIGN={

"ORIGIN"(g,a,t,A){                      // the first light, and geometry following it
  const c0=a.c[0];
  g.globalAlpha=A;
  for(let r=0;r<5;r++){
    const ph=((t*0.00032+r/5)%1), e=1-Math.pow(1-ph,2);
    g.globalAlpha=A*(1-ph)*0.8; g.strokeStyle=r%2?c0:"#ffffff"; g.lineWidth=2.4;
    g.beginPath();
    const n=3+r;                        // each ring resolves into more sides
    for(let i=0;i<=n;i++){ const an=i/n*TAU+t*0.0004*(r%2?1:-1), rr=e*210;
      i?g.lineTo(Math.cos(an)*rr,-70+Math.sin(an)*rr*0.6)
       :g.moveTo(Math.cos(an)*rr,-70+Math.sin(an)*rr*0.6); }
    g.closePath(); g.stroke();
  }
  const cg=g.createRadialGradient(0,-70,0,0,-70,46);
  cg.addColorStop(0,"#ffffff"); cg.addColorStop(.3,c0); cg.addColorStop(1,c0+"00");
  g.globalAlpha=A; g.fillStyle=cg;
  g.beginPath(); g.arc(0,-70,46,0,TAU); g.fill();
},

"Aleph"(g,a,t,A){                       // infinities nested inside infinities
  const c0=a.c[0], c1=a.c[1];
  g.globalAlpha=A; g.lineCap="round";
  for(let d=0;d<5;d++){
    const sc=Math.pow(0.62,d), sp=t*0.0006*(d%2?-1:1);
    g.save(); g.translate(0,-70); g.rotate(sp); g.scale(sc,sc);
    g.strokeStyle=d%2?c0:c1; g.lineWidth=7/sc*0.6; g.globalAlpha=A*(1-d*0.13);
    g.beginPath();                      // lemniscate
    for(let i=0;i<=64;i++){
      const u=i/64*TAU, k=170/(1+Math.sin(u)*Math.sin(u));
      const px=k*Math.cos(u), py=k*Math.sin(u)*Math.cos(u);
      i?g.lineTo(px,py):g.moveTo(px,py);
    }
    g.stroke(); g.restore();
  }
  g.globalAlpha=A; g.fillStyle="#ffffff";
  g.beginPath(); g.arc(0,-70,6,0,TAU); g.fill();
},

"Heat Death"(g,a,t,A){                  // nothing left warm enough to shine
  g.globalAlpha=A*0.8;
  for(let i=0;i<60;i++){
    const u=((t*0.00004+i/60)%1);
    const an=i*2.399, rr=40+u*260;
    const px=Math.cos(an)*rr, py=-70+Math.sin(an)*rr*0.62;
    const heat=Math.max(0,1-u*1.5);
    g.globalAlpha=A*heat*0.75;
    g.fillStyle=heat>0.55?a.c[0]:(heat>0.25?a.c[1]:"#3a3a44");
    g.beginPath(); g.arc(px,py,1.4+heat*2.6,0,TAU); g.fill();
  }
  g.globalAlpha=A*0.35; g.strokeStyle="#4a4a56"; g.lineWidth=1.2;
  g.beginPath(); g.arc(0,-70,230,0,TAU); g.stroke();
},

"The Last Light"(g,a,t,A){              // one flame, and everything else dark
  const c0=a.c[0];
  const fl=1+Math.sin(t*0.009)*0.08+Math.sin(t*0.021)*0.04;
  g.globalAlpha=A; g.fillStyle="#e8e2cf";
  g.fillRect(-9,-54,18,78);             // the candle
  g.fillStyle="#cfc7ae"; g.fillRect(-9,-54,18,5);
  g.strokeStyle="#6a6354"; g.lineWidth=2;
  g.beginPath(); g.moveTo(0,-54); g.lineTo(0,-66); g.stroke();
  const fg=g.createRadialGradient(0,-82,0,0,-82,34*fl);
  fg.addColorStop(0,"#ffffff"); fg.addColorStop(.25,"#ffe9a8");
  fg.addColorStop(.6,c0); fg.addColorStop(1,c0+"00");
  g.fillStyle=fg;
  g.beginPath(); g.ellipse(0,-82,17*fl,32*fl,0,0,TAU); g.fill();
  const hg=g.createRadialGradient(0,-80,0,0,-80,210);
  hg.addColorStop(0,c0+"44"); hg.addColorStop(1,c0+"00");
  g.fillStyle=hg; g.beginPath(); g.arc(0,-80,210,0,TAU); g.fill();
},

"First Cause"(g,a,t,A){                 // a hand lets go, and it never stops
  const c0=a.c[0];
  g.globalAlpha=A*0.85; g.fillStyle=a.c[1];
  g.save(); g.translate(-120,-150); g.rotate(0.5);
  g.beginPath(); g.ellipse(0,0,44,30,0,0,TAU); g.fill();
  g.strokeStyle=a.c[1]; g.lineWidth=11; g.lineCap="round";
  for(let i=0;i<4;i++){ g.save(); g.rotate(-0.4+i*0.3);
    g.beginPath(); g.moveTo(20,0); g.lineTo(76,0); g.stroke(); g.restore(); }
  g.restore();
  for(let r=0;r<7;r++){
    const ph=((t*0.00026+r/7)%1);
    g.globalAlpha=A*(1-ph)*0.8; g.strokeStyle=r%2?c0:"#ffffff";
    g.lineWidth=(1-ph)*3.4+0.6;
    g.beginPath(); g.arc(-56,-96,ph*300,0,TAU); g.stroke();
  }
  g.globalAlpha=A; g.fillStyle="#ffffff";
  g.beginPath(); g.arc(-56,-96,9,0,TAU); g.fill();
},

"Null Theorem"(g,a,t,A){                // statements cancelling themselves out
  const c0=a.c[0];
  for(let i=0;i<16;i++){
    const an=t*0.0003+i/16*TAU, rr=150;
    const px=Math.cos(an)*rr, py=-70+Math.sin(an)*rr*0.5;
    const cancel=Math.abs(Math.sin(t*0.0016+i*0.7));
    g.save(); g.translate(px,py);
    g.globalAlpha=A*(1-cancel*0.85);
    g.fillStyle=i%2?c0:a.c[1]; g.fillRect(-13,-17,26,34);
    g.globalAlpha=A*cancel;
    g.strokeStyle="#ffffff"; g.lineWidth=3;
    g.beginPath(); g.moveTo(-15,-19); g.lineTo(15,19); g.stroke();
    g.restore();
  }
  g.globalAlpha=A*0.9; g.strokeStyle="#ffffff"; g.lineWidth=4;
  g.beginPath(); g.arc(0,-70,52,0,TAU); g.stroke();
  g.beginPath(); g.moveTo(-37,-107); g.lineTo(37,-33); g.stroke();
},

"Eschaton"(g,a,t,A){                    // seals, and the last one giving
  const c0=a.c[0];
  for(let i=0;i<7;i++){
    const an=-Math.PI/2+i/7*TAU, rr=145;
    const px=Math.cos(an)*rr, py=-70+Math.sin(an)*rr*0.62;
    const broken=i<Math.floor(((t*0.0004)%1)*8);
    g.save(); g.translate(px,py); g.rotate(t*0.0005*(i%2?1:-1));
    g.globalAlpha=A*(broken?0.3:1);
    g.strokeStyle=broken?"#5a5a66":c0; g.lineWidth=3.4;
    g.beginPath(); g.arc(0,0,21,0,TAU); g.stroke();
    for(let k=0;k<6;k++){ const b=k/6*TAU;
      g.beginPath(); g.moveTo(Math.cos(b)*8,Math.sin(b)*8);
      g.lineTo(Math.cos(b)*21,Math.sin(b)*21); g.stroke(); }
    if(broken){ g.globalAlpha=A; g.strokeStyle="#ffffff"; g.lineWidth=2;
      g.beginPath(); g.moveTo(-24,-6); g.lineTo(24,8); g.stroke(); }
    g.restore();
  }
},

"Apotheosis"(g,a,t,A){                  // something mortal stops being mortal
  const c0=a.c[0], c1=a.c[1];
  for(let r=0;r<6;r++){
    const u=((t*0.00042+r/6)%1);
    g.globalAlpha=A*(1-u)*0.9; g.strokeStyle=r%2?c0:"#ffffff"; g.lineWidth=3;
    const y=40-u*300, rr=70*(1-u*0.55);
    g.beginPath(); g.ellipse(0,y,rr,rr*0.26,0,0,TAU); g.stroke();
  }
  for(const sgn of [-1,1]){
    g.save(); g.scale(sgn,1); g.translate(26,-110);
    for(let i=0;i<8;i++){ g.save(); g.rotate(-1.1+i*0.2+Math.sin(t*0.0015)*0.05);
      g.globalAlpha=A*0.95; feather(g,78+i*12,10,i%2?c0:c1); g.restore(); }
    g.restore();
  }
  const cg=g.createRadialGradient(0,-120,0,0,-120,56);
  cg.addColorStop(0,"#ffffff"); cg.addColorStop(.4,c0); cg.addColorStop(1,c0+"00");
  g.globalAlpha=A; g.fillStyle=cg;
  g.beginPath(); g.arc(0,-120,56,0,TAU); g.fill();
},

"Singularity"(g,a,t,A){                 // the disc, and what it is falling into
  const c0=a.c[0], c1=a.c[1];
  g.save(); g.translate(0,-80); g.rotate(-0.38);
  for(let i=0;i<110;i++){
    const u=i/110, ph=((t*0.0011+u)%1), rr=40+(1-ph)*170;
    const an=u*TAU*2.2+ph*5+t*0.0013;
    g.globalAlpha=A*(0.2+(1-ph)*0.8);
    g.fillStyle=ph<0.3?"#ffffff":(i%2?c0:c1);
    g.beginPath(); g.arc(Math.cos(an)*rr,Math.sin(an)*rr*0.3,(1-ph)*3.6+0.8,0,TAU); g.fill();
  }
  g.globalAlpha=1; g.fillStyle="#000";
  g.beginPath(); g.arc(0,0,36,0,TAU); g.fill();
  g.globalAlpha=A*0.8; g.strokeStyle=c0; g.lineWidth=2.4;
  g.beginPath(); g.arc(0,0,42,Math.PI*1.05,Math.PI*1.95); g.stroke();
  g.restore();
},

"Event Horizon"(g,a,t,A){               // the line past which nothing returns
  const c0=a.c[0];
  g.globalAlpha=A;
  for(let i=0;i<40;i++){
    const u=((t*0.0005+i/40)%1);
    const sx=(((i*53)%100)/50-1)*240;
    const stretch=Math.pow(u,0.4);
    g.globalAlpha=A*(1-u)*0.9;
    const gr=g.createLinearGradient(sx,-70-stretch*180,sx*0.1,-70);
    gr.addColorStop(0,"transparent"); gr.addColorStop(1,i%3?c0:"#ffffff");
    g.strokeStyle=gr; g.lineWidth=2.2;
    g.beginPath(); g.moveTo(sx,-70-stretch*180); g.lineTo(sx*0.1,-70); g.stroke();
  }
  g.globalAlpha=1; g.fillStyle="#000";
  g.beginPath(); g.ellipse(0,-70,120,30,0,0,TAU); g.fill();
  g.globalAlpha=A; g.strokeStyle="#ffffff"; g.lineWidth=2.6;
  g.beginPath(); g.ellipse(0,-70,120,30,0,0,TAU); g.stroke();
},

"Omega Point"(g,a,t,A){                 // every line, arriving at once
  const c0=a.c[0];
  for(let i=0;i<48;i++){
    const an=i/48*TAU, u=((t*0.0007+i*0.021)%1);
    const r0=300*(1-u);
    g.globalAlpha=A*u*0.9;
    const gr=g.createLinearGradient(Math.cos(an)*r0,-70+Math.sin(an)*r0*0.6,0,-70);
    gr.addColorStop(0,"transparent"); gr.addColorStop(1,i%3?c0:"#ffffff");
    g.strokeStyle=gr; g.lineWidth=1.8;
    g.beginPath(); g.moveTo(Math.cos(an)*r0,-70+Math.sin(an)*r0*0.6); g.lineTo(0,-70); g.stroke();
  }
  const cg=g.createRadialGradient(0,-70,0,0,-70,30+Math.sin(t*0.004)*6);
  cg.addColorStop(0,"#ffffff"); cg.addColorStop(1,c0+"00");
  g.globalAlpha=A; g.fillStyle=cg;
  g.beginPath(); g.arc(0,-70,36,0,TAU); g.fill();
},

"Entropy"(g,a,t,A){                     // a lattice forgetting how to be one
  const c0=a.c[0], c1=a.c[1];
  const N=9;
  for(let i=0;i<N;i++) for(let k=0;k<N;k++){
    const u=(i+k)/(N*2);
    const dis=Math.min(1,Math.max(0,(((t*0.00022)%1.4)-u)*2.4));
    const jx=Math.sin(i*7.1+k*3.3+t*0.002)*dis*52;
    const jy=Math.cos(i*3.7+k*5.9+t*0.0017)*dis*52;
    const px=(i-(N-1)/2)*34+jx, py=-70+(k-(N-1)/2)*26+jy;
    g.globalAlpha=A*(1-dis*0.7);
    g.fillStyle=dis<0.5?c0:c1;
    g.save(); g.translate(px,py); g.rotate(dis*3);
    g.fillRect(-6,-6,12,12); g.restore();
  }
},

"Genesis"(g,a,t,A){                     // light divided from dark, once
  const c0=a.c[0], c1=a.c[1];
  const split=70+Math.sin(t*0.0007)*22;
  g.globalAlpha=A*0.9;
  let gr=g.createLinearGradient(0,-70-split-150,0,-70-split);
  gr.addColorStop(0,"#ffffff"); gr.addColorStop(1,c0+"00");
  g.fillStyle=gr; g.fillRect(-250,-70-split-150,500,150);
  gr=g.createLinearGradient(0,-70+split,0,-70+split+150);
  gr.addColorStop(0,c1+"cc"); gr.addColorStop(1,"transparent");
  g.fillStyle=gr; g.fillRect(-250,-70+split,500,150);
  g.globalAlpha=A; g.strokeStyle="#ffffff"; g.lineWidth=3;
  g.beginPath(); g.moveTo(-230,-70); g.lineTo(230,-70); g.stroke();
  for(let i=0;i<22;i++){
    const u=((t*0.0004+i/22)%1);
    g.globalAlpha=A*(1-Math.abs(u-0.5)*2)*0.9;
    g.fillStyle=i%2?"#ffffff":c0;
    g.beginPath(); g.arc(-220+u*440,-70+Math.sin(i*2.1+t*0.001)*10,2.6,0,TAU); g.fill();
  }
},

"Terminus"(g,a,t,A){                    // a gate, and it is shut
  const c0=a.c[0], c1=a.c[1];
  g.globalAlpha=A;
  const gg=g.createLinearGradient(0,-220,0,60);
  gg.addColorStop(0,c0); gg.addColorStop(1,c1);
  g.fillStyle=gg;
  g.beginPath(); g.moveTo(-95,60); g.lineTo(-95,-130);
  g.quadraticCurveTo(0,-250,95,-130); g.lineTo(95,60); g.closePath(); g.fill();
  g.globalAlpha=A*0.95; g.fillStyle="#05050b";
  g.beginPath(); g.moveTo(-78,60); g.lineTo(-78,-126);
  g.quadraticCurveTo(0,-230,78,-126); g.lineTo(78,60); g.closePath(); g.fill();
  g.globalAlpha=A; g.strokeStyle="#ffffff"; g.lineWidth=2.4;
  g.beginPath(); g.moveTo(0,-224); g.lineTo(0,60); g.stroke();    // the seam
  const lg=g.createLinearGradient(-4,0,4,0);
  lg.addColorStop(0,"transparent"); lg.addColorStop(.5,"#ffffff"); lg.addColorStop(1,"transparent");
  g.globalAlpha=A*(0.5+Math.sin(t*0.0018)*0.5);
  g.fillStyle=lg; g.fillRect(-9,-224,18,284);
},

"Axiom"(g,a,t,A){                       // a construction that needs no proof
  const c0=a.c[0];
  g.globalAlpha=A*0.9; g.strokeStyle=c0; g.lineWidth=1.8;
  const R=150;
  g.beginPath(); g.arc(-R/2,-70,R,0,TAU); g.stroke();
  g.beginPath(); g.arc( R/2,-70,R,0,TAU); g.stroke();
  g.globalAlpha=A; g.strokeStyle="#ffffff"; g.lineWidth=2.6;
  const hy=Math.sqrt(R*R-(R/2)*(R/2));
  g.beginPath(); g.moveTo(-R/2,-70); g.lineTo(R/2,-70);
  g.lineTo(0,-70-hy); g.closePath(); g.stroke();                  // vesica triangle
  g.beginPath(); g.moveTo(0,-70-hy); g.lineTo(0,-70+hy); g.stroke();
  for(const [px,py] of [[-R/2,-70],[R/2,-70],[0,-70-hy],[0,-70+hy]]){
    g.globalAlpha=A*(0.6+Math.sin(t*0.003+px)*0.4);
    g.fillStyle="#ffffff"; g.beginPath(); g.arc(px,py,5,0,TAU); g.fill();
  }
},

"Paradox"(g,a,t,A){                     // a triangle that cannot be built
  const c0=a.c[0], c1=a.c[1];
  g.save(); g.translate(0,-70); g.rotate(t*0.00022);
  const S=70, w=26;
  for(let i=0;i<3;i++){
    g.rotate(TAU/3);
    g.globalAlpha=A;
    g.fillStyle=i%2?c0:c1;
    g.beginPath();
    g.moveTo(-S,S*0.58); g.lineTo(S,S*0.58); g.lineTo(S-w,S*0.58-w);
    g.lineTo(-S+w*0.4,S*0.58-w); g.closePath(); g.fill();
    g.strokeStyle="#ffffff"; g.lineWidth=1.8; g.globalAlpha=A*0.8; g.stroke();
  }
  g.restore();
},

"Infinity"(g,a,t,A){                    // the serpent, still eating
  const c0=a.c[0], c1=a.c[1];
  g.save(); g.translate(0,-70);
  const R=150;
  for(let i=0;i<90;i++){
    const u=i/90, an=u*TAU*0.96-1.2+t*0.00035;
    const w=5+Math.sin(u*Math.PI)*15;
    g.globalAlpha=A; g.strokeStyle=i%2?c0:c1; g.lineWidth=w; g.lineCap="round";
    g.beginPath();
    g.moveTo(Math.cos(an)*R,Math.sin(an)*R*0.62);
    const a2=an+0.02;
    g.lineTo(Math.cos(a2)*R,Math.sin(a2)*R*0.62); g.stroke();
  }
  const ha=-1.2+t*0.00035+TAU*0.96;
  g.translate(Math.cos(ha)*R,Math.sin(ha)*R*0.62); g.rotate(ha+1.6);
  g.fillStyle=c0; g.beginPath(); g.ellipse(0,0,24,14,0,0,TAU); g.fill();
  g.fillStyle="#ffffff"; g.beginPath(); g.arc(6,-4,3.4,0,TAU); g.fill();
  g.restore();
},

"Oblivion"(g,a,t,A){                    // fragments, and then not even those
  const c1=a.c[1];
  for(let i=0;i<34;i++){
    const u=((t*0.00018+i/34)%1);
    const an=i*2.399, rr=50+u*230;
    const px=Math.cos(an)*rr, py=-70+Math.sin(an)*rr*0.6;
    g.globalAlpha=A*Math.max(0,1-u*1.3)*0.85;
    g.save(); g.translate(px,py); g.rotate(an+u*3);
    g.fillStyle=u<0.4?a.c[0]:c1;
    const sz=(1-u)*13+2;
    g.fillRect(-sz/2,-sz/2,sz,sz);
    g.restore();
  }
  const vg=g.createRadialGradient(0,-70,20,0,-70,180);
  vg.addColorStop(0,"#000000"); vg.addColorStop(1,"transparent");
  g.globalAlpha=A*0.9; g.fillStyle=vg;
  g.beginPath(); g.arc(0,-70,180,0,TAU); g.fill();
},

"Transcendence"(g,a,t,A){               // the same shape, rising out of itself
  const c0=a.c[0], c1=a.c[1];
  for(let i=0;i<7;i++){
    const u=((t*0.00035+i/7)%1);
    const y=60-u*300, sc=1-u*0.5;
    g.globalAlpha=A*(1-u)*0.85;
    g.save(); g.translate(0,y); g.scale(sc,sc);
    g.fillStyle=i%2?c0:c1;
    g.beginPath(); g.moveTo(-34,0); g.quadraticCurveTo(-44,-90,0,-110);
    g.quadraticCurveTo(44,-90,34,0); g.closePath(); g.fill();
    g.restore();
  }
},

"Ascension"(g,a,t,A){                   // stairs, going up out of frame
  const c0=a.c[0], c1=a.c[1];
  for(let i=0;i<11;i++){
    const u=((t*0.00024+i/11)%1);
    const y=80-u*320, w=120*(1-u*0.6);
    g.globalAlpha=A*(1-u)*0.9;
    g.fillStyle=i%2?c0:c1;
    g.fillRect(-w/2+Math.sin(i*1.4)*26, y, w, 11);
    g.globalAlpha=A*(1-u)*0.5; g.fillStyle="#ffffff";
    g.fillRect(-w/2+Math.sin(i*1.4)*26, y, w, 2.4);
  }
},

"Revelation"(g,a,t,A){                  // the veil drawn back
  const c0=a.c[0];
  const open=0.3+Math.abs(Math.sin(t*0.0007))*0.7;
  const eg=g.createRadialGradient(0,-80,0,0,-80,120);
  eg.addColorStop(0,"#ffffff"); eg.addColorStop(.3,c0); eg.addColorStop(1,c0+"00");
  g.globalAlpha=A; g.fillStyle=eg;
  g.beginPath(); g.ellipse(0,-80,120,70*open,0,0,TAU); g.fill();
  g.fillStyle="#06060c";
  g.beginPath(); g.ellipse(0,-80,34,34*Math.min(1,open*1.4),0,0,TAU); g.fill();
  for(const sgn of [-1,1]){               // the curtains
    g.globalAlpha=A*0.95; g.fillStyle=a.c[1];
    g.beginPath(); g.moveTo(sgn*250,-230); g.lineTo(sgn*250,90);
    for(let i=6;i>=0;i--){
      const u=i/6;
      g.lineTo(sgn*(110+open*140+Math.sin(t*0.0013+i)*9)*(0.5+u*0.5), 90-u*320);
    }
    g.closePath(); g.fill();
  }
},

"Cataclysm"(g,a,t,A){                   // impact, and the ground remembering it
  const c0=a.c[0], c1=a.c[1];
  for(let i=0;i<13;i++){
    const an=i/13*TAU+0.2, L=110+((i*41)%100)/100*150;
    const pulse=0.5+Math.abs(Math.sin(t*0.0014+i))*0.5;
    g.globalAlpha=A*pulse;
    const gr=g.createLinearGradient(0,30,Math.cos(an)*L,30+Math.sin(an)*L*0.34);
    gr.addColorStop(0,"#ffffff"); gr.addColorStop(.3,c0); gr.addColorStop(1,"transparent");
    g.strokeStyle=gr; g.lineWidth=5; g.lineCap="round";
    g.beginPath(); g.moveTo(0,30);
    for(let k=1;k<=3;k++) g.lineTo(Math.cos(an+Math.sin(k+i)*0.2)*L*k/3,

    g.stroke();
  }
  for(let i=0;i<20;i++){                  // ejecta
    const u=((t*0.0006+i/20)%1), an=i*2.399;
    g.globalAlpha=A*(1-u);
    g.fillStyle=i%2?c0:c1;
    g.save(); g.translate(Math.cos(an)*u*230, 30-Math.sin(Math.PI*u)*180+Math.sin(an)*u*60);
    g.rotate(u*6); g.fillRect(-4,-4,8,8); g.restore();
  }

"Requiem"(g,a,t,A){                     // candles, and what falls on them
  const c0=a.c[0], c1=a.c[1];

    g.globalAlpha=A; g.fillStyle="#ded7c4";
    g.fillRect(px-6,-10-hh,12,hh);
    const fl=1+Math.sin(t*0.008+i*2)*0.12;
    const fg=g.createRadialGradient(px,-20-hh,0,px,-20-hh,22*fl);
    fg.addColorStop(0,"#ffffff"); fg.addColorStop(.3,"#ffe3a0");

    g.fillStyle=fg; g.beginPath(); g.ellipse(px,-20-hh,11*fl,21*fl,0,0,TAU); g.fill();
  }
  for(let i=0;i<22;i++){                  // petals
    const u=((t*0.00016+i/22)%1);
    g.globalAlpha=A*(1-Math.abs(u-0.5)*1.4)*0.9;
    g.save(); g.translate(Math.sin(i*2.3+t*0.0007)*190, -250+u*300);
    g.rotate(t*0.0012+i); g.fillStyle=i%2?c1:c0;
    g.beginPath(); g.ellipse(0,0,7,3.4,0,0,TAU); g.fill(); g.restore();
  }
},

"Chronos Unbound"(g,a,t,A){             // clocks, and none of them agreeing
  const c0=a.c[0], c1=a.c[1];
  for(let i=0;i<5;i++){
    const an=t*0.0004*(i%2?1:-1)+i/5*TAU, rr=i===0?0:150;
    const px=Math.cos(an)*rr, py=-70+Math.sin(an)*rr*0.5;
    const R=i===0?64:36;
    g.save(); g.translate(px,py);
    g.globalAlpha=A*0.95;
    g.fillStyle="rgba(0,0,0,.5)"; g.beginPath(); g.arc(0,0,R,0,TAU); g.fill();
    g.strokeStyle=i%2?c0:c1; g.lineWidth=3; g.stroke();
    for(let k=0;k<12;k++){ const b=k/12*TAU;
      g.beginPath(); g.moveTo(Math.cos(b)*R*0.8,Math.sin(b)*R*0.8);
      g.lineTo(Math.cos(b)*R*0.95,Math.sin(b)*R*0.95); g.lineWidth=k%3?1.2:2.4; g.stroke(); }
    const dir=(i%2?-1:1)*(1+i*0.9);        // each runs at its own rate and sign
    g.strokeStyle="#ffffff"; g.lineCap="round";
    g.lineWidth=R*0.08;
    g.beginPath(); g.moveTo(0,0);
    g.lineTo(Math.cos(t*0.0009*dir)*R*0.5,Math.sin(t*0.0009*dir)*R*0.5); g.stroke();
    g.lineWidth=R*0.05;
    g.beginPath(); g.moveTo(0,0);
    g.lineTo(Math.cos(t*0.009*dir)*R*0.78,Math.sin(t*0.009*dir)*R*0.78); g.stroke();
    if(i>2){ g.strokeStyle=c0; g.lineWidth=2;   // cracked faces
      g.beginPath(); g.moveTo(-R,-R*0.3); g.lineTo(R*0.4,R*0.5); g.stroke(); }
    g.restore();

"Primordial"(g,a,t,A){                  // matter before it decided what to be
  const c0=a.c[0], c1=a.c[1];
  for(let i=0;i<40;i++){

  cg.addColorStop(0,"#ffffff"); cg.addColorStop(.4,c0); cg.addColorStop(1,"transparent");
  g.fillStyle=cg; g.beginPath(); g.arc(0,-70,60,0,TAU); g.fill();
}
};

/* ==========================================================================
   COMPOSITION
   An aura is not one motif. It is a scene: something stands behind you,
   something orbits it, something is held, something hangs overhead, and the
   whole thing lands on a floor. Each slot draws from its own library, so the
   combinations run into the thousands and no two rare pulls stage the same
   way. All of these draw in the figure's local space - origin at its feet,
   one unit roughly a pixel at reference scale - so they line up with it at
   any canvas size.
   ========================================================================== */
function anchor(W,H){ return {cx:W/2, cy:H/2+H*0.10, s:Math.min(W,H)/340}; }
function inFigure(x,W,H,fn){
  const A=anchor(W,H);
  x.save(); x.translate(A.cx,A.cy); x.scale(A.s,A.s); fn(x); x.restore();
}
function glowPath(x,fill,glow,blur){
  x.save(); x.shadowColor=glow; x.shadowBlur=blur||18; x.fillStyle=fill; x.fill(); x.restore();
}

/* ---------------- GROUND ---------------- */
const GROUND={
/* the receding grid from a thousand ritual scenes, and it still works */
grid(x,W,H,a,t,A){
  const hy=H*0.66, c0=a.c[0];
  x.save(); x.globalCompositeOperation="lighter"; x.globalAlpha=A*0.5;
  x.strokeStyle=c0; x.lineWidth=1;
  for(let i=-9;i<=9;i++){                       // converging lines
    const u=i/9;
    x.beginPath(); x.moveTo(W/2+u*W*0.08,hy); x.lineTo(W/2+u*W*1.5,H); x.stroke();
  }
  for(let i=1;i<=9;i++){                        // horizontals, spaced by perspective
    const u=Math.pow(i/9,2.1), y=hy+(H-hy)*u;
    x.globalAlpha=A*0.5*(1-u*0.6);
    x.beginPath(); x.moveTo(0,y); x.lineTo(W,y); x.stroke();
  }
  x.restore();
},
/* a turning sigil written on the floor */
runes(x,W,H,a,t,A){
  const hy=H*0.70, cy=hy+(H-hy)*0.45, c0=a.c[0], c1=a.c[1];
  x.save(); x.globalCompositeOperation="lighter"; x.translate(W/2,cy);
  for(let r=0;r<3;r++){
    const rr=W*(0.17+r*0.09), sp=t*0.00022*(r%2?-1:1);
    x.globalAlpha=A*0.55; x.strokeStyle=r%2?c0:c1; x.lineWidth=1.5;
    x.beginPath(); x.ellipse(0,0,rr,rr*0.3,0,0,TAU); x.stroke();
    const n=8+r*5;
    for(let i=0;i<n;i++){
      const an=sp+i/n*TAU;
      const px=Math.cos(an)*rr, py=Math.sin(an)*rr*0.3;
      x.globalAlpha=A*(0.4+Math.abs(Math.sin(t*0.002+i))*0.6);
      x.fillStyle=i%3?c0:"#fff";
      x.save(); x.translate(px,py); x.rotate(an);
      x.fillRect(-1.6,-5,3.2,10);
      if(i%3===0) x.fillRect(-5,-1.6,10,3.2);
      x.restore();
    }
  }
  x.restore();
},
/* ground broken open, light coming up through it */
cracks(x,W,H,a,t,A){
  const hy=H*0.70, cy=hy+(H-hy)*0.45, c0=a.c[0];
  x.save(); x.globalCompositeOperation="lighter"; x.translate(W/2,cy);
  for(let i=0;i<11;i++){
    const an=i/11*TAU+0.3, L=W*(0.14+((i*37)%100)/100*0.3);
    const pulse=0.5+Math.abs(Math.sin(t*0.0016+i))*0.5;
    x.globalAlpha=A*0.8*pulse;
    const g=x.createLinearGradient(0,0,Math.cos(an)*L,Math.sin(an)*L*0.3);
    g.addColorStop(0,"#ffffff"); g.addColorStop(0.3,c0); g.addColorStop(1,"transparent");
    x.strokeStyle=g; x.lineWidth=3.4; x.lineCap="round";
    x.beginPath(); x.moveTo(0,0);
    let px=0,py=0;
    for(let k=1;k<=4;k++){
      px=Math.cos(an+Math.sin(k*2.3+i)*0.25)*L*k/4;
      py=Math.sin(an+Math.sin(k*2.3+i)*0.25)*L*0.3*k/4;
      x.lineTo(px,py);
    }
    x.stroke();
  }
  x.restore();
},
/* standing water, catching everything above it */
water(x,W,H,a,t,A){
  const hy=H*0.70, c0=a.c[0];
  x.save(); x.globalCompositeOperation="lighter";
  for(let i=0;i<22;i++){
    const u=i/22, y=hy+(H-hy)*Math.pow(u,1.4);

    x.strokeStyle=i%3?c0:"#ffffff"; x.lineWidth=1+u*1.6;
    x.beginPath(); x.moveTo(W/2-w/2+off,y); x.lineTo(W/2+w/2+off,y); x.stroke();
  }
  x.restore();
}};
