/* ==========================================================================
   ATMOSPHERE
   What separates a particle toy from something that looks shot rather than
   drawn is almost entirely layering: haze with depth in it, light that has
   volume, debris that refracts, a floor for the light to land on, and a lens
   that is not perfect. Each of these is a pass, drawn back to front, with
   the entity sitting inside them rather than on top.
   ========================================================================== */

/* Volumetric haze. Many large, very soft radial blobs at low alpha read as
   smoke far better than many small hard ones - the overlap does the work. */
/* The puff is pre-rendered once per aura into three tinted sprites. Building
   a radial gradient per blob per frame was the single most expensive thing on
   screen; a drawImage of a cached sprite is a blit. */
const PUFF={id:null,imgs:null};
function puffs(a){
  if(PUFF.id===a.id) return PUFF.imgs;
  const mk=col=>{
    const c=document.createElement("canvas"); c.width=c.height=128;
    const g=c.getContext("2d");
    const rg=g.createRadialGradient(64,64,0,64,64,64);
    rg.addColorStop(0,col); rg.addColorStop(0.32,col+"55"); rg.addColorStop(1,col+"00");
    g.fillStyle=rg; g.fillRect(0,0,128,128); return c;
  };
  PUFF.id=a.id; PUFF.imgs=[mk("#ffffff"),mk(a.c[0]),mk(a.c[1])];
  return PUFF.imgs;
}
function smoke(x,W,H,a,t,A,mode,n){
  const R=Math.min(W,H), sp=puffs(a);
  x.save(); x.globalCompositeOperation="lighter";
  for(let i=0;i<n;i++){
    const u=i/n;
    let px,py,rr;
    if(mode==="spiral"){
      // arms wound around the frame, as in a nebula seen face on
      const turns=2.1, an=u*TAU*turns + t*0.00013 + (i%2?Math.PI:0);
      const rad=R*(0.17+u*0.46);
      px=W/2+Math.cos(an)*rad*1.28;
      py=H/2+Math.sin(an)*rad*0.82;
      rr=R*(0.09+u*0.14)*(1+Math.sin(t*0.0006+i)*0.14);
    } else {
      const an=t*0.00009*(i%3+1)+u*TAU;
      px=W/2+Math.cos(an+i)*R*(0.1+u*0.5);
      py=H*0.55+Math.sin(an*0.7+i*2)*R*(0.08+u*0.3);
      rr=R*(0.1+u*0.17)*(1+Math.sin(t*0.0005+i*1.7)*0.18);
    }
    x.globalAlpha=A*(0.055+0.05*Math.abs(Math.sin(t*0.0004+i)));
    x.drawImage(sp[i%3],px-rr,py-rr,rr*2,rr*2);
  }
  x.restore();
}

/* Shafts of light with a hot white core and coloured flanks. Drawn as three
   stacked gradients of decreasing width so the core reads as overexposed. */
function pillars(x,W,H,a,t,A,n){
  const R=Math.min(W,H), c0=a.c[0], c1=a.c[1];
  x.save(); x.globalCompositeOperation="lighter";
  for(let i=0;i<n;i++){
    const u=(i+0.5)/n;
    const lean=(u-0.5)*0.5;
    const px=W*(0.16+u*0.68)+Math.sin(t*0.0004+i)*W*0.015;
    const len=H*(0.72+Math.sin(i*2.1)*0.16);
    const pulse=0.65+Math.abs(Math.sin(t*0.0011+i*1.3))*0.35;
    x.save(); x.translate(px,H*0.48); x.rotate(lean);
    for(let k=0;k<3;k++){
      const wid=R*(0.052-k*0.016)*pulse;
      const col=k===2?"#ffffff":(k?c0:c1);
      const g=x.createLinearGradient(0,-len/2,0,len/2);
      g.addColorStop(0,col+"00"); g.addColorStop(0.3,col+(k===2?"ee":"88"));
      g.addColorStop(0.62,col+(k===2?"ff":"aa")); g.addColorStop(1,col+"00");
      x.globalAlpha=A*(k===2?0.85:0.42);
      x.fillStyle=g; x.fillRect(-wid/2,-len/2,wid,len);
    }
    // the bright knot partway up each shaft
    const ky=-len*0.12+Math.sin(t*0.0013+i)*len*0.05;
    const kg=x.createRadialGradient(0,ky,0,0,ky,R*0.07*pulse);
    kg.addColorStop(0,"#ffffff"); kg.addColorStop(0.3,c0); kg.addColorStop(1,c0+"00");
    x.globalAlpha=A*0.9; x.fillStyle=kg;
    x.beginPath(); x.arc(0,ky,R*0.07*pulse,0,TAU); x.fill();
    x.restore();
  }
  x.restore();
}

/* Debris that refracts. Each shard gets a bright face, a dark facet and a
   thin spectral rim - the rim is what sells it as glass rather than confetti. */
const SHG={id:null,body:null,rim:null};
function shardGrads(x,a){
  if(SHG.id===a.id) return SHG;
  // built in unit coordinates, so one pair serves every shard at every size
  const b=x.createLinearGradient(-1,-1,1,1);
  b.addColorStop(0,"#ffffff"); b.addColorStop(0.45,a.c[0]+"cc"); b.addColorStop(1,a.c[0]+"11");
  const r=x.createLinearGradient(-1,-2,1,2);
  r.addColorStop(0,"#ff5c7a"); r.addColorStop(0.5,"#6cf0ff"); r.addColorStop(1,"#c38cff");
  SHG.id=a.id; SHG.body=b; SHG.rim=r; return SHG;
}
function shards(x,W,H,a,t,A,n){
  const R=Math.min(W,H);
  const G=shardGrads(x,a);
  x.save(); x.globalCompositeOperation="lighter";
  for(let i=0;i<n;i++){
    const seed=i*127.1;
    const u=((t*0.00006*(1+(i%4)*0.35)+i/n)%1);
    const an=seed%TAU;
    const rad=R*(0.12+((i*53)%100)/100*0.52);
    const px=W/2+Math.cos(an+t*0.00012*(i%3+1))*rad*1.25;
    const py=H/2+Math.sin(an*1.3+t*0.0001*(i%2+1))*rad*0.8 - (u-0.5)*H*0.14;
    const sz=R*(0.012+((i*37)%100)/100*0.032);
    const rot=an+t*0.0007*((i%2)?1:-1);
    const depth=0.4+((i*73)%100)/100*0.6;
    x.save();
    x.translate(px,py); x.rotate(rot); x.scale(sz,sz*(0.42+depth*0.6));
    x.beginPath(); x.moveTo(0,-1.9); x.lineTo(0.75,0); x.lineTo(0,1.5);
    x.lineTo(-0.62,0.2); x.closePath();
    x.globalAlpha=A*depth*0.9; x.fillStyle=G.body; x.fill();
    x.globalAlpha=A*depth*0.75; x.strokeStyle=G.rim;
    x.lineWidth=Math.max(0.7,sz*0.16)/sz;
    x.stroke();
    x.restore();
  }
  x.restore();
}

/* A floor for the light to land on: a receding plane with rings leaving the
   centre. Without this the scene has no scale and no bottom. */
function groundPlane(x,W,H,a,t,A){
  const c0=a.c[0], c1=a.c[1];
  const hy=H*0.70, cx=W/2;
  x.save();
  // the plane itself
  const g=x.createLinearGradient(0,hy,0,H);
  g.addColorStop(0,c1+"00"); g.addColorStop(0.45,c1+"22"); g.addColorStop(1,c0+"14");
  x.globalAlpha=A; x.fillStyle=g; x.fillRect(0,hy,W,H-hy);
  x.globalCompositeOperation="lighter";
  // ripples
  for(let i=0;i<5;i++){
    const ph=((t*0.00035+i/5)%1), e=1-Math.pow(1-ph,2.2);
    x.globalAlpha=A*(1-ph)*0.55;
    x.strokeStyle=i%2?c0:"#ffffff"; x.lineWidth=(1-ph)*2.6+0.5;
    x.beginPath(); x.ellipse(cx,hy+(H-hy)*0.46,W*0.56*e,(H-hy)*0.42*e,0,0,TAU); x.stroke();
  }
  // a soft pool of light under the figure
  const pg=x.createRadialGradient(cx,hy+(H-hy)*0.44,0,cx,hy+(H-hy)*0.44,W*0.3);
  pg.addColorStop(0,c0+"55"); pg.addColorStop(1,c0+"00");
  x.globalAlpha=A*0.9; x.fillStyle=pg;
  x.beginPath(); x.ellipse(cx,hy+(H-hy)*0.44,W*0.3,(H-hy)*0.3,0,0,TAU); x.fill();
  x.restore();
}

/* The lens: a horizontal anamorphic streak and a couple of ghosts down the
   optical axis. Real glass does this; perfect optics look synthetic. */
function anamorphic(x,W,H,a,t,A){
  const c0=a.c[0];
  x.save(); x.globalCompositeOperation="lighter";
  const cy=H*0.46, pulse=0.6+Math.abs(Math.sin(t*0.0009))*0.4;
  const g=x.createLinearGradient(0,cy,W,cy);
  g.addColorStop(0,"transparent"); g.addColorStop(0.3,c0+"66");
  g.addColorStop(0.5,"#ffffffcc"); g.addColorStop(0.7,c0+"66");
  g.addColorStop(1,"transparent");
  x.globalAlpha=A*0.5*pulse; x.fillStyle=g;
  x.fillRect(0,cy-H*0.006,W,H*0.012);
  for(let i=1;i<=3;i++){
    const d=(i-2)*W*0.17;
    x.globalAlpha=A*0.1;
    x.fillStyle=[c0,"#8ad9ff","#ffb48a"][i%3];
    x.beginPath(); x.arc(W/2+d,cy+d*0.2,W*0.02*i,0,TAU); x.fill();
  }
  x.restore();
}

const COMPO_READY=(() => {
  const RE=mulberry(90210777);
  const pick=o=>{const k=Object.keys(o); return k[(RE()*k.length)|0];};
  /* Two things were making the deep end look alike: the apex pool was nine
     entities covering most of 172 auras, and nothing but the component choice
     varied - same scale, same spin, same staging. The pool is every entity
     now, only weighted toward the showy ones, and each aura carries its own
     spin rate and direction, scale and lift, so two auras sharing a subject
     still do not read as the same scene. */
  const SHOWY=["seraph","reaper","ghost","orrery","rift","throne","phoenix","eye",
               "antlers","clockwork","tentacles","monolith","jelly","mask","spider"];
  for(const a of AURAS){
    const u=a.i/(N_AURAS-1), deep=u>0.72;
    a.sig = SIGN[a.n] ? a.n : null;        // the named apex auras get their own scene
    a.ent=(deep&&RE()<0.5) ? SHOWY[(RE()*SHOWY.length)|0]
                           : ENT_NAMES[(RE()*ENT_NAMES.length)|0];
    a.gnd=pick(GROUND);
    a.sat=pick(SATS);
    a.sat2=(u>0.62&&RE()<0.45) ? pick(SATS) : null;   // some carry two rings
    a.wld=(u>0.30||RE()<0.5) ? pick(WIELD) : null;
    a.ovr=(u>0.46||RE()<0.35) ? pick(OVER)  : null;
    a.spin=(0.55+RE()*1.5)*(RE()<0.5?-1:1);
    a.escale=0.78+RE()*0.62;
    a.elift=(RE()-0.5)*0.22;
    a.satR=0.82+RE()*0.5;
  }
  return true;
})();

/* ---------------- background ---------------- */
const bg=$("bg"),bx=bg.getContext("2d");
let BW=0,BH=0,stars=[];
function sizeBg(){BW=bg.width=innerWidth;BH=bg.height=innerHeight;
  stars=Array.from({length:140},()=>({x:Math.random()*BW,y:Math.random()*BH,
    r:Math.random()*1.3+0.2,p:Math.random()*6.28,s:0.3+Math.random()*0.7}))}
addEventListener("resize",sizeBg); sizeBg();
const biome=()=>BIOMES.find(b=>b.id===S.biome)||BIOMES[0];
function drawBg(t){
  bx.fillStyle="#06060b"; bx.fillRect(0,0,BW,BH);
  const g=bx.createLinearGradient(0,0,0,BH);
  g.addColorStop(0,biome().tint+"24"); g.addColorStop(.6,"#06060b00");
  bx.fillStyle=g; bx.fillRect(0,0,BW,BH);
  for(const s of stars){ bx.globalAlpha=.25+Math.abs(Math.sin(t*.0011*s.s+s.p))*.6;
    bx.fillStyle="#cfd6ff"; bx.fillRect(s.x,s.y,s.r,s.r); }
  bx.globalAlpha=1;
}

/* ---------------- biome cycle ---------------- */
function pickBiome(){const tot=BIOMES.reduce((a,b)=>a+b.w,0);let r=Math.random()*tot;
  for(const b of BIOMES){r-=b.w;if(r<=0)return b.id}return "SERENE"}
function rollBiome(){
  const prev=S.biome; S.biome=pickBiome(); S.biomeEnd=Date.now()+BIOME_MS;
  if(S.biome!==prev){ feedRaw(S.biome+" BIOME","biome shift",biome().tint); tone(300,.5,"sine",.05); }
  save();
}
if(!S.biomeEnd||S.biomeEnd<Date.now()) rollBiome();

/* ---------------- roll ----------------
   Rarest first, first hit wins: luck lifts every tier at once. With 700
   entries a linear scan per roll is 700 comparisons, which is nothing, and
   it keeps the odds exactly readable off the table. */
function rollAura(){
  if(forcedNext&&BY_ID[forcedNext]){ const a=BY_ID[forcedNext]; forcedNext=null; return a; }
  const L=luck(), bi=S.biome, floor=S.catalyst||0;
  for(let i=MAXI;i>=0;i--){
    const a=AURAS[i];
    if(a.o<floor) break;                        // a catalyst refuses anything below it
    if(a.b&&a.b!==bi) continue;
    if(Math.random()<L/a.o) return a;
  }
  if(floor){
    // the catalyst guarantees its floor even when nothing above it landed
    const pool=AURAS.filter(a=>a.o>=floor&&(!a.b||a.b===bi));
    return pool[(Math.random()*pool.length)|0]||AURAS[MAXI];
  }
  return AURAS[0];
}
const shardsFor=o=>Math.max(1,Math.round(Math.log2(o)*1.6*(1+loadoutStats().shard/100)));
const essenceFor=o=>Math.max(1,Math.round(Math.log2(o)));

/* ---------------- reel ---------------- */
const reel=$("reel"),reelWrap=$("reelWrap");
const TILE=104,GAP=8,STEP=TILE+GAP,WIN_AT=52,STRIP=60;
const tileHTML=a=>`<div class="tile" style="background:linear-gradient(135deg,${a.c[0]},${a.c[1]})">
  <div class="nm">${a.n}</div><div class="od">1 in ${fmt(a.o)}</div></div>`;
/* filler weighted to the common end, or a 700-long table would parade
   legendaries past the needle that never land */
function filler(){
  const r=Math.random();
  const span=r<.7?60:r<.93?220:MAXI+1;
  let a,guard=0;
  do{ a=AURAS[(Math.random()*span)|0]; guard++; }while(a.b&&a.b!==S.biome&&guard<12);
  return a;
}
function buildStrip(w){
  const it=[]; for(let i=0;i<STRIP;i++) it.push(i===WIN_AT?w:filler());
  reel.innerHTML=it.map(tileHTML).join("");
}
let spinning=false;
function spin(w,dur){
  return new Promise(res=>{
    buildStrip(w);
    const center=reelWrap.clientWidth/2;
    const end=-(WIN_AT*STEP)-TILE/2+center, start=center+STEP*2, t0=performance.now();
    let last=-1;
    (function f(now){
      const p=clamp((now-t0)/dur,0,1), e=1-Math.pow(1-p,5), x=start+(end-start)*e;
      reel.style.transform=`translateX(${x}px)`;
      const idx=Math.round((center-x-TILE/2)/STEP);
      if(idx!==last){last=idx;tick()}
      p<1?requestAnimationFrame(f):res();
    })(t0);
  });
}

/* ==========================================================================
   THE CUTSCENE
   From 1 in 5,000 the roll stops being a reel result and becomes an event:
   the screen drops to black, then flickers in the aura's own colour. From
   1 in 80,000 a star ignites in that flicker, and the star's construction
   gets another layer at every rarity step above it - more diffraction
   spikes, halo rings, lens ghosts, chromatic separation, god rays - so the
   quality of the star is itself the readout of what you pulled.
   ========================================================================== */
const cutCv=$("cut"), cx2=cutCv.getContext("2d");

/* easing - every transition in the cutscene runs through one of these rather
   than a raw ratio, which is most of what "smooth" actually means here */
const easeOutCubic =p=>1-Math.pow(1-p,3);
const easeInOutSine=p=>-(Math.cos(Math.PI*p)-1)/2;
const easeOutExpo  =p=>p>=1?1:1-Math.pow(2,-9*p);
const easeOutBack  =p=>{const c=1.4;return 1+(c+1)*Math.pow(p-1,3)+c*Math.pow(p-1,2)};
const span=(p,a,b)=>clamp((p-a)/(b-a),0,1);

/* ==========================================================================
   STAR TYPES
   Not one star with more layers bolted on at each step: ten different stars.
   What ignites tells you the bracket at a glance, before the number appears.
   ========================================================================== */
function spikes(x,cx,cy,n,len,wid,rot,c0,c1,g,longEvery){
  for(let i=0;i<n;i++){
    const an=rot+i/n*TAU;
    const L=len*((longEvery&&i%longEvery===0)?1:0.54);
    const gr=x.createLinearGradient(cx,cy,cx+Math.cos(an)*L,cy+Math.sin(an)*L);
    gr.addColorStop(0,"#ffffff"); gr.addColorStop(.1,c0);
    gr.addColorStop(.5,c1); gr.addColorStop(1,"transparent");
    x.strokeStyle=gr; x.lineWidth=wid*g; x.lineCap="round";
    x.beginPath(); x.moveTo(cx,cy); x.lineTo(cx+Math.cos(an)*L,cy+Math.sin(an)*L); x.stroke();
  }
}
function coreGlow(x,cx,cy,r,c0,c1,g){
  const cg=x.createRadialGradient(cx,cy,0,cx,cy,r);
  cg.addColorStop(0,"#ffffff"); cg.addColorStop(.15,c0);
  cg.addColorStop(.45,c1); cg.addColorStop(1,"transparent");
  x.globalAlpha=g; x.fillStyle=cg;
  x.beginPath(); x.arc(cx,cy,r,0,TAU); x.fill();
}

];
function starFor(o){
  let k=-1;
  for(let i=0;i<STAR_TYPES.length;i++) if(o>=STAR_TYPES[i].min) k=i;
  return k;
}
function cutTier(o){ return starFor(o)+1; }        // 0 = no cutscene

/* Flicker eased rather than switched: bursts rise and fall instead of
   snapping, which is the difference between a strobe and a dying lamp. */
function flickerAlpha(p){
  const env=Math.pow(Math.sin(p*Math.PI),0.5);
  const burst=easeInOutSine(clamp(Math.sin(p*Math.PI*6.5)*0.5+0.5,0,1));
  const fast=(Math.sin(p*190)*0.5+0.5)*(Math.sin(p*97)*0.5+0.5);
  return clamp(env*(burst*0.45+fast*0.85),0,1);
}

/* The cutscene keeps its own trail buffer: the star is drawn into a layer
   that fades instead of clearing, so sweeps and debris leave smooth arcs
   rather than stepping frame to frame. */
let cutTrail=null, cutTx=null;
function runCutscene(a){
  const k=starFor(a.o);
  if(k<0||S.skipCut) return Promise.resolve(false);
  const ST=STAR_TYPES[k], DUR=ST.dur;
  /* Half resolution. Every pixel of this scene is soft glow, gradient or
     bloom, so halving the backing store is visually indistinguishable and
     costs a quarter as much to fill - which is the difference between the
     heaviest star running at 33fps and running at the display rate. */
  const SS=0.5;
  const W=cutCv.width=Math.round(innerWidth*SS), H=cutCv.height=Math.round(innerHeight*SS);
  if(!cutTrail||cutTrail.width!==W||cutTrail.height!==H){
    cutTrail=document.createElement("canvas"); cutTrail.width=W; cutTrail.height=H;
    cutTx=cutTrail.getContext("2d");
  }
  cutTx.clearRect(0,0,W,H);
  cutCv.classList.add("show");
  const t0=performance.now();
  const BLACK=0.12, FLICK=0.44, XF=0.07;          // crossfade width between phases
  if(!S.muted){
    tone(70,0.6,"sawtooth",0.08);
    setTimeout(()=>tone(k>=6?48:88,1.4,"sawtooth",0.06),DUR*BLACK);
  }
  return new Promise(res=>{
    (function frame(now){
      const p=clamp((now-t0)/DUR,0,1);
      cx2.globalCompositeOperation="source-over";
      cx2.globalAlpha=1; cx2.fillStyle="#000"; cx2.fillRect(0,0,W,H);

      // ---- flicker, fading out across the crossfade rather than cutting ----
      const fIn=span(p,BLACK,BLACK+0.04), fOut=1-span(p,FLICK-XF,FLICK+XF);
      if(fOut>0.001&&p>BLACK){
        const fp=span(p,BLACK,FLICK);
        const al=flickerAlpha(fp)*fIn*fOut;
        if(al>0.015){
          const gr=cx2.createRadialGradient(W/2,H/2,0,W/2,H/2,Math.max(W,H)*0.62);
          gr.addColorStop(0,a.c[0]); gr.addColorStop(0.55,a.c[1]); gr.addColorStop(1,"#000");
          cx2.globalAlpha=al*0.92; cx2.fillStyle=gr; cx2.fillRect(0,0,W,H);
          const ent=ENTITIES[a.ent];
          if(ent&&al>0.4){
            cx2.globalAlpha=al*0.5;
            try{ ent(cx2,W,H,{...a,c:["#000","#05050a"]},now,1); }catch(e){}
          }
          if(!S.muted&&al>0.86&&Math.random()<0.22) tone(1400+Math.random()*900,0.03,"square",0.03);
        }
        cx2.globalAlpha=1;
      }

      // ---- the star, on its own fading trail layer ----
      const sIn=span(p,FLICK-XF,FLICK+0.22);
      if(sIn>0.001){
        const sp=span(p,FLICK-XF,1);
        const g=easeOutBack(clamp(sp*1.7,0,1))*(1-span(p,0.9,1)*0.35);
        cutTx.globalCompositeOperation="destination-out";
        cutTx.globalAlpha=1; cutTx.fillStyle="rgba(0,0,0,0.26)"; cutTx.fillRect(0,0,W,H);
        /* Only the star goes through the trail buffer. The entity is drawn
           straight to the frame: an additive layer that fades by a quarter
           each frame accumulates whatever is redrawn in place, and a solid
           entity saturates to white within about four frames. */
        cutTx.globalCompositeOperation="lighter"; cutTx.globalAlpha=1;
        cutTx.save();
        try{ ST.draw(cutTx,W,H,a,now,g); }catch(e){}
        cutTx.restore();

        const ent=a.sig?null:ENTITIES[a.ent];
        if(a.sig&&SIGN[a.sig]){
          const ea=span(sp,0.1,0.55)*(1-span(sp,0.88,1));
          cx2.save(); cx2.globalCompositeOperation="lighter";
          cx2.globalAlpha=easeOutCubic(sIn)*0.62;
          cx2.translate(W/2,H/2); cx2.scale(0.62,0.62); cx2.translate(-W/2,-H/2);
          inFigure(cx2,W,H,g=>{ try{ SIGN[a.sig](g,a,now*a.spin,ea); }catch(e){} });
          if(SATS[a.sat]) try{ SATS[a.sat](cx2,W,H,a,now,ea*0.8); }catch(e){}
          cx2.restore();
        }
        if(ent){
          const ea=span(sp,0.1,0.55)*(1-span(sp,0.88,1));
          cx2.save();
          cx2.globalCompositeOperation="lighter";
          cx2.globalAlpha=easeOutCubic(sIn)*0.42;
          const z=0.58+ea*0.12;                    // keep it inside the frame
          cx2.translate(W/2,H/2); cx2.scale(z,z); cx2.translate(-W/2,-H/2);
          try{ ent(cx2,W,H,a,now,ea*0.8); }catch(e){}
          // the satellites and whatever hangs overhead arrive with it, which
          // is most of what makes the climax read as a scene
          if(SATS[a.sat]) try{ SATS[a.sat](cx2,W,H,a,now,ea*0.85); }catch(e){}
          if(a.ovr&&OVER[a.ovr]) try{ OVER[a.ovr](cx2,W,H,a,now,ea*0.8); }catch(e){}
          cx2.restore();
        }
        cx2.globalCompositeOperation="lighter";
        cx2.globalAlpha=easeOutCubic(sIn);
        cx2.drawImage(cutTrail,0,0);
        cx2.globalAlpha=1; cx2.globalCompositeOperation="source-over";
        if(ST.occlude){ cx2.save();
          try{ ST.occlude(cx2,W,H,a,now,g); }catch(e){} cx2.restore(); }
      }
      if(p<1) requestAnimationFrame(frame);
      else { cutCv.classList.remove("show"); res(true); }
    })(t0);
  });
}

/* ---------------- feed ---------------- */
function feedRaw(title,sub,color){
  const d=document.createElement("div");
  d.className="fi"; d.style.borderLeftColor=color;
  d.innerHTML=`<b style="color:${color}">${title}</b><span>${sub}</span>`;
  $("feed").prepend(d);
  while($("feed").children.length>11) $("feed").lastChild.remove();
  setTimeout(()=>{d.style.transition="opacity .5s";d.style.opacity="0"},7000);
  setTimeout(()=>d.remove(),7600);
}
const feed=a=>feedRaw(a.n,"1 in "+fmt(a.o),a.c[0]);

/* ---------------- a roll ---------------- */
let cdUntil=0;
async function doRoll(){
  if(spinning) return;
  spinning=true; $("rollBtn").disabled=true;
  const a=rollAura(), t=tierOf(a.o);
  if(S.instant){ buildStrip(a); parkOn(WIN_AT); }
  else await spin(a, S.fast?420:[2200,2800,3500,4300,5200,6400][t]);
  S.rolls++; S.inv[a.id]=(S.inv[a.id]||0)+1; S.shards+=shardsFor(a.o);
  if(Math.random()<1/SHINY_ODDS){
    S.shiny[a.id]=(S.shiny[a.id]||0)+1;
    feedRaw("RADIANT "+a.n,"mutation","#ffe9a8");
  }
  /* Pity: rolls that find nothing past 1 in 50,000 raise the next roll's
     effective luck, and a hit resets it, so a dry run cannot be endless. */
  if(a.o>=5e4) S.pity=0; else S.pity++;
  if(S.catalyst) S.catalyst=0;                     // a catalyst is spent on one roll
  if(!S.loadout.some(x=>x)) S.loadout[0]=a.id;     // first pull fills slot 1
  if(!S.rarest||a.o>BY_ID[S.rarest].o) S.rarest=a.id;
  if(S.inv[a.id]===1&&(!S.equipped||a.o>=BY_ID[S.equipped].o)) S.equipped=a.id;
  feed(a); save(); paint();
  await reveal(a);
  cdUntil=Date.now()+cooldown(); spinning=false; paint();
  if(S.auto) setTimeout(()=>{if(S.auto&&!spinning)doRoll()},cooldown()+40);
}

/* ---------------- paint ---------------- */
let previewId=null;
const shown=()=>BY_ID[previewId]||BY_ID[S.loadout&&S.loadout[0]]||BY_ID[S.equipped]||null;
function paint(){
  $("sRolls").textContent=fmt(S.rolls);
  $("sLuck").textContent=fmtLuck(luck())+"x";
  $("sLuck").style.color=luck()>1?"var(--gold)":"";
  $("sShards").textContent=fmt(S.shards);
  $("sEss").textContent=fmt(S.essence);
  $("sIndex").textContent=owned()+"/"+N_AURAS;
  $("biomeName").textContent=S.biome;
  $("biomeName").style.color=biome().tint;
  const a=shown();
  $("showName").textContent=a?a.n:"Nothing equipped";
  $("showName").style.color=a?a.c[0]:"";
  $("showMeta").textContent=a
    ?("1 IN "+fmt(a.o)+" · "+TIERNAME[tierOf(a.o)].toUpperCase()+(a.b?" · "+a.b:"")
      +(previewId&&previewId!==S.equipped?" · PREVIEW":""))
    :"roll to begin";
  $("showFx").textContent=a
    ?((isShiny(a.id)?"\u2726 RADIANT \u00b7 ":"")+(a.sig?"SIGNATURE \u00b7 ":"")+
      [a.sig?null:a.ent,a.wld,a.sat,a.sat2,a.ovr,a.gnd]
        .filter(Boolean).join(" \u00b7 ").toUpperCase()):"";
  $("showFx").style.color=a&&isShiny(a.id)?"#ffe9a8":"";
  const now=Date.now();
  $("fx").innerHTML=S.effects.filter(e=>e.until>now).map(e=>{
    const p=POTIONS.find(x=>x.id===e.id)||{n:e.id};
    return `<div class="fxp">${p.n} &middot; ${Math.ceil((e.until-now)/1000)}s</div>`}).join("");
  const cap=slotCap(), lo=$("loadout");
  lo.innerHTML="";
  for(let i=0;i<6;i++){
    const d=document.createElement("div");
    const id=S.loadout[i], au=BY_ID[id], open=i<cap;
    d.className="slot"+(i===0?" p0":"")+(open?"":" locked");
    d.title=open?(au?au.n:"empty slot "+(i+1)):("unlocks at "+(i*60)+" auras found");
    d.innerHTML=au
      ? `<div class="so" style="background:radial-gradient(circle at 34% 30%,${au.c[0]},${au.c[1]});box-shadow:0 0 14px ${au.c[0]}99${isShiny(id)?";outline:2px solid #ffe9a8":""}"></div><div class="sl">${i+1}</div>`
      : `<div class="so" style="background:#191926"></div><div class="sl">${i+1}</div>`;
    if(open) d.onclick=()=>{ assignTo=i; openIndex(); };
    lo.appendChild(d);
  }
  const st=loadoutStats();
  $("stats").innerHTML=
    `<div>LUCK <b>+${st.luck.toFixed(0)}%</b></div>`+
    `<div>SHARDS <b>+${st.shard.toFixed(0)}%</b></div>`+
    `<div>SPEED <b>+${st.speed.toFixed(0)}%</b></div>`+
    `<div>BIOME <b>+${st.biome.toFixed(0)}%</b></div>`;
  $("catBan").textContent=S.catalyst
    ? "CATALYST ARMED "+"·"+" next roll is at least 1 in "+fmt(S.catalyst) : "";
  $("btnAuto").classList.toggle("on",S.auto);
  $("btnFast").classList.toggle("on",S.fast);
  if(typeof fitShow==="function") fitShow();
  $("btnMute").textContent=S.muted?"MUTED":"SOUND";
  $("btnMute").classList.toggle("on",!S.muted);
}

/* ---------------- index ----------------
   700 cards is more than a grid wants to hold at once, so it renders in
   pages of 240 behind a search box and a filter. */
const PAGE=240; let idxShown=PAGE, assignTo=null;
function idxList(){
  const q=$("idxQ").value.trim().toLowerCase(), f=$("idxF").value;
  return AURAS.filter(a=>{
    if(q&&!a.n.toLowerCase().includes(q)) return false;
    if(f==="owned") return !!S.inv[a.id];
    if(f==="missing") return !S.inv[a.id];
    if(f==="biome") return !!a.b;
    return true;
  });
}
function renderIndex(){
  const list=idxList(), g=$("idxGrid");
  g.innerHTML="";
  const frag=document.createDocumentFragment();
  for(const a of list.slice(0,idxShown)){
    const have=S.inv[a.id]|0;
    const d=document.createElement("div");
    d.className="card"+(have?"":" locked")+(S.equipped===a.id?" eq":"");
    d.style.background=have?`linear-gradient(135deg,${a.c[0]},${a.c[1]})`:"#121220";
    d.innerHTML=`${have?`<div class="cc">x${fmt(have)}</div>`:""}
      <div class="cn">${have?(isShiny(a.id)?"\u2726 "+a.n:a.n):"???"}</div>
      <div class="co">1 in ${fmt(a.o)}${a.b?" &middot; "+a.b:""}</div>`;
    if(have) d.onclick=()=>{
      if(assignTo!==null){                       // arrived here from a loadout slot
        S.loadout[assignTo]=a.id;
        if(assignTo===0) S.equipped=a.id;
        assignTo=null; previewId=null; tone(820,.16,"sine",.06);
        save(); paint(); $("mIndex").classList.remove("show"); return;
      }
      if(previewId===a.id){ S.loadout[0]=a.id; S.equipped=a.id; previewId=null;
        tone(760,.14,"sine",.05); }
      else { previewId=a.id; tone(640,.1,"sine",.04); }
      save(); paint(); renderIndex();
    };
    frag.appendChild(d);
  }
  g.appendChild(frag);
  $("idxMore").innerHTML = list.length>idxShown
    ? `<button class="btn" id="moreBtn">SHOW MORE (${fmt(list.length-idxShown)} left)</button>`
    : `<span style="font-size:11px;color:var(--dim)">${fmt(list.length)} shown</span>`;
  const mb=$("moreBtn"); if(mb) mb.onclick=()=>{idxShown+=PAGE;renderIndex()};
  $("idxPct").textContent=(owned()/N_AURAS*100).toFixed(1)+"% · "+
    (assignTo!==null ? "pick an aura for slot "+(assignTo+1)
                     : "click to preview, again to equip");
}
function openIndex(){ idxShown=PAGE; if(assignTo!==null) $("idxF").value="owned";
  renderIndex(); $("mIndex").classList.add("show"); }
$("idxQ").oninput=()=>{idxShown=PAGE;renderIndex()};
$("idxF").onchange=()=>{idxShown=PAGE;renderIndex()};

/* ---------------- shop ---------------- */
function openShop(){
  const b=$("shopBody"); b.innerHTML="";
  $("shopShards").textContent=fmt(S.shards)+" shards";
  for(const p of POTIONS){
    const act=S.effects.find(e=>e.id===p.id&&e.until>Date.now());
    const row=document.createElement("div"); row.className="shopRow";
    row.innerHTML=`<div class="si"><b>${p.n}</b><span>${p.d}</span></div>`;
    const btn=document.createElement("button"); btn.className="btn";
    btn.textContent=act?Math.ceil((act.until-Date.now())/1000)+"s":fmt(p.cost);
    btn.disabled=!!act||S.shards<p.cost;
    if(btn.disabled) btn.style.opacity=".45";
    btn.onclick=()=>{
      if(S.shards<p.cost) return;
      S.shards-=p.cost; S.effects=S.effects.filter(e=>e.id!==p.id);
      S.effects.push({id:p.id,luck:p.luck,haste:p.haste,until:Date.now()+p.ms});
      save(); paint(); openShop(); tone(880,.25,"triangle",.06);
    };
    row.appendChild(btn); b.appendChild(row);
  }
  const n=document.createElement("div");
  n.style.cssText="font-size:11px;color:var(--dim);margin-top:10px;line-height:1.7";
  n.innerHTML="Luck multiplies your chance at every tier at once, and the multipliers stack, "+
    "so drinking two at once is the only realistic route to the deep end of the table.<br>"+
    "Every 500 rolls also adds a permanent +0.5x.";
  b.appendChild(n);
  $("mShop").classList.add("show");
}

/* ---------------- altar ----------------
   Melts duplicates to essence, always keeping one of each so the index can
   never be damaged by it, and sells catalysts: a floor on the next roll. */
function dupCount(){
  let n=0,e=0;
  for(const id in S.inv){ const a=BY_ID[id]; if(!a) continue;
    const d=S.inv[id]-1; if(d>0){ n+=d; e+=d*essenceFor(a.o); } }
  return {n,e};
}
function openAltar(){
  const b=$("altarBody"); b.innerHTML="";
  $("altEss").textContent=fmt(S.essence)+" essence";
  const {n,e}=dupCount();
  const melt=document.createElement("div"); melt.className="shopRow";
  melt.innerHTML=`<div class="si"><b>Melt duplicates</b><span>${fmt(n)} spare copies &rarr; ${fmt(e)} essence &middot; one of each is always kept</span></div>`;
  const mb=document.createElement("button"); mb.className="btn";
  mb.textContent="MELT"; mb.disabled=n===0; if(!n) mb.style.opacity=".45";
  mb.onclick=()=>{ for(const id in S.inv) if(S.inv[id]>1) S.inv[id]=1;
    S.essence+=e; save(); paint(); openAltar(); tone(420,.4,"triangle",.07); };
  melt.appendChild(mb); b.appendChild(melt);
  const hd=document.createElement("div");
  hd.style.cssText="font-size:11px;color:var(--dim);margin:14px 0 8px;letter-spacing:1.4px";
  hd.textContent="CATALYSTS \u2014 put a floor under your next roll";
  b.appendChild(hd);
  for(const c of CATALYSTS){
    const row=document.createElement("div"); row.className="shopRow";
    row.innerHTML=`<div class="si"><b>${c.n}</b><span>next roll is at least 1 in ${fmt(c.min)}</span></div>`;
    const btn=document.createElement("button"); btn.className="btn";
    btn.textContent=fmt(c.cost);
    btn.disabled=S.essence<c.cost||S.catalyst>=c.min;
    if(btn.disabled) btn.style.opacity=".45";
    btn.onclick=()=>{ if(S.essence<c.cost) return;
      S.essence-=c.cost; S.catalyst=c.min; save(); paint(); openAltar();
      tone(1000,.3,"triangle",.07); };
    row.appendChild(btn); b.appendChild(row);
  }
  const note=document.createElement("div");
  note.style.cssText="font-size:11px;color:var(--dim);margin-top:12px;line-height:1.7";
  note.textContent="A catalyst refuses everything below its floor, so the roll resolves above it. Luck still decides how far above. It is consumed by one roll.";
  b.appendChild(note);
  $("mAltar").classList.add("show");
}

/* ---------------- alpha tools ---------------- */
const ALPHA={
  shards:()=>{S.shards+=1e7},
  essence:()=>{S.essence+=1e6},
  luck:()=>{S.effects=S.effects.filter(e=>e.id!=="alpha");
    S.effects.push({id:"alpha",luck:1e6,until:Date.now()+300000})},
  slots:()=>{S.maxSlots=true},
  instant:()=>{S.instant=!S.instant},
  unlockall:()=>{for(const a of AURAS) S.inv[a.id]=Math.max(S.inv[a.id]||0,1);
    S.rarest=AURAS[MAXI].id},
  biome:()=>{S.biome=$("aBiome").value; S.biomeEnd=Date.now()+BIOME_MS},
  grant:()=>{
    const q=$("aGrant").value.trim().toLowerCase(); if(!q) return;
    const a=AURAS.find(x=>x.n.toLowerCase()===q)||AURAS.find(x=>x.n.toLowerCase().includes(q));
    if(!a){ feedRaw("no match","try another name","#ff6b6b"); return; }
    S.inv[a.id]=(S.inv[a.id]||0)+1;
    if(!S.rarest||a.o>BY_ID[S.rarest].o) S.rarest=a.id;
    S.loadout[0]=a.id; S.equipped=a.id; feed(a);
  },
  grantrarest:()=>{const a=AURAS[MAXI]; S.inv[a.id]=(S.inv[a.id]||0)+1;
    S.rarest=a.id; S.loadout[0]=a.id; S.equipped=a.id; feed(a);},
  setluck:()=>{
    const v=parseFloat($("aLuck").value.replace(/[,_\s]/g,""));
    if(!isFinite(v)||v<=0) return;
    S.effects=S.effects.filter(e=>e.id!=="alpha");
    S.effects.push({id:"alpha",luck:v,until:Date.now()+36e5});
  },
  forcenext:()=>{
    const q=$("aNext").value.trim().toLowerCase();
    if(!q){ forcedNext=null; feedRaw("force cleared","next roll is normal","#8a8aa6"); return; }
    const a=AURAS.find(x=>x.n.toLowerCase()===q)||AURAS.find(x=>x.n.toLowerCase().includes(q));
    if(!a){ feedRaw("no match","try another name","#ff6b6b"); return; }
    forcedNext=a.id; feedRaw("armed: "+a.n,"next roll is forced",a.c[0]);
  },
  playcut:()=>{
    const id=$("aCut").value, a=BY_ID[id]||AURAS[MAXI];
    $("alpha").classList.remove("show"); $("btnAlpha").classList.remove("on");
    runCutscene(a);
  },
  allshiny:()=>{for(const id in S.inv) S.shiny[id]=(S.shiny[id]||0)+1},
  allpotions:()=>{for(const q of POTIONS)
    S.effects.push({id:q.id,luck:q.luck,haste:q.haste,until:Date.now()+36e5})},
  skipcut:()=>{S.skipCut=!S.skipCut;
    feedRaw(S.skipCut?"cutscenes off":"cutscenes on","alpha","#c9a6ff")},
  freeze:()=>{S.biomeEnd=Date.now()+36e5; feedRaw("biome frozen",S.biome,"#c9a6ff")},
  rolls:()=>{S.rolls+=10000},
  clearlo:()=>{S.loadout=[null,null,null,null,null,null]},
  wipe:()=>{localStorage.removeItem(KEY); location.reload()}
};
let forcedNext=null;
$("btnAlpha").onclick=()=>{
  const el=$("alpha"); el.classList.toggle("show");
  $("btnAlpha").classList.toggle("on",el.classList.contains("show"));
  if(!$("aBiome").options.length)
    $("aBiome").innerHTML=BIOMES.map(b=>`<option>${b.id}</option>`).join("");
  if(!$("aCut").options.length){
    // one representative per cutscene tier, so every variant is reachable
    $("aCut").innerHTML=STAR_TYPES.map(st=>{
      const a=AURAS.find(x=>x.o>=st.min); if(!a) return "";
      return `<option value="${a.id}">${st.name} \u00b7 1 in ${fmt(st.min)}</option>`;
    }).join("");
  }
};
document.querySelectorAll("#alpha [data-a]").forEach(btn=>btn.onclick=()=>{
  const f=ALPHA[btn.dataset.a]; if(!f) return;
  f(); save(); paint(); tone(1200,.12,"square",.05);
});

/* ---------------- wiring ---------------- */
$("rollBtn").onclick=()=>doRoll();
$("btnIndex").onclick=openIndex;
$("btnShop").onclick=openShop;
$("btnAltar").onclick=openAltar;
$("btnAuto").onclick=()=>{S.auto=!S.auto;paint();if(S.auto&&!spinning&&Date.now()>=cdUntil)doRoll()};
$("btnFast").onclick=()=>{S.fast=!S.fast;save();paint()};
$("btnMute").onclick=()=>{S.muted=!S.muted;save();paint()};
document.querySelectorAll("[data-close]").forEach(b=>b.onclick=()=>
  document.querySelectorAll(".modal").forEach(m=>m.classList.remove("show")));
document.querySelectorAll(".modal").forEach(m=>m.onclick=e=>{
  if(e.target===m){ m.classList.remove("show"); assignTo=null; paint(); }});
addEventListener("keydown",e=>{
  // Escape is handled before the input guard: typing in the index search box
  // should still let you back out of the modal
  if(e.key==="Escape"){
    e.target.blur&&e.target.blur(); previewId=null; assignTo=null; paint();
    $("alpha").classList.remove("show"); $("btnAlpha").classList.remove("on");
    document.querySelectorAll(".modal").forEach(m=>m.classList.remove("show"));
    return;
  }
  if(e.target.tagName==="INPUT"||e.target.tagName==="SELECT") return;
  if(e.code==="Space"){e.preventDefault();if(!spinning&&Date.now()>=cdUntil)doRoll()}
  if(e.key==="i"||e.key==="I") openIndex();
});

/* ---------------- loop ---------------- */
const show=$("show"), sx=show.getContext("2d");
const cdFill=document.querySelector("#cdBar i");
/* The showcase is the point of the screen, so it takes everything the layout
   can spare. The height is derived by measuring every sibling in the column
   rather than guessing a constant - the loadout and stat rows change height,
   and a fixed subtraction let the canvas grow until it covered the HUD.
   The backing store is rendered at roughly half scale and stretched: the
   whole scene is haze, bloom and gradient, so the resample is invisible and
   costs a quarter as many pixels to fill. */
const SHOW_SS=0.48;
function fitShow(){
  const M=document.querySelector(".main"), L=document.querySelector(".left");
  let other=0;
  for(const el of L.children) if(el!==show) other+=el.getBoundingClientRect().height+6;
  const w=clamp(L.clientWidth-6,260,1240);
  const h=clamp(M.clientHeight-other-8,200,820);
  show.style.width=w+"px"; show.style.height=h+"px";
  const bw=Math.max(200,Math.round(w*SHOW_SS)), bh=Math.max(150,Math.round(h*SHOW_SS));
  if(show.width!==bw||show.height!==bh){ show.width=bw; show.height=bh; }
}
addEventListener("resize",fitShow);
function loop(t){
  drawBg(t);
  paintShowcase(sx,show.width,show.height,shown(),t);
  if(revAura){ rvx.clearRect(0,0,260,260); paintShowcase(rvx,260,260,revAura,t); }
  if(Date.now()>S.biomeEnd) rollBiome();
  const left=Math.max(0,S.biomeEnd-Date.now());
  $("biomeT").textContent=Math.floor(left/60000)+":"+String(Math.floor(left/1000)%60).padStart(2,"0");
  S.effects=S.effects.filter(e=>e.until>Date.now());
  if(t-(loop.last||0)>500){loop.last=t;paint()}
  if(!spinning){
    const rem=cdUntil-Date.now();
    if(rem>0){cdFill.style.width=(100-rem/cooldown()*100)+"%";$("rollBtn").disabled=true}
    else{cdFill.style.width="0%";$("rollBtn").disabled=false}
  }
  requestAnimationFrame(loop);
}
fitShow(); buildStrip(AURAS[0]);
/* park the strip deep enough that tiles fill the whole width at rest, not
   just the right half */
function parkOn(k){
  const c=reelWrap.clientWidth/2;
  reel.style.transform=`translateX(${c-TILE/2-k*STEP}px)`;
}
function parkReel(){
  const c=reelWrap.clientWidth/2;
  parkOn(Math.min(STRIP-6,Math.max(3,Math.ceil(c/STEP)+1)));
}
parkReel(); addEventListener("resize",parkReel);
paint(); requestAnimationFrame(loop);
</script>
